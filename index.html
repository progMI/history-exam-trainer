..»?","options":{"A":"«Похід у Таврію за волею»","B":"«Київська козаччина» (1855 р.)","C":"Коліївщина","D":"Холодноярська республіка"},"answer":"B"},{"id":335,"topic":"⛪ IV. Кирило-Мефодіївське братство та Тарас Шевченко (1845–1847 рр.)","question":"Про яке таємне політичне товариство, засноване у Києві на початку 1846 року, свідчить донос студента Петрова: «...Університетські професори та випускники збираються таємно, мають персні з іменами святих, читають заборонені книги і марять про знищення самодержавства...»?","options":{"A":"Товариство об'єднаних слов'ян","B":"Кирило-Мефодіївське братство","C":"Масонську ложу «Любов до істини»","D":"Південне товариство декабристів"},"answer":"B"},{"id":336,"topic":"⛪ IV. Кирило-Мефодіївське братство та Тарас Шевченко (1845–1847 рр.)","question":"Хто входив до складу засновників та провідних діячів Кирило-Мефодіївського братства, згідно з протоколами слідства?","options":{"A":"І. Котляревський, В. Каразін, В. Лукашевич","B":"М. Костомаров, В. Білозерський, М. Гулак, П. Куліш, Т. Шевченко","C":"П. Пестель, К. Рилєєв, С. Муравйов-Апостол","D":"М. Шашкевич, І. Вагилевич, Я. Головацький"},"answer":"B"},{"id":337,"topic":"⛪ IV. Кирило-Мефодіївське братство та Тарас Шевченко (1845–1847 рр.)","question":"З якого програмного документа кирило-мефодіївців, написаного Миколою Костомаровим, взято уривок: «...І встане Україна з своєї могили, і знову покличе братів своїх слов'ян... І розпадеться царство Російське, а замість нього утвориться вільна слов'янська спілка республік...»?","options":{"A":"«Статут слов'янського товариства»","B":"«Книга буття українського народу» (або «Закон Божий»)","C":"«Руська Правда»","D":"«Наша пісня, наша дума»"},"answer":"B"},{"id":338,"topic":"⛪ IV. Кирило-Мефодіївське братство та Тарас Шевченко (1845–1847 рр.)","question":"Які основні політичні та соціальні вимоги висували кирило-мефодіївці у своїх відозвах «До братів українців» та «До братів росіян і поляків»?","options":{"A":"Збереження кріпацтва та зміцнення влади царя","B":"Скасування кріпацтва, ліквідація станового поділу, повалення самодержавства, республіканський устрій та створення федерації слов'янських народів із центром у Києві","C":"Негайне приєднання України до складу Австрійської імперії","D":"Створення реєстрового козацтва"},"answer":"B"},{"id":339,"topic":"⛪ IV. Кирило-Мефодіївське братство та Тарас Шевченко (1845–1847 рр.)","question":"Яка видатна книга поезій, видана у Санкт-Петербурзі у 1840 році, перетворила її автора на духовного лідера українського нації та заклала основу ідеології Кирило-Мефодіївського братства?","options":{"A":"«Енеїда»","B":"«Кобзар» Тараса Шевченка","C":"«Русалка Дністрова»","D":"«Чорна рада»"},"answer":"B"},{"id":340,"topic":"⛪ IV. Кирило-Мефодіївське братство та Тарас Шевченко (1845–1847 рр.)","question":"Яке суворе покарання отримав Тарас Шевченко у 1847 році за участь у братстві та написання революційних поем («Сон», «Кавказ»)?","options":{"A":"Його відпустили під нагляд поліції в Полтаву","B":"Заслання солдатом в Оренбурзький окремий корпус із суворою царською забороною «писати і малювати»","C":"Страту через повішення у Санкт-Петербурзі","D":"Вислання за кордон до Франції"},"answer":"B"},{"id":341,"topic":"🏔️V. Українські землі у складі Австрійської імперії: «Руська трійця» та 1848 рік","question":"Які три історико-географічні регіони України перебували у складі Австрійської імперії наприкінці XVIII — у першій половині ХІХ ст.?","options":{"A":"Слобожанщина, Поділля, Крим","B":"Східна Галичина, Північна Буковина, Закарпаття","C":"Волинь, Київщина, Чернігівщина","D":"Запорожжя, Донбас, Одещина"},"answer":"B"},{"id":342,"topic":"🏔️V. Українські землі у складі Австрійської імперії: «Руська трійця» та 1848 рік","question":"Хто очолив селянське повстання на Буковині у 1843–1844 та 1848–1849 роках, вимагаючи скасування панщини та повернення лісів громадам, і став депутатом австрійського парламенту?","options":{"A":"Устим Кармелюк","B":"Лук'ян Кобилиця","C":"Олекса Довбуш","D":"Максим Залізняк"},"answer":"B"},{"id":343,"topic":"🏔️V. Українські землі у складі Австрійської імперії: «Руська трійця» та 1848 рік","question":"Яку назву мало громадсько-культурне об'єднання студентів греко-католицької семінарії у Львові, створене у 1833 році, яке започаткувало національне відродження в Галичині?","options":{"A":"Кирило-Мефодіївське братство","B":"«Руська трійця»","C":"Головна руська рада","D":"Руський собор"},"answer":"B"},{"id":344,"topic":"🏔️V. Українські землі у складі Австрійської імперії: «Руська трійця» та 1848 рік","question":"Хто входив до складу знаменитого товариства «Руська трійця», відомого своєю діяльністю у Львові?","options":{"A":"М. Костомаров, П. Куліш, Т. Шевченко","B":"Маркіян Шашкевич, Іван Вагилевич, Яків Головацький","C":"Лук'ян Кобилиця, Олекса Довбуш, Устим Кармелюк","D":"Д. Зубрицький, М. Михайлович, І. Могильницький"},"answer":"B"},{"id":345,"topic":"🏔️V. Українські землі у складі Австрійської імперії: «Руська трійця» та 1848 рік","question":"Про який альманах, виданий у Будапешті у 1837 році, пише сучасник: «...Це була перша книга в Галичині, надрукована живою народною мовою та цивільним шрифтом, яка спричинила бурю серед польської влади та консервативного духовенства, котрі заборонили її поширення...»?","options":{"A":"«Український вісник»","B":"«Русалка Дністрова»","C":"«Основа»","D":"«Зоря Галицька»"},"answer":"B"},{"id":346,"topic":"🏔️V. Українські землі у складі Австрійської імперії: «Руська трійця» та 1848 рік","question":"Яка перша легальна українська політична організація виникла у Львові під час європейської революції «Весна народів» у травні 1848 року?","options":{"A":"Руський собор","B":"Головна руська рада (ГРР)","C":"«Руська трійця»","D":"Центральна рада галицька"},"answer":"B"},{"id":347,"topic":"🏔️V. Українські землі у складі Австрійської імперії: «Руська трійця» та 1848 рік","question":"Хто очолив Головну руську раду у Львові в 1848 році, виступивши від імені всього українського населення Галичини?","options":{"A":"Маркіян Шашкевич","B":"Єпископ Григорій Яхимович","C":"Іван Вагилевич","D":"Лук'ян Кобилиця"},"answer":"B"},{"id":348,"topic":"🏔️V. Українські землі у складі Австрійської імперії: «Руська трійця» та 1848 рік","question":"З маніфесту Головної руської ради 1848 року: «...Ми, галицькі русини, належимо до великого українського народу, що налічує 15 мільйонів... Ми вимагаємо поділу Галичини на дві частини — польську та українську, та запровадження рідної мови в школах та судах...» — уперше офіційно проголошував:","options":{"A":"Бажання галичан підкоритися польській шляхті","B":"Ідею єдності (соборності) галицьких русинів із наддніпрянськими українцями та вимогу національно-територіальної автономії","C":"Вимогу створити окреме Козацьке військо","D":"Намір вийти зі складу Австрійської імперії"},"answer":"B"},{"id":349,"topic":"🏔️V. Українські землі у складі Австрійської імперії: «Руська трійця» та 1848 рік","question":"Яка перша газета українською мовою почала видаватися Головною руською радою у Львові в 1848 році?","options":{"A":"«Основа»","B":"«Зоря Галицька»","C":"«Діло»","D":"«Буковина»"},"answer":"B"},{"id":350,"topic":"🏔️V. Українські землі у складі Австрійської імперії: «Руська трійця» та 1848 рік","question":"Який важливий соціально-економічний наслідок для українських селян Галичини, Буковини та Закарпаття мала революція «Весна народів» 1848 року?","options":{"A":"Запровадження нових податків на землю","B":"Остаточне і повне скасування панщини (селянська реформа в Австрійській імперії)","C":"Перетворення селян на козаків-реєстровців","D":"Масове виселення селян до Сибіру"},"answer":"B"},{"id":351,"topic":"📝 VI. Культурні та релігійні процеси першої половини ХІХ століття","question":"Про яку видатну релігійну подію 1839 року на Правобережжі та Білорусі свідчить синодальний указ: «...Постановили ми Полоцький собор скликати, Українську греко-католицьку церкву на території Російської імперії повністю ліквідувати, а всіх парафіян та священиків примусово приєднати до Російської православної церкви...»?","options":{"A":"Запровадження Берестейської унії","B":"Ліквідацію УГКЦ (уніатської церкви) на Правобережній Україні царським урядом","C":"Заснування Києво-Печерської лаври","D":"Підпорядкування Київської митрополії Москві"},"answer":"B"},{"id":352,"topic":"📝 VI. Культурні та релігійні процеси першої половини ХІХ століття","question":"Який видатний перший соціально-побутовий роман в історії української літератури, написаний Пантелеймоном Кулішем, описував події доби Руїни і Чорну раду 1663 року?","options":{"A":"«Енеїда»","B":"«Чорна рада»","C":"«Маруся»","D":"«Тарас Бульба»"},"answer":"B"},{"id":353,"topic":"📝 VI. Культурні та релігійні процеси першої половини ХІХ століття","question":"Який відомий історик, мовознавець, перший ректор Київського університету (1834 р.) став автором видатних збірок українських народних пісень, що заклали основу наукового вивчення фольклору?","options":{"A":"Микола Костомаров","B":"Михайло Максимович","C":"Пантелеймон Куліш","D":"Василь Каразін"},"answer":"B"},{"id":354,"topic":"📝 VI. Культурні та релігійні процеси першої половини ХІХ століття","question":"Хто написав видатну повість «Маруся» (1834 р.) та «Конотопська відьма», ставши основоположником художньої прози в новій українській літературі та отримавши прізвисько «батька української прози»?","options":{"A":"Іван Котляревський","B":"Квітка-Основ'яненко (Григорій Квітка)","C":"Пантелеймон Куліш","D":"Тарас Шевченко"},"answer":"B"},{"id":355,"topic":"📝 VI. Культурні та релігійні процеси першої половини ХІХ століття","question":"Який стиль мистецтва з його ідеалізацією козацького минулого, інтересом до народної творчості, фольклору та внутрішнього світу людини став панівним в українській культурі першої половини ХІХ століття?","options":{"A":"Класицизм","B":"Романтизм","C":"Реалізм","D":"Модернізм"},"answer":"B"},{"id":356,"topic":"📝 VI. Культурні та релігійні процеси першої половини ХІХ століття","question":"Про яку будівлю Одеси, зведену в першій половині ХІХ ст. за проектом архітекторів Тома де Томона та Франческо Боффо, сучасники писали як про одну з найкрасивіших у Європі?","options":{"A":"Воронцовський палац","B":"Одеський оперний театр (перша будівля)","C":"Потьомкінські сходи","D":"Будинок Русова"},"answer":"B"},{"id":357,"topic":"📝 VI. Культурні та релігійні процеси першої половини ХІХ століття","question":"Яка визначна історична пам’ятка архітектури стилю класицизму, зведена у Києві у 1837–1843 роках за проектом Вікентія Беретті, стала символом вищої освіти міста і мала характерний червоний колір стін?","options":{"A":"Будинок вчителя","B":"Головний («Червоний») корпус Київського університету","C":"Маріїнський палац","D":"Національна опера України"},"answer":"B"},{"id":358,"topic":"📝 VI. Культурні та релігійні процеси першої половини ХІХ століття","question":"Яка міжнародна подія — Східна (Кримська) війна 1853–1856 років — загострила соціальні суперечності в Україні та призвела до кризи кріпосницької системи в Російській імперії?","options":{"A":"Повстання декабристів","B":"Кримська війна","C":"Наполеонівські війни","D":"Польське повстання"},"answer":"B"},{"id":359,"topic":"📝 VI. Культурні та релігійні процеси першої половини ХІХ століття","question":"Про яку козацьку структуру на території Російської імперії (1828–1860 рр.) свідчить уривок: «...Сформоване було з козаків Задунайської Січі, які під проводом кошового Йосипа Гладкого під час турецької війни перейшли на бік царя. Розселили їх на узбережжі Азовського моря для охорони кордонів...»?","options":{"A":"Чорноморське козацьке військо","B":"Азовське козацьке військо","C":"Кубанське козацьке військо","D":"Бузьке козацьке військо"},"answer":"B"},{"id":360,"topic":"📝 VI. Культурні та релігійні процеси першої половини ХІХ століття","question":"Який головний підсумок розвитку українського національного руху в першій половині ХІХ століття на українських землях в обох імперіях?","options":{"A":"Повний занепад та асиміляція українців","B":"Перехід від першого (етнографічно-дослідницького) етапу національного відродження до другого (культурно-літературного та політичного), формування перших концепцій автономії та соборності України завдяки діяльності Кирило-Мефодіївського братства та Головної руської ради","C":"Негайне проголошення повної державної самостійності УНР","D":"Створення єдиної Української православної автокефальної церкви"},"answer":"B"},{"id":361,"topic":"І. Реформи 1860–1870-х років, Громадівський рух та Хлопомани","question":"Про яку подію лютого 1861 року свідчить Маніфест Олександра ІІ: «...Кріпосне право на селян, які осіли в поміщицьких маєтках, і на дворових людей скасовується назавжди. Селянам надаються права вільних сільських обителів...»?","options":{"A":"Указ про волоки","B":"Селянську реформу (скасування кріпацтва)","C":"Жалувану грамоту дворянству","D":"Введення військових поселень"},"answer":"B"},{"id":362,"topic":"І. Реформи 1860–1870-х років, Громадівський рух та Хлопомани","question":"Хто такі «тимчасовозобов’язані селяни» згідно з положеннями реформи 1861 року?","options":{"A":"Селяни, які отримали повну волю без жодних виплат","B":"Селяни, які звільнялися від особистої залежності, але мусили відробляти панщину чи платити оброк поміщику до укладення викупної угоди за землю","C":"Козаки, які добровільно записувалися в армію","D":"Іноземні колоністи на півдні України"},"answer":"B"},{"id":363,"topic":"І. Реформи 1860–1870-х років, Громадівський рух та Хлопомани","question":"Про яку реформу місцевого самоврядування 1864 року йдеться в імперському указі: «...Для завідування справами, що стосуються місцевих господарських потреб і користі кожної губернії та повіту, утворюються губернські та повітові установи, які називаються земствами...»?","options":{"A":"Судову реформу","B":"Земську реформу","C":"Військову реформу","D":"Міську реформу"},"answer":"B"},{"id":364,"topic":"І. Реформи 1860–1870-х років, Громадівський рух та Хлопомани","question":"Про який напрям громадського руху на чолі з Володимиром Антоновичем у Києві (кінець 1850-х — початок 1860-х рр.) пише польський публіцист: «...Це молоді шляхтичі польського походження, які заявили, що треба повернутися до народу, серед якого живеш, прийняти його мову, православну віру та служити його інтересам. Називали їх презирливо...»?","options":{"A":"Декабристами","B":"Хлопоманами","C":"Опришками","D":"Уніатами"},"answer":"B"},{"id":365,"topic":"І. Реформи 1860–1870-х років, Громадівський рух та Хлопомани","question":"Яка організація української інтелігенції виникла в Санкт-Петербурзі у 1859 році та видавала перший український щомісячний загальнонауковий і літературно-публіцистичний журнал «Основа»?","options":{"A":"Головна руська рада","B":"Петербурзька громада","C":"Південно-Західне відділення Російського географічного товариства","D":"Товариство об'єднаних слов'ян"},"answer":"B"},{"id":366,"topic":"І. Реформи 1860–1870-х років, Громадівський рух та Хлопомани","question":"Про якого видатного громадсько-політичного діяча, історика, лідера «Старої громади» у Києві, автора праць «Громада» та ідеолога українського соціалізму свідчить жандармський донос: «...Він бо став головним провідником українського сепаратизму, через що був звільнений з університету і змушений емігрувати до Женеви, де відкрив вільну українську друкарню...»?","options":{"A":"Володимира Антоновича","B":"Михайла Драгоманова","C":"Миколу Костомарова","D":"Михайла Грушевського"},"answer":"B"},{"id":367,"topic":"І. Реформи 1860–1870-х років, Громадівський рух та Хлопомани","question":"Яка легальна наукова установа, заснована у Києві у 1873 році під керівництвом Павла Чубинського та В. Антоновича, стала осередком дослідження історії, етнографії та мови українського народу під виглядом імперського відомства?","options":{"A":"Наукове товариство ім. Шевченка","B":"Південно-Західне відділення Російського географічного товариства","C":"Братство тарасівців","D":"Харківське історико-філологічне товариство"},"answer":"B"},{"id":368,"topic":"🚫 ІІ. Царські заборони: Валуєвський циркуляр та Емський указ","question":"З якого таємного циркуляра міністра внутрішніх справ Російської імперії 1863 року взято цей уривок: «...Ніякої окремої малоросійської мови не було, немає і бути не може, а наріччя, що використовується простолюдом, є та сама російська мова, тільки зіпсована польським впливом...»?","options":{"A":"Емського указа","B":"Валуєвського циркуляра","C":"Октябрського маніфесту","D":"«Ординації Війська Запорозького»"},"answer":"B"},{"id":369,"topic":"🚫 ІІ. Царські заборони: Валуєвський циркуляр та Емський указ","question":"Яку саме сферу використання української мови категорично забороняв Валуєвський циркуляр 1863 року, згідно з текстом: «...друк книг малоросійською мовою як релігійних, так і навчальних, призначених для початкового читання народу, призупинити...»?","options":{"A":"Тільки художню літературу та поезію","B":"Релігійну, навчальну (підручники для шкіл) та наукову літературу","C":"Театральні вистави","D":"Приватне листування"},"answer":"B"},{"id":370,"topic":"🚫 ІІ. Царські заборони: Валуєвський циркуляр та Емський указ","question":"Який таємний указ, підписаний Олександром ІІ у німецькому місті Емс у 1876 році, наклав тотальну заборону на українську культуру: «...Не допускати ввезення в межі імперії будь-яких книг і брошур, надрукованих за кордоном малоросійським наріччям, а також заборонити сценічні вистави та читання на ньому...»?","options":{"A":"Валуєвський циркуляр","B":"Емський указ","C":"Березневі статті","D":"Столипінську реформу"},"answer":"B"},{"id":371,"topic":"🚫 ІІ. Царські заборони: Валуєвський циркуляр та Емський указ","question":"Яку важливу установу у Києві було негайно закріто, а яку газету ліквідовано урядом відразу після підписання Емського указу 1876 року?","options":{"A":"Київський університет та журнал «Основа»","B":"Південно-Західне відділення Російського географічного товариства та газету «Киевский телеграф»","C":"Наукове товариство ім. Шевченка та газету «Зоря Галицька»","D":"Недільні школи та журнал «Громада»"},"answer":"B"},{"id":372,"topic":"🚫 ІІ. Царські заборони: Валуєвський циркуляр та Емський указ","question":"Яке радикальне таємне товариство студентів («Братство тарасівців»), що виникло у 1891 році на могилі Тараса Шевченка в Каневі, уперше висунуло чітку політичну вимогу повної державної незалежності України?","options":{"A":"Стара громада","B":"Братство тарасівців","C":"Кирило-Мефодіївське братство","D":"Русько-українська радикальна партія"},"answer":"B"},{"id":373,"topic":"🏔️ІІІ. Українські землі у складі Австро-Угорщини (друга половина ХІХ ст.)","question":"Яку назву отримав регіон Східної Галичини в європейській пресі наприкінці ХІХ ст. за свій бурхливий розвиток українського книговидання, преси та науки в умовах конституційних свобод Австрійської імперії?","options":{"A":"«Дике Поле»","B":"«Український П'ємонт»","C":"«Нова Росія»","D":"«Мала Росія»"},"answer":"B"},{"id":374,"topic":"🏔️ІІІ. Українські землі у складі Австро-Угорщини (друга половина ХІХ ст.)","question":"Яка видатна науково-культурна установа, заснована у Львові у 1873 році (реорганізована у 1892 р.), завдяки діяльності Михайла Грушевського перетворилася на фактичну всеукраїнську Академію наук?","options":{"A":"Головна руська рада","B":"Наукове товариство імені Шевченка (НТШ)","C":"Просвіта","D":"Руський собор"},"answer":"B"},{"id":375,"topic":"🏔️ІІІ. Українські землі у складі Австро-Угорщини (друга половина ХІХ ст.)","question":"Про яку масову культурно-освітню організацію, засновану у Львові у 1868 році Анатолем Вахнянином, свідчить уривок: «...Метою товариства є піднесення свідомості народу через заснування читалень, видання дешевих книжок рідною мовою, організацію кооперативів та вечорів пам'яті Кобзаря...»?","options":{"A":"Наукове товариство ім. Шевченка","B":"Товариство «Просвіта»","C":"Головну руську раду","D":"Русько-українську радикальну партію"},"answer":"B"},{"id":376,"topic":"🏔️ІІІ. Українські землі у складі Австро-Угорщини (друга половина ХІХ ст.)","question":"Який політичний рух в Галичині (І. Шараневич, Я. Головацький) орієнтувався на Російську імперію, заперечував існування окремого українського народу та пропагував використання «язичія»?","options":{"A":"Народовці (українофіли)","B":"Москвофіли (русофіли)","C":"Радикали","D":"Хлопомани"},"answer":"B"},{"id":377,"topic":"🏔️ІІІ. Українські землі у складі Австро-Угорщини (друга половина ХІХ ст.)","question":"Яка громадсько-політична течія в Галичині 1860–1880-х років (В. Барвінський, Ю. Романчук), що виникла на противагу москвофілам, спиралася на ідеї соборності України, розвивала народну мову та заснувала товариство «Просвіта» і газету «Діло»?","options":{"A":"Хлопомани","B":"Народовці","C":"Чорносотенці","D":"Декабристи"},"answer":"B"},{"id":378,"topic":"🏔️ІІІ. Українські землі у складі Австро-Угорщини (друга половина ХІХ ст.)","question":"Яку назву мала перша українська політична партія європейського типу, заснована у Львові у 1890 році Іваном Франком та Михайлом Павликом, що поєднувала ідеї соціалізму та захисту прав українців?","options":{"A":"Українська національно-демократична партія (УНДП)","B":"Русько-українська радикальна партія (РУРП)","C":"Революційна українська партія (РУП)","D":"Українська соціал-демократична партія (УСДП)"},"answer":"B"},{"id":379,"topic":"🏔️ІІІ. Українські землі у складі Австро-Угорщини (друга половина ХІХ ст.)","question":"Про яку угоду 1890 року («Нову еру») між лідерами народовців (Ю. Романчук) та австрійським урядом і польськими магнатами свідчить преса: «...Українці обіцяли лояльність Габсбургам, а уряд натомість відкрив українські гімназії, кафедру історії України у Львівському університеті та визнав український правопис...»?","options":{"A":"Гадяцький трактат","B":"«Нову еру»","C":"Куруківську угоду","D":"Андрусівський мир"},"answer":"B"},{"id":380,"topic":"🏔️ІІІ. Українські землі у складі Австро-Угорщини (друга половина ХІХ ст.)","question":"Який загальний підсумок розвитку українського руху наприкінці ХІХ століття?","options":{"A":"Повний крах та асиміляція української культури в обох імперіях","B":"Перехід українського національного руху від культурницької фази до політичної, поява перших політичних партій, висунення вимог автономії (Наддніпрянщина) та самостійності й поділу Галичини, що підготувало націю до подій початку ХХ століття","C":"Створення Української козацької республіки у складі Австрії","D":"Добровільне скасування українцями своєї мови на користь латини"},"answer":"B"},{"id":381,"topic":"І. Поява перших партій Наддніпрянщини та революція 1905–1907 років","question":"Про заснування якої першої політичної партії у Наддніпрянській Україні (Харків, 1900 р.) свідчить уривок: «...Група студентської молоді (Д. Антонович, М. Русов) створила організацію, що ставила за мету боротьбу за права робітників і селян, а її першою програмою став радикальний памфлет \"Самостійна Україна\"...»?","options":{"A":"Українську соціал-демократичну робітничу партію (УСДРП)","B":"Революційну українську партію (РУП)","C":"Українську народну партію (УНП)","D":"Українську демократично-радикальну партію (УДРП)"},"answer":"B"},{"id":382,"topic":"І. Поява перших партій Наддніпрянщини та революція 1905–1907 років","question":"З якого видатного політичного маніфесту, написаного харківським адвокатом Миколою Міхновським у 1900 році, взято ці слова: «...Одна, єдина, нероздільна, вільна, самостійна Україна від Карпат аж по Кавказ — се наш ідеал... Усі, хто на цілій Україні не за нас, ті проти нас...»?","options":{"A":"«Книга буття українського народу»","B":"Брошури «Самостійна Україна»","C":"«Маніфесту Братства тарасівців»","D":"Конституції Пилипа Орлика"},"answer":"B"},{"id":383,"topic":"І. Поява перших партій Наддніпрянщини та революція 1905–1907 років","question":"Яку назву мала перша суто самостійницька партія Наддніпрянщини, заснована М. Міхновським у 1902 році після його виходу з РУП через незгоди щодо національного питання?","options":{"A":"Українська соціал-демократична партія (УСДП)","B":"Українська народна партія (УНП)","C":"Революційна українська партія (РУП)","D":"Товариство українських поступовців (ТУП)"},"answer":"B"},{"id":384,"topic":"І. Поява перших партій Наддніпрянщини та революція 1905–1907 років","question":"Про яку подію революції 1905–1907 рр. на Одещині свідчить рапорт губернатора: «...Команда військового корабля підняла червоний прапор, перебила офіцерів і підійшла до одеського порту, де вирував загальний страйк робітників. Це викликало паніку серед командування...»?","options":{"A":"Повстання на крейсері «Очаків»","B":"Повстання на панцернику (броненосці) «Потьомкін»","C":"Повстання Саперного батальйону в Києві","D":"Сорочинську трагедію"},"answer":"B"},{"id":385,"topic":"І. Поява перших партій Наддніпрянщини та революція 1905–1907 років","question":"Який імперський документ ХІХ–ХХ ст. (Маніфест 17 жовтня 1905 р.) Миколи ІІ тимчасово скасував дію Емського указу, про що свідчить уривок: «...Дарувати населенню непорушні основи громадянської свободи: недоторканність особи, свободу совісті, слова, зборів і спілок...»?","options":{"A":"Валуєвський циркуляр","B":"Октябрський маніфест 1905 року","C":"Столипінський указ","D":"Березневі статті"},"answer":"B"},{"id":386,"topic":"І. Поява перших партій Наддніпрянщини та революція 1905–1907 років","question":"Яку назву мала перша газета українською мовою в Наддніпрянській Україні, що почала видаватися братами Шеметівами в Лубнах наприкінці 1905 року на хвилі революційних свобод?","options":{"A":"«Основа»","B":"«Хлібороб»","C":"«Рада»","D":"«Діло»"},"answer":"B"},{"id":387,"topic":"І. Поява перших партій Наддніпрянщини та революція 1905–1907 років","question":"Яка щоденна українська громадсько-політична газета, яку фінансував відомий меценат і цукрозаводчик Євген Чикаленко, видавалася в Києві у 1906–1914 роках і була головним рупором українського руху?","options":{"A":"«Хлібороб»","B":"«Рада»","C":"«Зоря Галицька»","D":"«Киевская старина»"},"answer":"B"},{"id":388,"topic":"І. Поява перших партій Наддніпрянщини та революція 1905–1907 років","question":"Як називалося об'єднання українських депутатів (очолюване Іллєю Шрагом), яке виникло в І та ІІ Державних думах Російської імперії у 1906–1907 роках для захисту прав української мови та автономії?","options":{"A":"Головна руська рада","B":"Українська думська громада","C":"Братство тарасівців","D":"Товариство українських поступовців"},"answer":"B"},{"id":389,"topic":"І. Поява перших партій Наддніпрянщини та революція 1905–1907 років","question":"Яку назву мала міжпартійна політична організація (очолювана М. Грушевським, С. Єфремовим, Є. Чикаленком), утворена в Києві у 1908 році після поразки революції, яка перейшла до підпільної культурницької діяльності під гаслом конституційного парламентаризму?","options":{"A":"Революційна українська партія (РУП)","B":"Товариство українських поступовців (ТУП)","C":"Українська народна партія (УНП)","D":"Союз визволення України (СВУ)"},"answer":"B"},{"id":390,"topic":"🌾 ІІ. Столипінська аграрна реформа та суспільні кризи (1906–1914 рр.)","question":"З якого указу голови Ради міністрів Російської імперії Петра Столипіна (1906 р.) взято уривок: «...Кожен домоволодар, який володіє надільною грошовою землею на общинному праві, може в будь-який час вимагати закріплення за ним у приватну власність належної йому частини землі...»?","options":{"A":"Маніфесту про скасування кріпацтва","B":"Столипінської аграрної реформи","C":"«Устави на волоки»","D":"Емського указа"},"answer":"B"},{"id":391,"topic":"🌾 ІІ. Столипінська аграрна реформа та суспільні кризи (1906–1914 рр.)","question":"Що означав термін «хутір» в ході реалізації Столипінської аграрної реформи на українських землях?","options":{"A":"Окремий земельний наділ, який селянин отримував у приватну власність в межах села, не переносячи туди житло","B":"Відокремлена селянська садиба із земельною ділянкою, розташована за межами села, куди селянин переносив своє житло і господарство","C":"Козацьке військове поселення","D":"Панський фільварок"},"answer":"B"},{"id":392,"topic":"🌾 ІІ. Столипінська аграрна реформа та суспільні кризи (1906–1914 рр.)","question":"Що означав термін «відруб» в ході реалізації реформи Петра Столипіна?","options":{"A":"Покарання селян через конфіскацію майна","B":"Земельна ділянка, яку селянин отримував у приватну власність в одному масиві замість кількох смуг у різних полях, залишаючи садибу в селі","C":"Спільне пасовище общини","D":"Виїзд селян на роботу до міст"},"answer":"B"},{"id":393,"topic":"🌾 ІІ. Столипінська аграрна реформа та суспільні кризи (1906–1914 рр.)","question":"Який регіон Російської імперії став основним напрямком масового переселення (міграції) українських селян у 1906–1912 роках через безземелля та урядову політику колонізації окраїн?","options":{"A":"Правобережна Україна","B":"Сибір, Далекий Схід (Зелений Клин) та Центральна Азія","C":"Західна Європа та Америка","D":"Кримський півострів"},"answer":"B"},{"id":394,"topic":"🌾 ІІ. Столипінська аграрна реформа та суспільні кризи (1906–1914 рр.)","question":"Який загальний економічний підсумок мала Столипінська реформа на українських землях порівняно з іншими регіонами імперії?","options":{"A":"Повну руйнацію та зубожіння селян","B":"Україна стала лідером за кількістю селян, що вийшли з общини (понад 50% на Правобережжі), сформувався міцний прошарок приватних селян-власників (куркулів) та зріс експорт зерна","C":"Повне відновлення кріпосного права","D":"Передачу всієї землі козакам-запорожцям"},"answer":"B"},{"id":395,"topic":"🌾 ІІ. Столипінська аграрна реформа та суспільні кризи (1906–1914 рр.)","question":"Про яку резонансну судову справу в Києві (1911–1913 рр.) свідчить преса: «...Судовий процес над євреєм Менделем Бейлісом, звинуваченим чорносотенцями у ритуальному вбивстві хлопчика Андрія Ющинського, сколихнув усю імперію. Проте присяжні київські селяни повністю виправдали підсудного...»?","options":{"A":"Справу Семена Палія","B":"«Справу Бейліса»","C":"Справу Кирило-мефодіївців","D":"Повстання Чернігівського полку"},"answer":"B"},{"id":396,"topic":"🌾 ІІ. Столипінська аграрна реформа та суспільні кризи (1906–1914 рр.)","question":"Яка шовіністична організація («Союз руського народу») активно розпалювала антиукраїнські та антисемітські настрої в Києві та Одесі на початку ХХ століття, організовуючи погроми?","options":{"A":"Народовці","B":"Чорносотенці","C":"Товариство українських поступовців","D":"Хлопомани"},"answer":"B"},{"id":397,"topic":"🏔️ІІІ. Західноукраїнські землі: «Три порти» та напередодні війни","question":"Яку назву у політичному житті Галичини початку ХХ ст. отримала масова кампанія українців, що завершилася у 1907 році ухваленням австрійським парламентом закону про: «...запровадження загального, рівного і прямого виборчого права для всіх чоловіків імперії без майнового цензу...»?","options":{"A":"Кампанію за поділ Галичини","B":"Боротьбу за загальне виборче право (виборчу реформу 1907 року)","C":"Створення українського університету","D":"Початок «Нової ери»"},"answer":"B"},{"id":398,"topic":"🏔️ІІІ. Західноукраїнські землі: «Три порти» та напередодні війни","question":"Навколо будівництва якого закладу у Львові точилася запекла, кривава боротьба між українськими студентами (Адам Коцко) та польською адміністрацією на початку ХХ століття?","options":{"A":"Українського оперного театру","B":"Окремого Українського університету у Львові","C":"Наукового товариства ім. Шевченка","D":"Товариства «Просвіта»"},"answer":"B"},{"id":399,"topic":"🏔️ІІІ. Західноукраїнські землі: «Три порти» та напередодні війни","question":"Які три великі українські молодіжні воєнізовано-спортивні організації («Сокіл», «Січ», «Пласт») виникли в Галичині напередодні Першої світової війни для виховання патріотичної молоді?","options":{"A":"Громади, братства, цехи","B":"«Сокіл», «Січ», «Пласт» (а також «Стрілецькі товариства»)","C":"РУП, УНП, ТУП","D":"Опришки, гайдамаки, козаки"},"answer":"B"},{"id":400,"topic":"🏔️ІІІ. Західноукраїнські землі: «Три порти» та напередодні війни","question":"Який загальний підсумок розвитку українських земель напередодні Першої світової війни (станом на літо 1914 року)?","options":{"A":"Повна втрата національної свідомості та припинення боротьби","B":"Український рух в обох імперіях повністю структурувався, сформував чіткі політичні програми (від автономії до самостійності), створив легальні організації, пресу та молодіжні структури, перебуваючи на порозі великого державотворчого вибуху 1917–1918 років","C":"Добровільний вхід України до складу Османської імперії","D":"Відновлення Запорозької Січі в колишніх межах"},"answer":"B"},{"id":401,"topic":"I. Перша світова війна та початок Української революції (1914–1917 рр.)","question":"Про яку організацію, створену у Львові в серпні 1914 року українськими партіями Галичини, свідчить уривок: «...Ми, представники руського народу, закликаємо українців підтримати Австро-Угорщину проти Російської імперії, яка несе нам національну смерть...»?","options":{"A":"Союз визволення України (СВУ)","B":"Головну українську раду (ГУР)","C":"Українську центральну раду (УЦР)","D":"Загальну українську раду (ЗУР)"},"answer":"B"},{"id":402,"topic":"I. Перша світова війна та початок Української революції (1914–1917 рр.)","question":"Яка організація емігрантів із Наддніпрянщини у Відні (1914 р.) видала відозву, де проголошувала своєю метою створення конституційної монархії під протекторатом Габсбургів: «...Тільки самостійна Україна, що утвориться внаслідок поразки Росії, зможе стати надійним бар’єром проти московського наступу на Європу...»?","options":{"A":"Головна українська рада","B":"Союз визволення України (СВУ)","C":"Комітет Південно-Західного фронту","D":"Братство тарасівців"},"answer":"B"},{"id":403,"topic":"I. Перша світова війна та початок Української революції (1914–1917 рр.)","question":"Про яке перше українське національне військове формування у складі австрійської армії (1914 р.) йдеться в хроніці: «...Присягнули вони на вірність Україні на стадіоні у Стрию. Перше бойове хрещення прийняли на Ужоцькому перевалі в Карпатах, а найславетніший бій дали на горі Маківка...»?","options":{"A":"Полки Червоного козацтва","B":"Українські січові стрільці (УСС)","C":"Гайдамацький кіш Слобідської України","D":"Чорні запорожці"},"answer":"B"},{"id":404,"topic":"I. Перша світова війна та початок Української революції (1914–1917 рр.)","question":"Який жорстокий окупаційний режим царської влади на загарбаних землях Галичини та Буковини (1914–1915 рр.) граф Георгій Бобринський охарактеризував словами: «...Галичина — це споконвічна російська земля, тому тут негайно мають бути закриті всі українські школи, газети \"Просвіти\", а мова малоросійська заборонена...»?","options":{"A":"Галицько-Волинське генерал-губернаторство","B":"Київське генерал-губернаторство","C":"Малоросійську колегію","D":"Директорію УНР"},"answer":"A"},{"id":405,"topic":"I. Перша світова війна та початок Української революції (1914–1917 рр.)","question":"Про яку подію березня 1917 року в Києві свідчить спогад Дмитра Дорошенка: «...Зійшлися представники Товариства українських поступовців, соціал-демократів та громадських організацій і утворили спільний представницький орган, головою якого заочно обрали Михайла Грушевського...»?","options":{"A":"Проголошення Гетьманату","B":"Заснування Української Центральної Ради (УЦР)","C":"Створення Директорії УНР","D":"Скликання Всеукраїнського національного конгресу"},"answer":"B"},{"id":406,"topic":"I. Перша світова війна та початок Української революції (1914–1917 рр.)","question":"З якого документа УЦР (червень 1917 р.) взято ці слова: «...Хай буде Україна вільною. Не одділяючись від всієї Росії, не розриваючи з державою російською, хай народ український на своїй землі має право сам порядкувати своїм життям...»?","options":{"A":"Першого Універсалу","B":"Другого Універсалу","C":"Третього Універсалу","D":"Четвертого Універсалу"},"answer":"A"},{"id":407,"topic":"I. Перша світова війна та початок Української революції (1914–1917 рр.)","question":"Про який компромісний документ липня 1917 року, що викликав збройний виступ самостійників (полуботківців), свідчить уривок: «...УЦР проголошує, що вона рішуче виступає проти замірів самовільного здійснення автономії України до Установчих зборів, а Тимчасовий уряд визнає Генеральний секретаріат вищим органом влади...»?","options":{"A":"Перший Універсал","B":"Другий Універсал","C":"Тимчасову інструкцію","D":"Маніфест самостійників"},"answer":"B"},{"id":408,"topic":"I. Перша світова війна та початок Української революції (1914–1917 рр.)","question":"Який документ УЦР (листопад 1917 р.), ухвалений після більшовицького перевороту в Петрограді, проголошував: «...Віднині Україна стає Українською Народною Республікою. Не одділяючись від республіки Російської, ми твердо станемо на нашій землі, щоб силами нашими помогти всій Росії...»?","options":{"A":"Другий Універсал","B":"Третій Універсал","C":"Четвертий Універсал","D":"Декларацію прав народів"},"answer":"B"},{"id":409,"topic":"I. Перша світова війна та початок Української революції (1914–1917 рр.)","question":"З якого епохального документа УЦР (ухваленого 9 січня 1918 р. за старим стилем) взято ці слова: «...Однині Українська Народна Республіка стає самостійною, ні від кого не залежною, вільною, суверенною державою українського народу...»?","options":{"A":"Другого Універсалу","B":"Третього Універсалу","C":"Четвертого Універсалу","D":"Акту злуки"},"answer":"C"},{"id":410,"topic":"I. Перша світова війна та початок Української революції (1914–1917 рр.)","question":"Про який героїчний бій січня 1918 року проти більшовицьких військ Муравйова свідчить уривок: «...Триста юнаків — студентів та гімназистів — заступили шлях загарбникам на залізничній станції. Майже всі вони загинули, але стримали ворога на кілька днів, що дало змогу підписати мир у Бресті...»?","options":{"A":"Бій під Мотовилівкою","B":"Бій під Крутами","C":"Бій за гору Маківка","D":"Оборону Базару"},"answer":"B"},{"id":411,"topic":"I. Перша світова війна та початок Української революції (1914–1917 рр.)","question":"Який міжнародний договір лютого 1918 року став першим мирним договором у Першій світовій війні, за яким Четверний союз визнав УНР незалежною державою: «...Німеччина та Австро-Угорщина зобов'язуються надати військову допомогу УНР для вигнання більшовиків, а Україна постачатиме хліб та інше продовольство...»?","options":{"A":"Версальський мир","B":"Брест-Литовський мирний договір","C":"Варшавську угоду","D":"Ризький мир"},"answer":"B"},{"id":412,"topic":"⚔️ II. Доба Гетьманату, Директорії УНР та ЗУНР (1918–1921 рр.)","question":"Яку історичну подію 29 квітня 1918 року на Всеукраїнському з'їзді хліборобів описує літопис революції: «...У приміщенні київського цирку зібралися землевласники, які висловили недовіру Центральній Раді за її соціалістичні експерименти з землею і проголосили генерала Павла Скоропадського новим правителем держави...»?","options":{"A":"Проголошення Директорії","B":"Державний переворот та встановлення Української Держави (Гетьманату)","C":"Проголошення Четвертого Універсалу","D":"Скликання Трудового конгресу"},"answer":"B"},{"id":413,"topic":"⚔️ II. Доба Гетьманату, Директорії УНР та ЗУНР (1918–1921 рр.)","question":"Які кроки в культурній сфері здійснив гетьман Павло Скоропадський протягом кількох місяців 1918 року, згідно з офіційними актами?","options":{"A":"Закрив усі українські друкарні та школи","B":"Заснував Українську академію наук (очолену В. Вернадським), два державні університети (у Києві та Кам'янці-Подільському), Національну бібліотеку та галерею","C":"Заборонив діяльність православної церкви","D":"Перевів усю освіту на німецьку мову"},"answer":"B"},{"id":414,"topic":"⚔️ II. Доба Гетьманату, Директорії УНР та ЗУНР (1918–1921 рр.)","question":"Про яке повстання восени 1918 року свідчить Відозва: «...Оскільки гетьман Скоропадський видав грамоту про федерацію з майбутньою небільшовицькою Росією, ми, представники Українського національного союзу у Білій Церкві, оголошуємо повстання і відновлення УНР під проводом...»?","options":{"A":"Повстання більшовиків","B":"Повстання Директорії УНР (на чолі з В. Винниченком та С. Петлюрою)","C":"Виступ анархістів Нестора Махна","D":"Листопадовий чин у Львові"},"answer":"B"},{"id":415,"topic":"⚔️ II. Доба Гетьманату, Директорії УНР та ЗУНР (1918–1921 рр.)","question":"Уривок із відозви від 1 листопада 1918 року: «...Руський народе! Вночі українські військові загони на чолі з Дмитром Вітовським зайняли всі урядові установи Львова. Проголошується влада Українського Національного Секретаріату...» — описує подію під назвою:","options":{"A":"Чорна рада","B":"Листопадовий чин (Листопадова революція в Галичині)","C":"Проголошення Третього Універсалу","D":"Початок Хмельниччини"},"answer":"B"},{"id":416,"topic":"⚔️ II. Доба Гетьманату, Директорії УНР та ЗУНР (1918–1921 рр.)","question":"Яку назву отримала республіка, офіційно проголошена у листопаді 1918 року на українських землях колишньої Австро-Угорщини (Галичина, Буковина, Закарпаття), президентом якої став Євген Петрушевич?","options":{"A":"Українська Держава","B":"Західноукраїнська Народна Республіка (ЗУНР)","C":"Галицька Соціалістична Радянська Республіка","D":"УНР Рад"},"answer":"B"},{"id":417,"topic":"⚔️ II. Доба Гетьманату, Директорії УНР та ЗУНР (1918–1921 рр.)","question":"З якого історичного документа від 22 січня 1919 року взято цей текст: «...Однині зливаються в одно віками відірвані одна від одної частини єдиної України — Західноукраїнська Народна Республіка і Наддніпрянська Велика Українська Народна Республіка... Однині є єдина незалежна Українська Народна Республіка...»?","options":{"A":"Четвертого Універсалу","B":"Акту Злуки (Універсалу Соборності)","C":"Варшавської угоди","D":"Ризького договору"},"answer":"B"},{"id":418,"topic":"⚔️ II. Доба Гетьманату, Директорії УНР та ЗУНР (1918–1921 рр.)","question":"Про яку військову операцію Української Галицької Армії (УГА) червня 1919 року пише історик: «...Командувач УГА генерал Олександр Греков розпочав блискучий наступ, прорвав польський фронт під Чортковом і змусив супротивника панічно відступати на десятки кілометрів, проте через брак набоїв наступ захлинувся...»?","options":{"A":"Київську катастрофу","B":"Чортківську офензиву","C":"Другий зимовий похід","D":"Бій під Крутами"},"answer":"B"},{"id":419,"topic":"⚔️ II. Доба Гетьманату, Директорії УНР та ЗУНР (1918–1921 рр.)","question":"Яку назву отримав військовий феномен серпня 1919 року, коли об'єднані армії УНР та УГА без бою зайняли Київ, але з іншого боку до міста увійшли білогвардійські війська генерала Денікіна, що змусило українців відступити?","options":{"A":"«Чортківська офензива»","B":"«Київська катастрофа»","C":"«Трикутник смерті»","D":"«Базарська трагедія»"},"answer":"B"},{"id":420,"topic":"⚔️ II. Доба Гетьманату, Директорії УНР та ЗУНР (1918–1921 рр.)","question":"Як у хроніках описували трагічний стан українських армій наприкінці 1919 року на Поділлі: «...Війська УНР та УГА опинилися в оточенні більшовиків, білогвардійців та поляків, а лютий тиф викосив понад дві третини особового складу. Цей регіон назвали...» ?","options":{"A":"Холодним Яром","B":"«Трикутником смерті»","C":"Зеленим Клином","D":"Гуляйпільською республікою"},"answer":"B"},{"id":421,"topic":"⚔️ II. Доба Гетьманату, Директорії УНР та ЗУНР (1918–1921 рр.)","question":"Про яку військову партизанську операцію армії УНР (грудень 1919 — травень 1920 рр.) під керівництвом Михайла Омеляновича-Павленка свідчить уривок: «...Війська кинули фронт, пішли тилами денікінців та більшовиків, пройшли боями понад 2500 кілометрів, зберігши прапор армії та піднявши дух народу...»?","options":{"A":"Другий зимовий похід","B":"Перший Зимовий похід","C":"Чортківську офензиву","D":"Брусиловський прорив"},"answer":"B"},{"id":422,"topic":"⚔️ II. Доба Гетьманату, Директорії УНР та ЗУНР (1918–1921 рр.)","question":"З якого таємного документа квітня 1920 року між С. Петлюрою та Ю. Пілсудським взято умови: «...Польща визнає право УНР на незалежність на чолі з Головним Отаманом С. Петлюрою, а Україна натомість зрікається своїх прав на Східну Галичину та Західну Волинь на користь Польщі...»?","options":{"A":"Ризького договору","B":"Варшавської угоди","C":"Зборівського миру","D":"Брест-Литовського миру"},"answer":"B"},{"id":423,"topic":"⚔️ II. Доба Гетьманату, Директорії УНР та ЗУНР (1918–1921 рр.)","question":"Яка міжнародна угода березня 1921 року між Польщею, РСФРР та УСРР остаточно поховала незалежність УНР, поділивши українські землі між поляками та більшовиками: «...Польща визнає УСРР як єдину законну владу в Україні, а кордон встановлюється по річці Збруч...»?","options":{"A":"Брест-Литовський мир","B":"Ризький мирний договір","C":"Андрусівське перемир'я","D":"Рапалльський договір"},"answer":"B"},{"id":424,"topic":"⚔️ II. Доба Гетьманату, Директорії УНР та ЗУНР (1918–1921 рр.)","question":"Про яку трагічну подію листопада 1921 року (фінал Другого Зимового походу армії УНР Юрка Тютюнника) свідчить уривок: «...Біля містечка Базар червона кіннота Котовського оточила козаків. 359 полонених героїв відмовилися перейти на бік більшовиків і були розстріляні під співи гімну \"Ще не вмерла Україна\"...»?","options":{"A":"Трагедію під Крутами","B":"Базарську трагедію","C":"Знищення Батурина","D":"Різанину на Солониці"},"answer":"B"},{"id":425,"topic":"III. УСРР в умовах НЕПу та тоталітарного режиму (1920–1930-ті рр.)","question":"З якої постанови ХІ з'їзду РКП(б) (1921 р.) взято уривок, що ініціював перехід від «воєнного комунізму» до нової економічної політики (НЕПу) в Україні: «...Замінити розкладку продовольства, яка забирала весь хліб у селян, фіксованим продовольчим податком, після сплати якого дозволити вільну торгівлю...»?","options":{"A":"Проголошення суцільної колективізації","B":"Запровадження Нової економічної політики (НЕПу)","C":"Початок першої п'ятирічки","D":"Указ про п'ять колосків"},"answer":"B"},{"id":426,"topic":"III. УСРР в умовах НЕПу та тоталітарного режиму (1920–1930-ті рр.)","question":"Про які наслідки першого штучного голоду в Україні (1921–1923 рр.), що охопив південні губернії, свідчить лист Х. Раковського: «...Посуха була велика, але хліб з України масово вивозився на задоволення потреб голодуючого Поволжя та промислових центрів Росії, що прирекло на смерть сотні тисяч українських селян...»?","options":{"A":"Голодомор 1932–1933 рр.","B":"Голод в Україні 1921–1923 рр.","C":"Голод 1946–1947 рр.","D":"Наслідки Столипінської реформи"},"answer":"B"},{"id":427,"topic":"III. УСРР в умовах НЕПу та тоталітарного режиму (1920–1930-ті рр.)","question":"Яку назву отримав офіційний курс радянської влади на XII з'їзді РКП(б) (1923 р.) щодо залучення місцевих національних кадрів до управління та розвитку культури республік, який в Україні дістав назву «українізація»?","options":{"A":"Русифікація","B":"Коренізація (українізація)","C":"Модернізація","D":"Колективізація"},"answer":"B"},{"id":428,"topic":"III. УСРР в умовах НЕПу та тоталітарного режиму (1920–1930-ті рр.)","question":"Хто з радянських наркомів освіти УСРР (1924–1927 рр.) став палким провідником українізації, перевів на українську мову урядове діловодство, пресу, школи та ВНЗ, і був звинувачений у «націонал-ухильництві»?","options":{"A":"Лазар Каганович","B":"Олександр Шумський (а також Микола Скрипник)","C":"Дмитро Мануїльський","D":"Станіслав Косіор"},"answer":"B"},{"id":429,"topic":"III. УСРР в умовах НЕПу та тоталітарного режиму (1920–1930-ті рр.)","question":"Яке відоме літературне гасло — «Геть від Москви! Даєш Європу!» — висунув видатний український письменник Микола Хвильовий під час літературної дискусії 1925–1928 років?","options":{"A":"«Вся влада Радам!»","B":"«Геть від Москви!»","C":"«Кожен хай держить отчину свою!»","D":"«Краще смерть, ніж кріпацтво!»"},"answer":"B"},{"id":430,"topic":"III. УСРР в умовах НЕПу та тоталітарного режиму (1920–1930-ті рр.)","question":"Про яке сфабриковане судове політичне шоу радянської влади у Харківському оперному театрі (1930 р.) свідчить протокол ДПУ: «...На лаві підсудних опинилися 45 провідних українських вчених, зокрема академік Сергій Єфремов, звинувачені у створенні підпільної терористичної організації, яка прагнула відновлення УНР...»?","options":{"A":"Процес проти «Шахтинської справи»","B":"Процес Спілки визволення України (СВУ)","C":"Процес «Українського національного центру»","D":"Справу Промпартії"},"answer":"B"},{"id":431,"topic":"III. УСРР в умовах НЕПу та тоталітарного режиму (1920–1930-ті рр.)","question":"З якої заяви ЦК ВКП(б) (1929 р.) взято курс, що поклав край НЕПу: «...Перейти від обмеження куркульства до повної його ліквідації як класу. Оголосити рік великого перелому і розпочати суцільне створення колгоспів...»?","options":{"A":"Запровадження українізації","B":"Суцільну колективізацію та розкуркулення","C":"Ліквідацію безробіття","D":"Початок освоєння цілини"},"answer":"B"},{"id":432,"topic":"III. УСРР в умовах НЕПу та тоталітарного режиму (1920–1930-ті рр.)","question":"Яку народну назву отримала жорстока постанова ЦВК і РНК СРСР від 7 серпня 1932 року (закон про охорону соціалістичної власності), за якою за розкрадання колгоспного майна (навіть кількох зрізаних колосків хліба) карали смертною карою або 10 роками таборів?","options":{"A":"«Закон про дезертирство»","B":"«Закон про п'ять колосків»","C":"«Устав на волоки»","D":"«Потік і розграбування»"},"answer":"B"},{"id":433,"topic":"III. УСРР в умовах НЕПу та тоталітарного режиму (1920–1930-ті рр.)","question":"Про який жахливий злочин тоталітарного сталінського режиму свідчить уривок: «...У селян забирали не лише зерно за планом хлібозаготівель, а взагалі всі продукти харчування — сушені фрукти, картоплю, буряки. Села заносили на \"чорні дошки\", оточували військами ДПУ, прирікаючи мільйони людей на люту смерть від голоду...»?","options":{"A":"Голод 1921–1923 рр.","B":"Голодомор 1932–1933 років (геноцид українського народу)","C":"Голод 1946–1947 рр.","D":"Столипінську реформу"},"answer":"B"},{"id":434,"topic":"III. УСРР в умовах НЕПу та тоталітарного режиму (1920–1930-ті рр.)","question":"Яку назву отримало трагічне покоління діячів української культури, науки та літератури 1920–1930-х років (Лесь Курбас, Микола Куліш, Валер'ян Підмогильний), які були масово розстріляні за наказами НКВС в урочищі Сандармох під час Великого терору 1937–1938 років?","options":{"A":"«Шістдесятники»","B":"«Розстріляне відродження»","C":"«Руська трійця»","D":"«Хлопомани»"},"answer":"B"},{"id":435,"topic":"III. УСРР в умовах НЕПу та тоталітарного режиму (1920–1930-ті рр.)","question":"Хто став митрополитом унікальної Української автокефальної православної церкви (УАПЦ), заснованої на Всеукраїнському церковному соборі в Києві у 1021 році, яка була повністю ліквідована сталінським режимом наприкінці 1920-х років?","options":{"A":"Андрей Шептицький","B":"Василь Липківський («народний митрополит»)","C":"Йосиф Сліпий","D":"Володимир Сабодан"},"answer":"B"},{"id":436,"topic":"III. УСРР в умовах НЕПу та тоталітарного режиму (1920–1930-ті рр.)","question":"Про який індустріальний гігант, збудований на Запоріжжі в роки першої п'ятирічки (1927–1932 рр.) в ході радянської індустріалізації, свідчить уривок: «...Це була найбільша гідроелектростанція в Європі, яка дала струм новим металургійним заводам півдня...»?","options":{"A":"ХТЗ (Харківський тракторний замок)","B":"Дніпрогес","C":"Південмаш","D":"Азовсталь"},"answer":"B"},{"id":437,"topic":"III. УСРР в умовах НЕПу та тоталітарного режиму (1920–1930-ті рр.)","question":"Яке місто за постановою ВУЦВК у 1934 році офіційно повернуло собі статус столиці УСРР, замість Харкова, який був столицею республіки з 1919 року?","options":{"A":"Чернігів","B":"Київ","C":"Львів","D":"Одеса"},"answer":"B"},{"id":438,"topic":"III. УСРР в умовах НЕПу та тоталітарного режиму (1920–1930-ті рр.)","question":"Про яку жорстоку каральну акцію польського уряду Ю. Пілсудського в Галичині восени 1930 року свідчить звіт товариства «Просвіта»: «...Військові загони польської кавалерії входили в українські села, руйнували читальні, кооперативи, били вчителів та селян за зв'язки з підпіллям УВО...»?","options":{"A":"Пацифікацію («умиротворення» українців Галичини)","B":"Окупацію Буковини","C":"Волочну реформу","D":"Коліївщину"},"answer":"A"},{"id":439,"topic":"III. УСРР в умовах НЕПу та тоталітарного режиму (1920–1930-ті рр.)","question":"Яка підпільна радикальна націоналістична організація була заснована у Відні у 1929 році на чолі з полковником Євгеном Коновальцем, яка ставила за мету створення незалежної соборної України за допомогою збройної боротьби?","options":{"A":"Революційна українська партія (РУП)","B":"Організація українських націоналістів (ОУН)","C":"Українська військова організація (УВО)","D":"Головна руська рада"},"answer":"B"},{"id":440,"topic":"III. УСРР в умовах НЕПу та тоталітарного режиму (1920–1930-ті рр.)","question":"Хто очолив ОУН після трагічної загибелі Євгена Коновальця в Роттердамі (1938 р.) від рук агента НКВС Павла Судоплатова?","options":{"A":"Степан Бандера","B":"Андрій Мельник","C":"Роман Шухевич","D":"Тарас Бульба-Боровець"},"answer":"B"},{"id":441,"topic":"III. УСРР в умовах НЕПу та тоталітарного режиму (1920–1930-ті рр.)","question":"Які українські землі у міжвоєнний період (1918–1940 рр.) перебували у складі Королівства Румунія, про що свідчить уривок: «...У руських комітатах Хотин, Чернівці, Ізмаїл запроваджено воєнний стан, а українська мова повністю вигнана зі шкіл та церков...»?","options":{"A":"Закарпаття та Волинь","B":"Північна Буковина та Південна Бессарабія","C":"Східна Галичина","D":"Поділля"},"answer":"B"},{"id":442,"topic":"III. УСРР в умовах НЕПу та тоталітарного режиму (1920–1930-ті рр.)","question":"Про яку республіку на території Чехословаччини (березень 1939 р.) свідчить уривок: «...Сойм у місті Хуст проголосив незалежність держави, обрав президентом Августина Волошина, затвердив синьо-жовтий прапор та мову українську. Проте за кілька днів республіка була криваво придушена угорськими військами...»?","options":{"A":"ЗУНР","B":"Карпатську Україну","C":"Галицьку республіку","D":"Лемківську республіку"},"answer":"B"},{"id":443,"topic":"🪓 IV. Друга світова війна та визвольний рух (1939–1945 рр.)","question":"Про який таємний документ серпня 1939 року свідчить хроніка: «...Гітлер та Сталін поділили сфери впливу в Східній Європі. За таємним протоколом Східна Галичина та Волинь мали відійти радянській зоні в разі ліквідації Польської держави...»?","options":{"A":"Версальський мир","B":"Пакт Молотова-Ріббентропа (Договір про ненапад між Німеччиною та СРСР)","C":"Мюнхенську угоду","D":"Брест-Литовський мир"},"answer":"B"},{"id":444,"topic":"🪓 IV. Друга світова війна та визвольний рух (1939–1945 рр.)","question":"Яку пропагандистську назву радянська історіографія дала військовому нападу Червоної армії на Польщу 17 вересня 1939 року, внаслідок якого Західна Україна була інкорпорована до складу СРСР/УРСР?","options":{"A":"«Блискавична війна»","B":"«Визвольний похід Червоної армії»","C":"«Пацифікація»","D":"«Весна народів»"},"answer":"B"},{"id":445,"topic":"🪓 IV. Друга світова війна та визвольний рух (1939–1945 рр.)","question":"Про який документ ОУН(б), ухвалений у Львові 30 червня 1941 року Ярославом Стецьком відразу після відступу радянських військ, свідчить уривок: «...Волею українського народу проголошується відновлення Української Держави... яка разом із могутньою Великою Німеччиною встановлюватиме новий лад у всьому світі...»?","options":{"A":"Четвертий Універсал","B":"Акт відновлення Української Держави","C":"Декларацію ЗУНР","D":"Конституцію П. Орлика"},"answer":"B"},{"id":446,"topic":"🪓 IV. Друга світова війна та визвольний рух (1939–1945 рр.)","question":"Яку назву мав жорстокий окупаційний режим, встановлений Адольфом Гітлером на більшій частині території України (на чолі з Еріхом Кохом), опис якого наведено: «...Україна розглядається як колонія німецької раси. Землі колгоспів перетворюються на держмаєтки, а місцеве населення підлягає експлуатації та поступовому винищенню...»?","options":{"A":"Генеральну губернію","
