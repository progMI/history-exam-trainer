.chart-bars{display:flex;align-items:end;gap:8px;height:190px;padding:18px 8px 28px;border-bottom:1px solid var(--line);overflow-x:auto}

.calendar-century>summary::-webkit-details-marker{display:none}
.calendar-century>summary:after{content:"＋";color:var(--accent2);font-size:18px}
.calendar-century[open]>summary:after{content:"−"}
.century-count{font-size:11px;color:var(--muted);font-weight:600;background:#273653;padding:4px 9px;border-radius:99px;white-space:nowrap}

.test-review-tools{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}

ліє»","B":"«Ізборники Святослава»","C":"«Руська Правда»","D":"«Київський Патерик»"},"answer":"B"},{"id":167,"topic":"🏛️IX. Соціально-економічний розвиток, культура та церква (X – початок XII ст.)","question":"Яка мова була офіційною мовою богослужіння, літератури та державного діловодства на Русі після прийняття християнства?","options":{"A":"Давньогрецька","B":"Церковнослов’янська (старослов'янська)","C":"Латинська","D":"Хозарська"},"answer":"B"},{"id":168,"topic":"І. Тести за цитатами з літописів (Хронологія та Діячі)","question":"Про заснування якого міста свідчить уривок: «І було три брати... А заснували вони городок в ім'я старшого брата свого і нарекли його...»?","options":{"A":"Чернігів","B":"Новгород","C":"Київ","D":"Переяслав"},"answer":"C"},{"id":169,"topic":"І. Тести за цитатами з літописів (Хронологія та Діячі)","question":"Який шлях описано в «Повісті минулих літ»: «...а з Понятія [Чорного] моря можна пливти по Дніпру, а в верхів'ях Дніпра — волоком до Ловаті, а по Ловаті можна увійти в Ільмень, озеро велике...»?","options":{"A":"Соляний шлях","B":"Шовковий шлях","C":"«Із варягів у греки»","D":"Бурштиновий шлях"},"answer":"C"},{"id":170,"topic":"І. Тести за цитатами з літописів (Хронологія та Діячі)","question":"Кому належать слова: «Хай буде се мати городам руським», сказані під час захоплення Києва у 882 році?","options":{"A":"Аскольду","B":"Олегу","C":"Ігорю","D":"Святославу"},"answer":"B"},{"id":171,"topic":"І. Тести за цитатами з літописів (Хронологія та Діячі)","question":"Про який похід йдеться в літописі: «...і повелів Олег воїнам своїм колеса зробити і поставити на колеса кораблі. І коли подув попутний вітер, підняли вони вітрила і пішли по полю до города...»?","options":{"A":"Похід на Хозарію 965 р.","B":"Похід на Царгород 907 р.","C":"Похід проти древлян 945 р.","D":"Похід на Корсунь 988 р."},"answer":"B"},{"id":172,"topic":"І. Тести за цитатами з літописів (Хронологія та Діячі)","question":"Чиї дії описано: «Коли ж почули древляни, що він знову йде, тримали вони раду з князем своїм Малом: \"Якщо внадиться вовк до овець, то виносить усе стадо, якщо не вб'ють його...\"»?","options":{"A":"Князя Олега","B":"Князя Ігоря","C":"Князя Святославия","D":"Князя Володимира"},"answer":"B"},{"id":173,"topic":"І. Тести за цитатами з літописів (Хронологія та Діячі)","question":"Яку подію описує уривок: «І послала Ольга до древлян, кажучи: \"Ось уже йду я до вас, тож приготуйте меди багаті біля города, де вбили ви чоловіка мого, хай поплачу я над труною його і вчиню тризну...\"»?","options":{"A":"Укладення миру з князем Малом","B":"Початок помсти за смерть Ігоря","C":"Прийняття християнства Ольгою","D":"Заснування нових погостів"},"answer":"B"},{"id":174,"topic":"І. Тести за цитатами з літописів (Хронологія та Діячі)","question":"Про які нововведення Ольги йдеться: «І пішла Ольга по Деревлянській землі з сином своїм... встановлюючи устави і уроки, і існують ловища її і погости по всій землі...»?","options":{"A":"Воєнну реформу","B":"Релігійну реформу","C":"Адміністративно-податкову реформу","D":"Судову реформу"},"answer":"C"},{"id":175,"topic":"І. Тести за цитатами з літописів (Хронологія та Діячі)","question":"Кому літописець адресує ці слова: «Ти, князю, чужу землю шукаєш і дбаєш про неї, а свою полишив...», коли печеніги взяли в облогу Київ у 968 році?","options":{"A":"Олегу Віщому","B":"Ігорю Старому","C":"Святославу Хороброму","D":"Володимиру Великому"},"answer":"C"},{"id":176,"topic":"І. Тести за цитатами з літописів (Хронологія та Діячі)","question":"Який князь промовляв до свого війська перед битвою: «Ніде нам дітися, волею і неволею мусимо стати насупротив. Тож не осоромимо землі Руської, а ляжемо кістьми тут, бо мертві сорому не знають!»?","options":{"A":"Аскольд","B":"Святослав","C":"Ярослав Мудрий","D":"Володимир Мономах"},"answer":"B"},{"id":177,"topic":"І. Тести за цитатами з літописів (Хронологія та Діячі)","question":"Про чию смерть свідчить літопис: «...і напав на нього Куря, князь печенізький, і вбили Святослава, і взяли голову його, і з черепа його зробили чашу, окувавши золото, і пили з неї...»?","options":{"A":"Князя Ігоря біля Коростеня","B":"Князя Святослава біля Дніпрових порогів","C":"Князя Олега від укусу змії","D":"Князя Бориса на річці Альта"},"answer":"B"},{"id":178,"topic":"І. Тести за цитатами з літописів (Хронологія та Діячі)","question":"На яку подію вказує цитата: «І став Володимир княжити у Києві один, і поставив кумири на горбу поза двором теремним: Перуна дерев’яного... і Хорса, Дажбога, і Стрибога, і Сімаргла, і Мокош...»?","options":{"A":"Запровадження християнства","B":"Язичницьку реформу 980 року","C":"Будівництво Десятинної церкви","D":"Укладення договору з Візантією"},"answer":"B"},{"id":179,"topic":"І. Тести за цитатами з літописів (Хронологія та Діячі)","question":"Про що йдеться у джерелі: «...І коли Володимир прибув, повелів він скидати кумирів — тих порубати, а інших вогню віддати. Перуна ж повелів він прив’язати коняці до хвоста і волочити з Гори по Боричевому узвозу до Ручаю...»?","options":{"A":"Розгром печенігів","B":"Початок Хрещення Русі у 988 році","C":"Київське повстання 1068 року","D":"Любецький з'їзд"},"answer":"B"},{"id":180,"topic":"І. Тести за цитатами з літописів (Хронологія та Діячі)","question":"Хто промовляв ці слова до киян: «Якщо не прийде хто завтра на річку — чи багатий, чи вбогий, чи старець, чи раб, — то мне той ворогом буде»?","options":{"A":"Княгиня Ольга","B":"Князь Володимир Великий","C":"Князь Ярослав Мудрий","D":"Митрополит Іларіон"},"answer":"B"},{"id":181,"topic":"І. Тести за цитатами з літописів (Хронологія та Діячі)","question":"Про будівництво якого храму пише літописець: «У рік 989. Володимир... задумав спорудити церкву Пресвятої Богородиці і послав привести майстрів із греків. І... прикрасив її іконами і дав десяту частину від багатства свого...»?","options":{"A":"Софійський собор","B":"Десятинна церква","C":"Спасо-Преображенський собор у Чернігові","D":"Успенський собор Печерського монастиря"},"answer":"B"},{"id":182,"topic":"І. Тести за цитатами з літописів (Хронологія та Діячі)","question":"Про чию діяльність йдеться: «Заложив він город великий Київ, у якого міста Золоті ворота. Заложив він і церкву святої Софії... І до книг він мав нахил, читаючи їх часто вдень і вночі. І зібрав він писців багатьох...»?","options":{"A":"Володимира Великого","B":"Ярослава Мудрого","C":"Володимира Мономаха","D":"Мстислава Великого"},"answer":"B"},{"id":183,"topic":"І. Тести за цитатами з літописів (Хронологія та Діячі)","question":"Яку подію описує літопис під 1036 роком: «...І сталася січа люта, і заледве переміг Ярослав під вечір. І побігли печеніги в різні боки, і не знали, куди бігти, і тонули в річці Сетомлі... і так загинули, а решта їх бігає десь і до сьогодні...»?","options":{"A":"Битву під Любечем","B":"Остаточний розгром печенігів під Києвом","C":"Битву на річці Калці","D":"Початок міжусобної війни"},"answer":"B"},{"id":184,"topic":"І. Тести за цитатами з літописів (Хронологія та Діячі)","question":"Чий заповіт наведено в уривку: «Ось я відходжу зі світу цього. А ви, сини мої, майте межи собою любов... Якщо будете жити в любові межи собою, то й Бог буде з вами... Старшому бо сину Ізяславу даю Київ...»?","options":{"A":"Святослава Хороброго","B":"Володимира Великого","C":"Ярослава Мудрого","D":"Володимира Мономаха"},"answer":"C"},{"id":185,"topic":"І. Тести за цитатами з літописів (Хронологія та Діячі)","question":"Про яку битву йдеться: «У рік 1068. Прийшли іноплемінники на Руську землю, половці многі... І вийшли супротив них руські князі Ізяслав, Святослав і Всеволод на річку Альту. І сталася січа, і побігли руські князі, і перемогли половці...»?","options":{"A":"Битву на річці Калці","B":"Битву на річці Альті","C":"Битву на річці Стугні","D":"Битву під Ярославом"},"answer":"B"},{"id":186,"topic":"І. Тести за цитатами з літописів (Хронологія та Діячі)","question":"Яку історичну подію описує цитата: «...зібралися в Любечі, щоб укласти мир. І говорили один одному: \"Пощо ми губимо Руську землю, самі на себе усобиці зводячи? А половці землю нашу несуть... Тож віднині з'єднаймося в одне серце і бережімо Руську землю. Кожен хай держить отчину свою...\"»?","options":{"A":"Вишгородський з'їзд 1072 р.","B":"Любецький з'їзд князів 1097 р.","C":"Уветицький з'їзд 1100 р.","D":"Долобського з'їзд 1103 р."},"answer":"B"},{"id":187,"topic":"І. Тести за цитатами з літописів (Хронологія та Діячі)","question":"Який злочин, що обурив усю Русь, описано відразу після подій у Любечі: «...прийшов Давид [Ігоревич]... і схопили Василька, і привезли його в Звенигород... І підійшов торчин, на імення Берендій... і встромив йому ніж в око, і виняв око, а потім і друге...»?","options":{"A":"Убивство Бориса і Гліба","B":"Засліплення теребовльського князя Василька Ростиславича","C":"Страту князя Ігоря древлянами","D":"Убивство Аскольда Олегом"},"answer":"B"},{"id":188,"topic":"📜 ІІІ. Документи та Тексти культурно-ідеологічного характеру","question":"З якого твору взято ці слова: «...Бо закон був провісником і слугою благодаті та істини, благодать же і істина — слуги майбутнього віку... Спочатку закон, а потім благодать...»?","options":{"A":"«Повчання дітям»","B":"«Слово про закон і благодать» митрополита Іларіона","C":"«Повість минулих літ»","D":"«Руська Правда»"},"answer":"B"},{"id":189,"topic":"📜 ІІІ. Документи та Тексти культурно-ідеологічного характеру","question":"Хто є автором повчального твору, де є слова: «В домі своїм не лінуйтеся, а за всім дивіться... Ні пиятиці, ні блуду не давайте волі, бо в цьому душі гине і тіло... Не проминіть ніколи людину, не привітавши її...»?","options":{"A":"Ярослав Мудрий","B":"Володимир Мономах («Повчання дітям»)","C":"Нестор Літописець","D":"Антоній Печерський"},"answer":"B"},{"id":190,"topic":"📜 ІІІ. Документи та Тексти культурно-ідеологічного характеру","question":"Про яку подію пише літопис під 1113 роком: «...Кияни ж піднялися, розграбували двір Путяти тисяцького, і пішли на жидів [лихварів] і розграбували їх... І послали знову кияни до Володимира, кажучи: \"Прийди, князю, до Києва; якщо не прийдеш, то знай, що багато лиха вчиниться...\"»?","options":{"A":"Повстання проти Ізяслава 1068 р.","B":"Київське повстання 1113 року","C":"Любецький з'їзд","D":"Монгольську навалу"},"answer":"B"},{"id":191,"topic":"📜 ІІІ. Документи та Тексти культурно-ідеологічного характеру","question":"Який документ було створено в результаті подій, описаних у попередньому питанні, з метою врегулювання відсотків лихварів: «Володимир Мономах... скликав дружину свою... і уставили: хто бере гроші в борг, той не має платити більше трьох \"різів\" [відсотків]...»?","options":{"A":"«Правду Ярославичів»","B":"«Статут Володимира Мономаха»","C":"«Закон Судний людем»","D":"«Судебник»"},"answer":"B"},{"id":192,"topic":"📜 ІІІ. Документи та Тексти культурно-ідеологічного характеру","question":"«У рік 1051. Поставив Ярослав Ларіона [Іларіона] митрополитом Русі в святій Софії, зібравши єпископів...» — яке історичне значення мав цей літописний факт?","options":{"A":"Прийняття християнства","B":"Перше призначення митрополита з числа русичів, а не греків","C":"Підпорядкування церкви Папі Римському","D":"Ліквідацію Візантійського патріархату"},"answer":"B"},{"id":193,"topic":"📜 ІІІ. Документи та Тексти культурно-ідеологічного характеру","question":"Про створення якої пам'ятки свідчить уривок: «...Написав Євангеліє се диякон Григорій для посадника Остромира... у місті Новгороді, за часів князя Ізяслава Ярославича...»?","options":{"A":"«Реймське Євангеліє»","B":"«Остромирове Євангеліє»","C":"«Ізборник Святослава»","D":"«Київський Патерик»"},"answer":"B"},{"id":194,"topic":"📜 ІІІ. Документи та Тексти культурно-ідеологічного характеру","question":"Про яке право селянської общини йдеться у «Руській Правді»: «Якщо вб'ють княжого мужа в розбої, а вбивці не шукають, то дику виру платить та верв [община], де знайдено вбитого...»?","options":{"A":"Право на безкоштовну землю","B":"Колективну відповідальність общини (верві) за злочин, скоєний на її території","C":"Право на вільний вихід з общини","D":"Судовий імунітет бояр"},"answer":"B"},{"id":195,"topic":"📜 ІІІ. Документи та Тексти культурно-ідеологічного характеру","question":"Про чию смерть так писав літописець у 1015 році: «...І плакали за ним люди всі... бо він був сиротам заступник, убогим кормитель, і землю Руську хрещенням просвітив...»?","options":{"A":"Князя Святослава","B":"Князя Володимира Великого","C":"Князя Ярослав Мудрого","D":"Князя Аскольда"},"answer":"B"},{"id":196,"topic":"📜 ІІІ. Документи та Тексти культурно-ідеологічного характеру","question":"«...Повелів Володимир будувати церкви і ставити їх по місцях, де стояли кумири... І почав він брати у нарочитих мужиків дітей і віддавати їх на навчання книжне...» — яку сферу суспільського життя реформував князь?","options":{"A":"Військову справу","B":"Освіту та релігію","C":"Судочинство","D":"Фінанси"},"answer":"B"},{"id":197,"topic":"📜 ІІІ. Документи та Тексти культурно-ідеологічного характеру","question":"Кому належить авторство слів у літописі: «...і не хотів я крові проливати, і уступив стіл батька мого Олегові, а сам пішов до Переяслава...», які демонструють намагання уникнути міжусобиці за Чернігів у 1094 році?","options":{"A":"Святополку Ізяславичу","B":"Володимиру Мономаху","C":"Давиду Ігоревичу","D":"Мстиславу Великому"},"answer":"B"},{"id":198,"topic":"І. Тести за цитатами періоду роздробленості Русі (XII ст.)","question":"Про чиє правління в Києві йдеться: «І сидів він у Києві, утерши піт з лиця свого... І уставив він \"Статут\", за яким лихварям заборонялося брати великі різи, а закупи отримали захист від свавілля господарів...»?","options":{"A":"Ярослава Мудрого","B":"Володимира Мономаха","C":"Мстислава Великого","D":"Романа Мстиславича"},"answer":"B"},{"id":199,"topic":"І. Тести за цитатами періоду роздробленості Русі (XII ст.)","question":"Який твір цитується: «...Не лінуйтеся, благаю вас, не забувайте усього цього... Куди б ви не йшли, де б не стали, напойте, нагодуйте нужденного... Найбільше ж шануйте гостя, звідки б він до вас не прийшов...»?","options":{"A":"«Слово про закон і благодать»","B":"«Повчання дітям» Володимира Мономаха","C":"«Повість минулих літ»","D":"«Київський патерик»"},"answer":"B"},{"id":200,"topic":"І. Тести за цитатами періоду роздробленості Русі (XII ст.)","question":"Про смерть якого князя літописець писав у 1132 році, зазначаючи кінець єдності Русі: «...І роздерлася вся земля Руська на уділи, і не було більше єдиновладця, бо помер син Мономахів, що тримав братію в послуху...»?","options":{"A":"Володимира Мономаха","B":"Мстислава Великого","C":"Ярослава Осмомисла","D":"Романа Мстиславича"},"answer":"B"},{"id":201,"topic":"І. Тести за цитатами періоду роздробленості Русі (XII ст.)","question":"Про якого галицького князя згадує автор «Слова про ігорів похід»: «Галицький Осмомисле Ярославе! Високо сидиш ти на своїм золотокованім престолі, підперши Гори Угорські своїми залізними полками...»?","options":{"A":"Ярослава Мудрого","B":"Ярослава Осмомисла","C":"Романа Мстиславича","D":"Данила Романовича"},"answer":"B"},{"id":202,"topic":"І. Тести за цитатами періоду роздробленості Русі (XII ст.)","question":"З якою подією пов'язана перша писемна згадка назви «Україна» під 1187 роком: «І плакали за ним усі переяславці... за ним же Україна багато потужила, бо був він князь доблесний і люба фортеця кордонів...»?","options":{"A":"Смертю переяславського князя Володимира Глібовича","B":"Заснуванням міста Галича","C":"Любецьким з'їздом","D":"Походом князя Ігоря на половців"},"answer":"A"},{"id":203,"topic":"І. Тести за цитатами періоду роздробленості Русі (XII ст.)","question":"Про який похід розповідає джерело: «...Тоді вступив Ігор-князь у золоту стремено і поїхав по чистому полю. Сонце йому тьмою шлях заступало, ніч, стогнючи йому грозою, птаство збудила... Хочу, — сказав, — списа переломити на краю поля Половецького...»?","options":{"A":"Похід Святослава на хозар","B":"Похід Ігоря Святославича на половців 1185 р.","C":"Невдалу битву на річці Калці","D":"Захоплення Києва монголами"},"answer":"B"},{"id":204,"topic":"І. Тести за цитатами періоду роздробленості Русі (XII ст.)","question":"Чий плач у місті Путивлі на валу описано в поемі XII століття: «...Полечу, — каже, — зигзицею по Дунаю, омочу шовковий рукав у Каялі-ріці, утру князю криваві його рани на дужому його тілі...»?","options":{"A":"Княгині Ольги","B":"Ярославни (дружини князя Ігоря)","C":"Малуші","D":"Анна Ярославни"},"answer":"B"},{"id":205,"topic":"І. Тести за цитатами періоду роздробленості Русі (XII ст.)","question":"Про яку битву з половцями йдеться: «...І зранку в п'ятницю потоптали вони погані полки половецькі... А в суботу знову обступили їх сили ворожі, як ліс... Скрізь летять стріли калені, гримлять шаблі об шоломи... І розлучилися брати на ріці Каялі...»?","options":{"A":"Битву під стінами Києва 1036 р.","B":"Поразку князя Ігоря Святославича 1185 р.","C":"Битву на річці Альті 1068 р.","D":"Битву на річці Сутінь 1103 р."},"answer":"B"},{"id":206,"topic":"І. Тести за цитатами періоду роздробленості Русі (XII ст.)","question":"Про яке місто пише літописець: «...Прийшов Батий до міста... і обступив його силами багатьма, і не було чути нічого через скрипіння возів його, ревіння верблюдів і ржання коней... І поставив він пороки [стінобитні машини] біля Лядських воріт...»?","options":{"A":"Галич","B":"Київ (облога 1240 р.)","C":"Володимир","D":"Чернігів"},"answer":"B"},{"id":207,"topic":"І. Тести за цитатами періоду роздробленості Русі (XII ст.)","question":"Про чию героїчну оборону Києва у 1240 році свідчить уривок: «...А городяни під керівництвом воєводи... боролися за кожну вулицю. І вибігли всі на склепіння Десятинної церкви, і від ваги людей та ударів пороків завалилися стіни храму, поховавши під собою останніх захисників...»?","options":{"A":"Воєводи Дмитра","B":"Воєводи Претича","C":"Князя Данила Галицького","D":"Воєводи Нечая"},"answer":"A"},{"id":208,"topic":"📜 ІІ. Об'єднання Галичини і Волині та перша навала (кінець XII – XIII ст.)","question":"Про якого князя пише літописець під 1199 роком: «...Він бо кинувся на поганих [половців], як той лев, і переходив землю їхню, як аналог орла... Зібрав він під своєю рукою землю Галицьку і Волинську, і став самодержцем усієї Русі...»?","options":{"A":"Ярослава Осмомисла","B":"Романа Мстиславича","C":"Данила Романовича","D":"Лева Даниловича"},"answer":"B"},{"id":209,"topic":"📜 ІІ. Об'єднання Галичини і Волині та перша навала (кінець XII – XIII ст.)","question":"До кого з руських князів звернулися половці у 1223 році з проханням про допомогу: «...Нашу землю сьогодні забрали татари, а вашу завтра заберуть, тож підтримайте нас, щоб не були ми подолані наодинці...»?","options":{"A":"Володимира Мономаха","B":"Мстислава Удатного та Ростиславичів","C":"Данила Галицького особисто","D":"Михайла Чернігівського"},"answer":"B"},{"id":210,"topic":"📜 ІІ. Об'єднання Галичини і Волині та перша навала (кінець XII – XIII ст.)","question":"Про яку трагічну подію свідчить літопис: «...У рік 1223. З'явилися народи нечувані, яких ніхто добре не знає... І сталася січа люта на річці... і через гординю деяких князів руських зазнали вони поразки великої, якої не було від початку Руської землі...»?","options":{"A":"Битву на річці Альті","B":"Битву на річці Калці","C":"Битву під Дорогочином","D":"Синьоводську битву"},"answer":"B"},{"id":211,"topic":"📜 ІІ. Об'єднання Галичини і Волині та перша навала (кінець XII – XIII ст.)","question":"Про яку жахливу кару руських князів після поразки 1223 року розповідає джерело: «...Татари ж захопили князів у полон, поклали на них дошки, а самі сіли зверху обідати, і так подушили вони князів руських, святкуючи свою перемогу...»?","options":{"A":"Після битви під Дорогочином","B":"Після битви на річці Калці","C":"Після взяття Києва Батиєм","D":"Після облоги Галича"},"answer":"B"},{"id":212,"topic":"📜 ІІ. Об'єднання Галичини і Волині та перша навала (кінець XII – XIII ст.)","question":"Яку перемогу Данила Романовича описано під 1238 роком: «...Не гоже є хрестоносцям тримати вотчину нашу! І пішов Данило з братом Васильком на них, і здобув місто, а магістра їхнього взяв у полон, і очистив землю від загарбників...»?","options":{"A":"Битву під Ярославом","B":"Битву під Дорогочином (проти Добжинського ордену)","C":"Битву на річці Калці","D":"Взяття Галича"},"answer":"B"},{"id":213,"topic":"📜 ІІ. Об'єднання Галичини і Волині та перша навала (кінець XII – XIII ст.)","question":"На яку подію 1245 року вказує цитата: «...Данило ж із братом зібрав полки свої і розгромив під містом Ярославом полки угорські та польські, і боярина бунтівного Владислава... Це була велика перемога, що поклала край боярським усобицям...»?","options":{"A":"Початок монгольської навали","B":"Битву під Ярославом","C":"Коронацію Данила","D":"Заснування міста Львова"},"answer":"B"},{"id":214,"topic":"📜 ІІ. Об'єднання Галичини і Волині та перша навала (кінець XII – XIII ст.)","question":"Про чию поїздку до хана йдеться в Галицько-Волинському літописі: «О, лихіша від усього лиха честь татарська! Князь же, син Романа Великого... стояв перед ханом на колінах, і пропонував хан йому пити чорне молоко — кобилячий кумис... Проте зберіг він землю свою від сплюндрування...»?","options":{"A":"Михайла Чернігівського","B":"Данила Галицького (візит до Батия 1245 р.)","C":"Юрія І Львовича","D":"Любарта Гедиміновича"},"answer":"B"},{"id":215,"topic":"📜 ІІ. Об'єднання Галичини і Волині та перша навала (кінець XII – XIII ст.)","question":"Яку подію 1253 року описує уривок: «...Прислав Папа Римський Іннокентій IV послів із короною, кажучи: \"Прийми, сину, вінець королівський, хай допоможе тобі престол святого Петра проти безбожних татар\"... І коронувався він у місті Дорогочині...»?","options":{"A":"Прийняття католицизму Данилом","B":"Коронацію Данила Романовича королем Русі","C":"Хрещення Галицької землі","D":"Укладення Кревської унії"},"answer":"B"},{"id":216,"topic":"📜 ІІ. Об'єднання Галичини і Волині та перша навала (кінець XII – XIII ст.)","question":"Про заснування якого міста йдеться у літописі під 1256 роком: «...Коли Данило будував холми і фортеці проти татар, спалахнула велика пожежа в Холмі, і заграву було видно аж зі... міста, яке князь заклав на честь сина свого старшого Лева...»?","options":{"A":"Володимир","B":"Львів","C":"Галич","D":"Перемишль"},"answer":"B"},{"id":217,"topic":"📜 ІІ. Об'єднання Галичини і Волині та перша навала (кінець XII – XIII ст.)","question":"Який монгольський воєначальник змусив Данила і Василька у 1259 році зруйнувати стіни власних міст: «...Прийшов воєвода татарський зі силами великими і сказав: \"Якщо ви мирні зі мною — розметайте всі ваші міські укріплення, Львів, Володимир, Луцьк...\" І мусили вони підкоритися...»?","options":{"A":"Батий","B":"Бурундай","C":"Куремса","D":"Ногай"},"answer":"B"},{"id":218,"topic":"📜 ІІІ. Уривки з джерел про суспільний устрій, культуру та право Галичини й Волині","question":"Про яке унікальне явище політичного життя Галицької землі свідчить цитата: «...Князь Володимирко хотів сам правити, але бояри галицькі зібралися на раду і сказали йому прямо в очі: \"Не ти, князю, землею володієш, а ми; якщо не згоден з нами — шукай собі іншого уділу\"...»?","options":{"A":"Абсолютну монархію князів","B":"Могутність галицького боярства (боярське свавілля)","C":"Вічеву демократію селян","D":"Церковний нагляд за державними справами"},"answer":"B"},{"id":219,"topic":"📜 ІІІ. Уривки з джерел про суспільний устрій, культуру та право Галичини й Волині","question":"«...І вчинили бояри галицькі великий заколот: схопили Настасю, спалили її на вогнищі як відьму, а князя Ярослава змусили цілувати хрест, що буде жити в злагоді з законною дружиною...» — про який конфлікт в удільних князівствах розповідає літопис?","options":{"A":"Конфлікт між Ярославом Осмомислом та галицьким боярством","B":"Війну з Угорським королівством","C":"Повстання смердів у Галичі","D":"Релігійну реформу в Галичині"},"answer":"A"},{"id":220,"topic":"📜 ІІІ. Уривки з джерел та право Галичини й Волині","question":"Про чиє правління на початку XIV ст. свідчить напис на княжій печатці: «Regis Rusiae, Princeps Ladimeriae» (Король Русі, князь Володимирський), що вказує на тимчасове відродження єдності держави після Данила?","options":{"A":"Лева Даниловича","B":"Юрія І Львовича","C":"Юрія ІІ Болеслава","D":"Андрія Юрійовича"},"answer":"B"},{"id":225,"topic":"📜 ІІІ. Уривки з джерел про суспільний устрій, культуру та право Галичини й Волині","question":"Про створення якого релігійного інституту у 1105 році пише джерело, що дозволило зменшити вплив київських митрополитів: «...Князь Юрій добився від патріарха Константинопольського поставлення окремого митрополита для земель своїх...»?","options":{"A":"Української автокефальної церкви","B":"Галицької православної митрополії","C":"Греко-католицької унії","D":"Луцької єпархії"},"answer":"B"},{"id":226,"topic":"📜 ІІІ. Уривки з джерел про суспільний устрій, культуру та право Галичини й Волині","question":"Про трагічний фінал якої держави свідчить документ 1340 року: «...Останній володар землі нашої, Юрій Болеслав, був отруєний своїми ж боярами за те, що прихильно ставився до латинян і католиків... І спалахнула війна за його спадщину між Польщею, Литвою та Угорщиною...»?","options":{"A":"Київської Русі","B":"Галицько-Волинської держави","C":"Переяславського князівства","D":"Новгородської республіки"},"answer":"B"},{"id":227,"topic":"📜 IV. Додатковий блок цитат для завдань на відповідність НМТ","question":"З якого твору взято цитату, що закликає князів припинити міжусобиці: «...Перестали князі на поганих воювати, стали один одному казати: \"Се моє, а теж моє\". І почали князі про мале — \"се велике\" мовити, самі на себе крамолу кувати, а погані з усіх боків приходили з перемогами...»?","options":{"A":"«Руська Правда»","B":"«Слово про ігорів похід»","C":"«Повість минулих літ»","D":"«Повчання дітям»"},"answer":"B"},{"id":228,"topic":"📜 IV. Додатковий блок цитат для завдань на відповідність НМТ","question":"Про який архітектурний об'єкт пише літопис: «...У рік 1037. Заклав Ярослав місто велике... у якому Золоті ворота. Спорудив також собор святої Софії, премудрості Божої, посеред міста, і прикрасив його золотом, сріблом і мозаїками...»?","options":{"A":"Софійський собор у Новгороді","B":"Софійський собор у Києві","C":"Десятинну церкву","D":"Успенський собор у Володимирі"},"answer":"B"},{"id":229,"topic":"📜 IV. Додатковий блок цитат для завдань на відповідність НМТ","question":"«...Якщо хто витягне меч, але не вдарить ним, а лише злякає, то платити 1 гривню... Якщо ж ударить батогом, або жердиною, або долонею — платити 12 гривень князю...» — норми якого кодексу наведено?","options":{"A":"«Литовського Статуту»","B":"«Руської Правди»","C":"«Магдебурзького права»","D":"«Конституції Пилипа Орлика»"},"answer":"B"},{"id":230,"topic":"📜 IV. Додатковий блок цитат для завдань на відповідність НМТ","question":"Хто з літописних персонажів першим вимовив фразу, що започаткувала норманську теорію походження Русі: «...Земля наша велика і щедра, а порядку в ній немає. Прийдіть-но княжити і володіти нами... І виступили три брати з родами своїми...»?","options":{"A":"Східнослов'янські племена (поляни, словени, кривичі) до варягів","B":"Візантійці до князя Олега","C":"Половці до Володимира Мономаха","D":"Кияни до Данила Галицького"},"answer":"A"},{"id":231,"topic":"📜 IV. Додатковий блок цитат для завдань на відповідність НМТ","question":"Про які події 945 року пише джерело: «...І почула Ольга, що йдуть до неї свати від древлян, які пропонують їй вийти заміж за їхнього князя Мала... І наказала вона викопати глибоку яму на дворі теремному, і скинули туди сватів живцем, і наказала засипати їх...»?","options":{"A":"Адміністративну реформу","B":"Першу помсту Ольги за вбивство Ігоря","C":"Прийняття християнства","D":"Любецький з'їзд"},"answer":"B"},{"id":232,"topic":"📜 IV. Додатковий блок цитат для завдань на відповідність НМТ","question":"Які релігійні дії Володимира описано: «...І наказав він рубати ліси і будувати на пагорбах церкви на місцях колишніх капищ... І послав по всьому місту збирати людей на річку Почайну [Дніпро], хай кожна людина хреститься во ім'я Отця і Сина...»?","options":{"A":"Язичницьку реформу","B":"Хрещення Русі 988 р.","C":"Заснування Києво-Печерської лаври","D":"Хрещення княгині Ольги"},"answer":"B"},{"id":233,"topic":"📜 IV. Додатковий блок цитат для завдань на відповідність НМТ","question":"«...Якщо брат уб'є брата, чи син батька... то якщо не буде месника, то платити в державну казну 40 гривень за голову простої людини...» — яка важлива зміна у законодавстві «Правди Ярославичів» тут зафіксована?","options":{"A":"Запровадження смертної кари","B":"Повне скасування кровної помсти та заміна її державним штрафом","C":"Збільшення податків на селян","D":"Звільнення холопів від покарань"},"answer":"B"},{"id":234,"topic":"📜 IV. Додатковий блок цитат для завдань на відповідність НМТ","question":"Про яке історичне місце йдеться в описі: «...Це печери глибокі на схилах Дніпра, куди пішов молитися Антоній з Любеча, і викопав собі печеру малу, і почали збиратися до нього ченці, і виріс з того великий монастир Печерський...»?","options":{"A":"Софійський собор","B":"Києво-Печерську лавру","C":"Видубицький монастир","D":"Михайлівський собор"},"answer":"B"},{"id":235,"topic":"📜 IV. Додатковий блок цитат для завдань на відповідність НМТ","question":"Про яку категорію населення йдеться в законі: «...Якщо пан вдарить закупа за діло — то він не винен; якщо ж вдарить його без вини, або скривдить у розрахунках, чи забере його власне майно — то платити пану штраф, а закуп звільняється від боргу...»?","options":{"A":"Вільних смердів","B":"Тимчасово залежних селян (закупів)","C":"Повних рабів (холопів)","D":"Князівських дружинників"},"answer":"B"},{"id":236,"topic":"📜 IV. Додатковий блок цитат для завдань на відповідність НМТ","question":"Який загальний висновок робить автор «Слова про закон і благодать» про Русь на початку XI століття: «...Прославимо ж великі діла Божі, бо релігія наша не в таємному кутку народилася, і земля Руська відома і чувана в усіх чотирьох кінцях світу через благочестя князів наших...»?","options":{"A":"Обґрунтування величі Русі та її рівноправності серед провідних християнських держав світу","B":"Заклик підкоритися Візантійській імперії","C":"Визнання переваги Хозарського каганату","D":"Пророцтво про монгольську навалу"},"answer":"A"},{"id":237,"topic":"І. Цитати з правових актів, описів побуту та міжусобиць","question":"Про який історичний феномен свідчить літописний фрагмент: «Прийшли половці до міста, а з ними і князь Олег Святославич. І спалили вони передмістя, і багато лиха натворили... Бо Олег приводив поганих на землю батьків своїх ради уділу Чернігівського...»?","options":{"A":"Укладення Любецького миру","B":"Використання кочовиків у князівських міжусобицях","C":"Остаточний розпад Русі на 15 князівств","D":"Початок монгольської навали на Русь"},"answer":"B"},{"id":238,"topic":"І. Цитати з правових актів, описів побуту та міжусобиць","question":"Яку норму щодо спадщини зафіксовано в «Руській Правді»: «Якщо смерд помре бездітним, то спадщина його йде князю; якщо ж залишаться у нього доньки вдома, то виділити їм частину майна, а решту віддати князю...»?","options":{"A":"Право на обов'язкове зрівняння прав жінок і чоловіків","B":"Обмеження спадкових прав залежних селян (смердів) на користь держави","C":"Повне скасування приватної власності на Русі","D":"Передачу майна виключно православній церкві"},"answer":"B"},{"id":239,"topic":"І. Цитати з правових актів, описів побуту та міжусобиць","question":"Уривок із джерела: «...Якщо челядин [холоп] сховається у варяга або у колбяга, а його не знайдуть протягом трьох днів, то, упізнавши його на третій день, господар забирає свого челядина, а укривателю платити 3 гривні штрафу...» — свідчить про наявність на Русі:","options":{"A":"Рівноправності іноземців та місцевих жителів","B":"Норм права, що захищали інтереси рабовласників (власників холопів)","C":"Смертної кари за переховування злочинців","D":"Юридичної заборони варягам селитися в містах"},"answer":"B"},{"id":240,"topic":"І. Цитати з правових актів, описів побуту та міжусобиць","question":"До якого літописного твору належить цей фрагмент: «...Не замовкнув я, описуючи біди землі нашої, і пишу про події в Галичі та Володимирі, про славного князя Романа, що був як лев, і сина його Данила, якого Бог спас від рук бояр невірних...»?","options":{"A":"«Повість минулих літ»","B":"«Київський літопис»","C":"«Галицько-Волинський літопис»","D":"«Новгородський літопис»"},"answer":"C"},{"id":241,"topic":"І. Цитати з правових актів, описів побуту та міжусобиць","question":"«...І зібралися князі на Долобському з'їзді біля озера. І сказав Святополк: \"Не гоже навесні розпочинати похід і забирати смердів від ріллі\". А Володимир [Мономах] відповів: \"Дивуюся я, брате, що ти смерда шкодуєш, а того не згадаєш, що приїде половчин, застрелить смерда... і коня його забере, і в гумно його приїде...\"» — яка головна ідея цієї розмови?","options":{"A":"Скасування податків для селян-общинників","B":"Обґрунтування необхідності випереджальних весняних походів проти половців","C":"Укладення шлюбного союзу з половецькими ханами","D":"Поділ Переяславської землі між братами"},"answer":"B"},{"id":242,"topic":"І. Цитати з правових актів, описів побуту та міжусобиць","question":"Про які оборонні споруди йдеться в описі: «...І повелів Володимир копати рови глибокі і сипати вали високі навколо городів на півдні, і укріпив він фортеці по річці Сулі і по Стугні, щоб жоден кочовик не міг легко пройти до Києва...»?","options":{"A":"Траянові вали","B":"Змієві вали","C":"Лядські ворота","D":"Китайгородські стіни"},"answer":"B"},{"id":243,"topic":"І. Цитати з правових актів, описів побуту та міжусобиць","question":"Про яку трагічну подію в Галичі розповідає літописець: «...У рік 1211. Настали дні беззаконня в землі Галицькій: бояри збунтувалися, схопили малих княжичів Данила і Василька, а матір їхню вигнали з міста... І посадили на престол боярина Владислава, що було нечувано на Русі...»?","options":{"A":"Початок правління Романа Мстиславича","B":"Період боярського правління та боярських усобиць після смерті Романа","C":"Коронацію Данила Галицького королівською короною","D":"Напад угорського короля на Галич"},"answer":"B"},{"id":244,"topic":"І. Цитати з правових актів, описів побуту та міжусобиць","question":"З якої пам’ятки літератури XI століття взято уривок: «...Радуйся, преславний соборе Софії, премудрості Божої, що його спорудив благочестивий князь Ярослав на славу Господа і на подивування всім країнам сусідам...»?","options":{"A":"«Повчання дітям»","B":"«Слово про закон і благодать» митрополита Іларіона","C":"«Повість минулих літ»","D":"«Київський патерик»"},"answer":"B"},{"id":245,"topic":"І. Цитати з правових актів, описів побуту та міжусобиць","question":"Який соціальний статус особи описує стаття «Руської Правди»: «Якщо хтось без дозволу пана візьме коня чи зброю і поїде геть, або якщо вкраде щось у свого господаря — то втрачає статус закупа і перетворюється на повного [обезчещеного] холопа...»?","options":{"A":"Перехід вільного смерда в рабство через борг","B":"Втрату тимчасово залежним селянином прав через порушення умов договору","C":"Поранення дружинника під час битви","D":"Порядок звільнення ремісника від податків"},"answer":"B"},{"id":246,"topic":"І. Цитати з правових актів, описів побуту та міжусобиць","question":"Про чиє військове досягнення пише літопис: «...І пішов князь Мстислав на чолі полків чернігівських і сіверських, і заклав храм великий Спаса у Чернігові, і підкорив племена ятвягів та касогів, і розділив Русь по Дніпру з братом своїм Ярославом...»?","options":{"A":"Мстислава Великого (сина Мономаха)","B":"Мстислава Тмутараканського (брата Ярослава Мудрого)","C":"Мстислава Удатного","D":"Романа Мстиславича"},"answer":"B"},{"id":247,"topic":"І. Литовська доба, Кревська унія та битва на Синіх Водах (XIV ст.)","question":"Про яку подію 1362 року пише хроніст: «...Ольгерд великий князь литовський зібрав полки свої і побив татар на Синій Воді... Від того часу з Поділля, Київщини та Переяславщини вигнано владу ординську, і увійшли ці землі під руку Литви...»?","options":{"A":"Битву на річці Калці","B":"Битву на Синіх Водах","C":"Битву на річці Ворсклі","D":"Грюнвальдську битву"},"answer":"B"},{"id":248,"topic":"І. Литовська доба, Кревська унія та битва на Синіх Водах (XIV ст.)","question":"Уривок із джерела: «...Ягайло, великий князь, обіцяє всі свої землі, литовські та руські, на вічні часи до корони Королівства Польського приєднати, охреститися сам і народ свій у віру католицьку ввести...» — описує умови:","options":{"A":"Городельської унії","B":"Кревської унії (1385 р.)","C":"Люблінської унії","D":"Берестейської унії"},"answer":"B"},{"id":249,"topic":"І. Литовська доба, Кревська унія та битва на Синіх Водах (XIV ст.)","question":"Яка історична зміна відбулася на українських землях внаслідок підписання угоди, про яку йдеться в попередньому питанні?","options":{"A":"Початок масового козацького повстання","B":"Початок династичного союзу між Великим князівством Литовським і Польщею та посилення католицького впливу","C":"Повне знищення Кримського ханства","D":"Перенесення столиці Русі до Вільного"},"answer":"B"},{"id":250,"topic":"І. Литовська доба, Кревська унія та битва на Синіх Водах (XIV ст.)","question":"Опис якого процесу наведено в хроніці: «...Князь Вітовт, прагнучи зміцнити центральну владу, позбавив удільних столів місцевих князів: Володимира Ольгердовича вигнав з Києва, Федора Коріатовича — з Поділля, і посадив скрізь своїх намісників...»?","options":{"A":"Заснування Запорозької Січі","B":"Ліквідацію найбільших українських удільних князівств наприкінці XIV ст.","C":"Початок Люблінського сейму","D":"Наслідки Кревської унії"},"answer":"B"},{"id":251,"topic":"І. Литовська доба, Кревська унія та битва на Синіх Водах (XIV ст.)","question":"Яку битву 1399 року описано в літописі: «...І зійшовся Вітовт із татарами хана Тимура-Кутлука на річці... І була січа велика, і татари перемогли через хитрість свою, і багато князів руських і литовських там загинуло, що зупинило плани Вітовта підкорити Орду...»?","options":{"A":"Битву на Синіх Водах","B":"Битву на річці Ворсклі","C":"Грюнвальдську битву","D":"Битву під Оршею"},"answer":"B"},{"id":252,"topic":"І. Литовська доба, Кревська унія та битва на Синіх Водах (XIV ст.)","question":"Про яку славетну битву 1410 року проти Тевтонського ордену, де пліч-о-пліч воювали литовські, польські та руські (українські) полки, свідчить джерело: «...Там смоленські, галицькі та подільські корогви вистояли проти найважчого удару лицарів-хрестоносців, чим забезпечили повну перемогу королю Ягайлу і князю Вітовту...»?","options":{"A":"Битву на Синіх Водах","B":"Грюнвальдську битву","C":"Битву під Оршею","D":"Куликовську битву"},"answer":"B"},{"id":253,"topic":"І. Литовська доба, Кревська унія та битва на Синіх Водах (XIV ст.)","question":"Уривок із Городельської унії 1413 року: «...Усі костьоли і церкви, засновані у Великому князівстві... мають бути збережені, проте уряди, посади та місця в раді великого князя литовського можуть обіймати лише пани віри католицької, які отримали польські герби...» — свідчить про:","options":{"A":"Повну рівність прав православних і католиків","B":"Релігійну дискримінацію православної української та литовської знаті","C":"Заборону православної віри на Русі","D":"Передачу Києва під владу Тевтонського ордену"},"answer":"B"},{"id":254,"topic":"І. Литовська доба, Кревська унія та битва на Синіх Водах (XIV ст.)","question":"Який літописний вислів найкраще характеризує м'який характер входження українських земель до Великого князівства Литовського на першому етапі (XIV ст.): «...Литва на початку правління свого в землях руських трималася правила старовинного...»?","options":{"A":"«Усе золото землі руської — литовським князям»","B":"«Старого не порушуємо, а нового не впроваджуємо»","C":"«Хто не прийме католицтво — той ворог держави»","D":"«Кожен хай держить отчину свою»"},"answer":"B"},{"id":255,"topic":"І. Литовська доба, Кревська унія та битва на Синіх Водах (XIV ст.)","question":"Про якого князя йдеться в уривку: «...Він бо став лідером православної руської партії, яка не хотіла союзу з Польщею. Проголосили його великим князем руським у Києві, і воював він проти Сигізмунда Свидригайловича...»?","options":{"A":"Свидригайла Ольгердовича (період існування «Великого князівства Руського» 1432–1435 рр.)","B":"Костянтина Острозького","C":"Дмитра Вишневецького","D":"Семена Олельковича"},"answer":"A"},{"id":256,"topic":"І. Литовська доба, Кревська унія та битва на Синіх Водах (XIV ст.)","question":"Яка битва 1435 року поставила крапку в існуванні незалежного Великого князівства Руського: «...І зійшлися війська Сигізмунда Кейстутовича та Свидригайла біля міста... І зазнали полки руські нищівної поразки, що ліквідувало мрію про окрему православну державу...»?","options":{"A":"Битва на Ворсклі","B":"Битва під Вількомиром","C":"Битва під Оршею","D":"Грюнвальдська битва"},"answer":"B"},{"id":257,"topic":"🏛️ІІІ. Українські землі у складі інших держав: Польща, Угорщина, Московія, Молдавія","question":"Про завоювання яких земель свідчить уривок: «...У рік 1340. Король польський Казимир ІІІ, скориставшись отруєнням князя Юрія-Болеслава, напав на Львів, забрав корону та скарби руські, і почалася тривала війна за підкорення Галичини...»?","options":{"A":"Підкорення Волині Литвою","B":"Загарбання Галичини Польським королівством","C":"Напад татар на Київ","D":"Початок козацьких воєн"},"answer":"B"},{"id":258,"topic":"🏛️ІІІ. Українські землі у складі інших держав: Польща, Угорщина, Московія, Молдавія","question":"Який адміністративно-територіальний устрій було запроваджено в Галичині у 1434 році за польським зразком, згідно з документом: «...Віднині земля Галицька перетворюється на Руське воєводство з центром у місті Львові, і запроваджується там польське право і суди земські...»?","options":{"A":"Поділ на удільні князівства","B":"Запровадження воєводської системи (Руське, Белзьке воєводства)","C":"Створення Запорозької Січі","D":"Створення намісництв Орди"},"answer":"B"},{"id":259,"topic":"🏛️ІІІ. Українські землі у складі інших держав: Польща, Угорщина, Московія, Молдавія","question":"Про які українські землі йдеться в хроніці: «...Удільні князі з роду Коріатовичів розбудували фортеці в Кам'янці, Смотричі, захищаючи край від татар. Проте згодом ця багата земля була поділена між Литвою та Польщею, де остання створила Подільське воєводство...»?","options":{"A":"Волинь","B":"Поділля","C":"Буковину","D":"Закарпаття"},"answer":"B"},{"id":260,"topic":"🏛️ІІІ. Українські землі у складі інших держав: Польща, Угорщина, Московія, Молдавія","question":"Яка доля спіткала Закарпаття у XI–XIV століттях, про що свідчить документ: «...Руські комітати Берег, Угоча, Ужгород повністю увійшли до складу Королівства Угорського, а місцева руська знать була поступово мадяризована...»?","options":{"A":"Входження до складу Московського царства","B":"Входження Закарпаття до складу Угорщини","C":"Окупація Османською імперією","D":"Отримання повної автономії"},"answer":"B"},{"id":261,"topic":"🏛️ІІІ. Українські землі у складі інших держав: Польща, Угорщина, Московія, Молдавія","question":"Про які території («Шипинську землю») йдеться в молдавських грамотах XV ст.: «...Земля між Карпатами та Дністром, де мешкають русини, остаточно закріпилася за Молдавським князівством і отримала назву Буковина через великі букові ліси...»?","options":{"A":"Галичину","B":"Буковину","C":"Закарпаття","D":"Східне Поділля"},"answer":"B"},{"id":262,"topic":"🏛️ІІІ. Українські землі у складі інших держав: Польща, Угорщина, Московія, Молдавія","question":"Які українські землі у XV — на початку XVI ст. у ході запеклих воєн відійшли до Московської держави, про що свідчить уривок: «...Князі чернігівські, новгород-сіверські та рильські разом зі своїми вотчинами вийшли під руку великого князя Івана III, відібравши ці землі у Литви...»?","options":{"A":"Київщину та Переяславщину","B":"Чернігово-Сіверщину","C":"Поділля","D":"Волинь"},"answer":"B"},{"id":263,"topic":"🏛️ІІІ. Українські землі у складі інших держав: Польща, Угорщина, Московія, Молдавія","question":"Про яке місто йдеться в уривку султана Мехмеда ІІ (1475 р.): «...Фортеця Кафа і місто... на березі моря були взяті нашими воїнами, а генуезькі купці вигнані. Віднині весь Південний Крим стає особистим володінням султана — османським санджаком...»?","options":{"A":"Бахчисарай","B":"Кафу (Керч, Південний Крим)","C":"Севастополь","D":"Ольвію"},"answer":"B"},{"id":264,"topic":"🏛️ІІІ. Українські землі у складі інших держав: Польща, Угорщина, Московія, Молдавія","question":"Який статус отримало Кримське ханство у 1478 році за хана Менглі-Гірея, згідно з уривком джерела: «...Хан кримський визнав себе васалом блискучої Порти [Османської імперії], зобов'язавшись брати участь у всіх походах султана і постачати живих рабів...»?","options":{"A":"Повну незалежність від усього світу","B":"Васальну залежність від Османської імперії","C":"Входження до складу Великого князівства Литовського","D":"Союзницький статус із Московією"},"answer":"B"},{"id":265,"topic":"🏛️ІІІ. Українські землі у складі інших держав: Польща, Угорщина, Московія, Молдавія","question":"Яке право міського самоврядування почало активно поширюватися на українські міста (Сянок, Львів, Кам'янець, Київ) у XIV–XV ст., про що свідчить фрагмент грамоти: «...Звільняємо міщан наших від суду воєвод і тіунів, і дозволяємо їм обирати магістрат, лавників та бурмістра, і судитися за зразком німецьким...»?","options":{"A":"Козацьке право","B":"Магдебурзьке право","C":"«Руську Правду»","D":"Волочну ремеру"},"answer":"B"},{"id":266,"topic":"🏛️ІІІ. Українські землі у складі інших держав: Польща, Угорщина, Московія, Молдавія","question":"Яка споруда була центром самоврядування міста, де засідав магістрат (лава та рада), згідно з нормами німецького права: «...І збудували міщани посеред площі Ринок велику кам'яну будівлю з вежею і годинником...»?","options":{"A":"Дитинець","B":"Ратушу","C":"Замок","D":"Колегіум"},"answer":"B"},{"id":267,"topic":"🌾 IV. Соціально-економічне життя, кріпацтво та поява козацтва (XVI ст.)","question":"Про які зміни в сільському господарстві свідчить уривок з «Устави на волоки» Сигізмунда ІІ Августа (1557 р.): «...Повеліваємо в усіх маєтках наших закладати фільварки, землю поділити на рівні волоки, а селяни мають з кожної волоки відробляти панщину два дні на тиждень...»?","options":{"A":"Надання селянам повної свободи","B":"Запровадження фільваркової системи господарювання та посилення панщини","C":"Скасування приватної власності бояр","D":"Початок масової еміграції козаків"},"answer":"B"},{"id":268,"topic":"🌾 IV. Соціально-економічне життя, кріпацтво та поява козацтва (XVI ст.)","question":"Що означав термін «фільварок» в економічному житті українських земель XVI століття?","options":{"A":"Невелике козацьке укріплення в Степу","B":"Багатогалузеве панське господарство, що базувалося на безкоштовній праці кріпаків і було орієнтоване на продаж зерна на ринок","C":"Ремісничий цех у місті","D":"Князівський палац"},"answer":"B"},{"id":269,"topic":"🌾 IV. Соціально-економічне життя, кріпацтво та поява козацтва (XVI ст.)","question":"Про який процес свідчить постанова Пйотркувського сейму (1496 р.): «...Жоден селянин не має права залишати землю без дозволу пана, а лише один син з села може йти навчатися чи на ремесло...»?","options":{"A":"Розвиток міської освіти","B":"Юридичне закріпачення селян (обмеження права переходу)","C":"Ліквідацію цехів","D":"Початок формування реєстрового козацтва"},"answer":"B"},{"id":270,"topic":"🌾 IV. Соціально-економічне життя, кріпацтво та поява козацтва (XVI ст.)","question":"Який документ остаточно і повністю закріпачив українське селянство у 1588 році, скасувавши право переходу та встановивши 20-річний термін розшуку селян-утікачів: «...Селяни вітчизні, які віддавна сидять на землях панських, є кріпаками вічними і не можуть йти без волі пана...»?","options":{"A":"Перший Литовський статут","B":"Третій Литовський статут","C":"«Устава на волоки»","D":"Кревська унія"},"answer":"B"},{"id":271,"topic":"🌾 IV. Соціально-економічне життя, кріпацтво та поява козацтва (XVI ст.)","question":"Як у XVI ст. називали бідне міське або сільське населення, яке не мало власної землі і змушене було найматися на роботу або жити в чужих дворах («комірках»)?","options":{"A":"Пани-барони","B":"Комірники (сусідки, бобилі)","C":"Реєстровці","D":"Шляхтичі"},"answer":"B"},{"id":272,"topic":"🌾 IV. Соціально-економічне життя, кріпацтво та поява козацтва (XVI ст.)","question":"Як називалися професійні об'єднання міських ремісників однієї або кількох споріднених спеціальностей у середньовічних містах України?","options":{"A":"Магістрати","B":"Цехи","C":"Фільварки","D":"Братства"},"answer":"B"},{"id":273,"topic":"🌾 IV. Соціально-економічне життя, кріпацтво та поява козацтва (XVI ст.)","question":"Уривок із цехового статуту львівських ткачів: «...Жоден православний русин не може бути прийнятий у майстри цехові, а лише особи віри римо-католицької...» — ілюструє наявність у містах:","options":{"A":"Повної національної гармонії","B":"Релігійного та національного утиску українських міщан","C":"Пільг для українських ремісників","D":"Магдебурзького права для всіх без винятку"},"answer":"B"},{"id":274,"topic":"🌾 IV. Соціально-економічне життя, кріпацтво та поява козацтва (XVI ст.)","question":"На яку подію вказує перша писемна згадка про козаків у «Хроніці Марціна Бєльського» під 1489 роком: «...Поляки йшли проти татар через подільські степи, а дорогу їм показували козаки — тутешні люди, які знають степові путі та промишляють там...»?","options":{"A":"Заснування першої Січі","B":"Першу писемну згадку про українських козаків у джерелах","C":"Початок повстання Наливайка","D":"Створення козацького реєстру"},"answer":"B"},{"id":275,"topic":"🌾 IV. Соціально-економічне життя, кріпацтво та поява козацтва (XVI ст.)","question":"Як називався примусовий безкоштовний селянський труд на користь землевласника (пана), розмір якого у XVI ст. постійно зростав?","options":{"A":"Оброк (чинш)","B":"Панщина","C":"Дякло","D":"Полюддя"},"answer":"B"},{"id":276,"topic":"🌾 IV. Соціально-економічне життя, кріпацтво та поява козацтва (XVI ст.)","question":"Хто такі «пани-барони» або «магнати» в соціальній структурі Великого князівства Литовського?","options":{"A":"Вільні козаки-запорожці","B":"Найсвятіша і найбагатша верства великих землевласників (князі Острозькі, Вишневецькі, Сангушки)","C":"Бідні міщани","D":"Селяни-втікачі"},"answer":"B"},{"id":277,"topic":"І. Люблінська унія 1569 р. та адміністративні зміни","question":"З якого історичного документа взято цей уривок: «Королівство Польське і Велике князівство Литовське є одне нероздільне і спільне тіло, а також одна спільна республіка, яка з'єдналася і злилася в один народ...»?","options":{"A":"Кревської унії","B":"Люблінської унії","C":"Берестейської унії","D":"Гадяцького трактату"},"answer":"B"},{"id":278,"topic":"І. Люблінська унія 1569 р. та адміністративні зміни","question":"Яку назву отримала об'єднана держава, утворена внаслідок підписання Люблінської унії 1569 року?","options":{"A":"Королівство Руське","B":"Велике князівство Литовське","C":"Річ Посполита","D":"Гетьманщина"},"answer":"C"},{"id":279,"topic":"І. Люблінська унія 1569 р. та адміністративні зміни","question":"Яка важлива територіальна зміна відбулася з українськими землями (Підляшшя, Волинь, Київщина, Брацлавщина) влітку 1569 року, напередодні підписання унії?","options":{"A":"Вони відійшли до складу Московського царства","B":"Вони були безпосередньо інкорпоровані (включені) до складу Корони Польської","C":"Отримали повну державну незалежність","D":"Утворили Запорозьку Січ"},"answer":"B"},{"id":280,"topic":"І. Люблінська унія 1569 р. та адміністративні зміни","question":"Які три нові воєводства були утворені польською владою на інкорпорованих у 1569 році землях Наддніпрянщини та Волині?","options":{"A":"Руське, Белзьке, Подільське","B":"Волинське, Київське, Брацлавське","C":"Чернігівське, Переяславське, Львівське","D":"Мазовецьке, Краківське, Віленське"},"answer":"B"},{"id":281,"topic":"І. Люблінська унія 1569 р. та адміністративні зміни","question":"Який орган влади ставав спільним для Польщі та Литовського князівства за умовами Люблінського договору: «...мати єдиного государя, який обирається спільними голосами поляків і литви, і один спільний Вальний...»?","options":{"A":"Магістрат","B":"Сейм","C":"Трибунал","D":"Генеральна рада"},"answer":"B"},{"id":282,"topic":"І. Люблінська унія 1569 р. та адміністративні зміни","question":"Що з державних інститутів Велике князівство Литовське все ж таки зуміло зберегти за собою після 1569 року?","options":{"A":"Свій окремий Сейм та короля","B":"Власне законодавство (Литовські статути), герб, печатку, армію та фінанси","C":"Право самостійно оголошувати війни іншим державам","D":"Усі українські землі у своєму складі"},"answer":"B"},{"id":283,"topic":"І. Люблінська унія 1569 р. та адміністративні зміни","question":"Уривок із привілею короля Сигізмунда ІІ Августа Волинській шляхті (1569 р.): «...Зберігаємо за князями і шляхтою волинською їхні права, грецьку православну віру, і уряди мають даватися лише тутешнім уродженцям, а суди мають вестися мовою руською...» — свідчив про:","options":{"A":"Негайне скасування православ'я на Волині","B":"Спробу польської влади задобрити українську шляхту для підписання унії","C":"Запровадження кріпацтва для шляхти","D":"Підпорядкування Волині німецькому праву"},"answer":"B"},{"id":284,"topic":"І. Люблінська унія 1569 р. та адміністративні зміни","question":"Який загальний наслідок мала Люблінська унія для українських міщан та селян у довгостроковій перспективі?","options":{"A":"Масове надання селянам козацьких прав","B":"Посилення національно-релігійного гніту, швидке поширення католицизму та польського фільваркового господарства","C":"Повне скасування панщини","D":"Перехід на німецьку мову спілкування"},"answer":"B"},{"id":285,"topic":"І. Люблінська унія 1569 р. та адміністративні зміни","question":"Хто з українських магнатів, будучи воєводою київським, виступав на Люблінському сеймі як лідер руської делегації та вимагав збереження прав православної віри?","options":{"A":"Дмитро Вишневецький","B":"Костянтин-Василь Острозький","C":"Ярема Вишневецький","D":"Северин Наливайко"},"answer":"B"},{"id":286,"topic":"І. Люблінська унія 1569 р. та адміністративні зміни","question":"Яка подія відбулася в 1635 році на Чернігівщині, що згодом відійшла до Польщі за Деулінським перемир'ям: «...утворено було нове, наймолодше українське воєводство у складі Корони Польської...»?","options":{"A":"Заснування Київського воєводства","B":"Створення Чернігівського воєводства","C":"Ліквідацію Подільського воєводства","D":"Утворення Брацлавського воєводства"},"answer":"B"},{"id":287,"topic":"⚔️ ІІ. Виникнення козацтва, Дмитро Вишневецький та перші Січі","question":"Опис якого промислу в степах («Дикому Полі») наведено в хроніці: «...Ішли туди люди влітку ловити рибу, бити звіра, збирати мед дикий. Називали їх уходниками, і мусили вони озброюватися, щоб боронитися від татар...»?","options":{"A":"Кріпацтва","B":"Уходництва (промислу, що передував козацтву)","C":"Цехового ремесла","D":"Магдебурзького права"},"answer":"B"},{"id":288,"topic":"⚔️ ІІ. Виникнення козацтва, Дмитро Вишневецький та перші Січі","question":"Хто, за свідченням літопису, у 1556 році побудував на острові Мала Хортиця перший дерев'яно-земляний замок, який вважається прототипом Запорозької Січі?","options":{"A":"Іван Підкова","B":"Дмитро Вишневецький (Байда)","C":"Криштоф Косинський","D":"Петро Сагайдачний"},"answer":"B"},{"id":289,"topic":"⚔️ ІІ. Виникнення козацтва, Дмитро Вишневецький та перші Січі","question":"Яку мету переслідував засновник Хортицької фортеці, згідно з його листами до польського короля та московського царя?","options":{"A":"Повністю знищити Польське королівство","B":"Створити опорний пункт для спільної боротьби християнських держав проти Кримського ханства та османів","C":"Очолити польську армію в Любліні","D":"Заборонити селянам тікати на південь"},"answer":"B"},{"id":290,"topic":"⚔️ ІІ. Виникнення козацтва, Дмитро Вишневецький та перші Січі","question":"Про чию героїчну смерть у Стамбулі у 1563 році розповідає народна пісня: «...Цар турецький його катував, на гак за ребро повісив, а він три дні висів і лаяв віру мусульманську, аж поки турки не застрелили його з луків...»?","options":{"A":"Івана Підкови","B":"Дмитра Вишневецького","C":"Самійла Кішки","D":"Северина Наливайка"},"answer":"B"},{"id":291,"topic":"⚔️ ІІ. Виникнення козацтва, Дмитро Вишневецький та перші Січі","question":"Як називалося військово-політичне об'єднання козаків, що сформувалося за дніпровими порогами, опис якого залишив Еріх Лясота: «...Це замок, оточений засіками з дерев'яних колод (\"січею\"), де живе козацьке братство за своїми суворими законами...»?","options":{"A":"Магістрат","B":"Запорозька Січ","C":"Фільварок","D":"Козацький реєстр"},"answer":"B"},{"id":292,"topic":"⚔️ ІІ. Виникнення козацтва, Дмитро Вишневецький та перші Січі","question":"Що означав принцип козацької демократії на Січі, про який писали іноземці: «...Усі питання війни і миру, обрання старшини вони вирішують спільно на загальних зборах, де кожен має рівний голос...»?","options":{"A":"Князівську волю","B":"Козацьку раду (Генеральну раду)","C":"Наказ гетьмана без обговорення","D":"Рішення польського сейму"},"answer":"B"},{"id":293,"topic":"⚔️ ІІ. Виникнення козацтва, Дмитро Вишневецький та перші Січі","question":"Як називалися клейноди — символи влади козацького гетьмана, які описує джерело: «...Князь прислав їм знамено — хоругву з орлом, срібну печатку, а також булаву як знак найвищої військової влади...»?","options":{"A":"Козацька зброя","B":"Козацькі клейноди","C":"Цехові знаки","D":"Магістратські ключі"},"answer":"B"},{"id":294,"topic":"⚔️ ІІ. Виникнення козацтва, Дмитро Вишневецький та перші Січі","question":"Яку назву мав козацький військовий клейнод — палиця з металевою кулею на кінці, що була символом влади гетьмана чи кошового отамана?","options":{"A":"Бунчук","B":"Булава","C":"Пернач","D":"Каламар"},"answer":"B"},{"id":295,"topic":"⚔️ ІІ. Виникнення козацтва, Дмитро Вишневецький та перші Січі","question":"Який клейнод, що складався з дерев'яного древка, на кінці якого закріплювали мідну кулю та пучок кінського волосу, тримав перед гетьманом під час рад спеціальний старшина?","options":{"A":"Пернач","B":"Бунчук","C":"Литаври","D":"Корогва"},"answer":"B"},{"id":296,"topic":"⚔️ ІІ. Виникнення козацтва, Дмитро Вишневецький та перші Січі","question":"Хто такий «кошовий отаман» у структурі Запорозької Січі?","options":{"A":"Польський намісник на півдні","B":"Голова січового товариства, який обирався на рік козацькою радою і мав найвищу військову, адміністративну та судову владу на Січі","C":"Керівник ремісничого цеху","D":"Православний єпископ"},"answer":"B"},{"id":297,"topic":"📜 ІІІ. Реєстрове козацтво та перші козацькі повстання (кінець XVI ст.)","question":"Який польський король у 1578 році провів масштабну козацьку реформу, збільшивши реєстр до 600 осіб, передав їм місто Трахтемирів і затвердив козацькі привілеї (імунітет)?","options":{"A":"Сигізмунд ІІ Август","B":"Стефан Баторій","C":"Сигізмунд ІІІ Ваза","D":"Владислав IV"},"answer":"B"},{"id":298,"topic":"📜 ІІІ. Реєстрове козацтво та перші козацькі повстання (кінець XVI ст.)","question":"Які права та привілеї («вольності») отримали реєстрові козаки від польського уряду, на відміну від звичайного населення?","options":{"A":"Право купувати польські магнатські замки","B":"Звільнення від податків і панщини, власне судочинство, право володіти землею та отримувати платню грошима й сукном","C":"Право обирати польського короля на Сеймі","D":"Повне право не брати участі у війнах"},"answer":"B"},{"id":299,"topic":"📜 ІІІ. Реєстрове козацтво та перші козацькі повстання (кінець XVI ст.)","question":"Про чий сміливий похід на Молдавію 1577 року свідчить джерело: «...Козак... разом із загоном запорожців зайняв Ясси, проголосив себе господарем молдавським. Проте польський король за вимогою турецького султана наказав схопити його і стратити у Львові...»?","options":{"A":"Дмитра Вишневецького","B":"Івана Підкови","C":"Криштофа Косинського","D":"Северина Наливайка"},"answer":"B"},{"id":300,"topic":"📜 ІІІ. Реєстрове козацтво та перші козацькі повстання (кінець XVI ст.)","question":"Що стало головною причиною початку першого великого козацького повстання під керівництвом Криштофа Косинського у 1591–1593 роках?","options":{"A":"Заборона православної віри","B":"Особистий конфлікт козацького гетьмана з магнатами Острозькими за право володіти землями (Рокитне)","C":"Напад московських військ на Чернігів","D":"Підписання Берестейської унії"},"answer":"B"},{"id":301,"topic":"📜 ІІІ. Реєстрове козацтво та перші козацькі повстання (кінець XVI ст.)","question":"У якій битві взимку 1593 року війська магната Костянтина-Василя Острозького та шляхетське ополчення завдали поразки козакам К. Косинського?","options":{"A":"Битві під П'яткою","B":"Битві під Солоницею","C":"Битві під Кумейками","D":"Хотинській битві"},"answer":"A"},{"id":302,"topic":"📜 ІІІ. Реєстрове козацтво та перші козацькі повстання (кінець XVI ст.)","question":"Про яке масштабне повстання 1594–1596 років пише польський хроніст: «...Бунтівники охопили Волинь, Київщину та Білорусь. Очолив їх сотник надвірної козацької корогви князя Острозького... Разом із запорожцями Г. Лободи вони палили маєтки шляхетські...»?","options":{"A":"Повстання К. Косинського","B":"Повстання Северина Наливайка","C":"Повстання Марка Жмайла","D":"Повстання Тараса Федоровича"},"answer":"B"},{"id":303,"topic":"📜 ІІІ. Реєстрове козацтво та перші козацькі повстання (кінець XVI ст.)","question":"Опис якої трагічної події 1596 року наведено в щоденнику польського воїна: «...Обложив гетьман Жолкевський козаків біля міста Лубни на річці Солониці. Зробили козаки табір з возів у чотири ряди... Після тривалої облоги старшина зрадила, видала Наливайка, і вчинили поляки страшну різанину в таборі...»?","options":{"A":"Трагедію під П'яткою","B":"Трагедію на річці Солониці","C":"Облогу Трахтемирова","D":"Битву під Цецорою"},"answer":"B"},{"id":304,"topic":"📜 ІІІ. Реєстрове козацтво та перші козацькі повстання (кінець XVI ст.)","question":"Яка кара спіткала лідера козацького повстання Северина Наливайка у Варшаві у 1597 році?","options":{"A":"Його відпустили на Січ за викуп","B":"Його було жорстоко катовано і страчено (четвертовано), а за легендою — спалено у мідному бику","C":"Його призначили керівником реєстрових козаків","D":"Він утік до Московії"},"answer":"B"},{"id":305,"topic":"📜 ІІІ. Реєстрове козацтво та перші козацькі повстання (кінець XVI ст.)","question":"Який статус отримало козацтво в Речі Посполитій після придушення повстань кінця XVI століття, згідно з постановою Сейму 1596 року?","options":{"A":"Було проголошено панівним станом держави","B":"Козаків оголошено ворогами держави та бунтівниками («банітами»), а їхні права тимчасово скасовано","C":"Отримали право будувати кам'яні фортеці","D":"Січ було повністю знищено назавжди"},"answer":"B"},{"id":306,"topic":"І. Обмеження автономії, Малоросійські колегії та останні гетьмани","question":"Про якого останнього гетьмана України (1750–1764 рр.) свідчить уривок: «...Брат фаворита імператриці Єлизавети, президент Російської академії наук, повернув столицю до Батурину, реформував суди за литовським зразком та запровадив європейську форму для козаків...»?","options":{"A":"Павла Полуботка","B":"Кирила Розумовського","C":"Петра Калнишевського","D":"Данила Апостола"},"answer":"B"},{"id":307,"topic":"І. Обмеження автономії, Малоросійські колегії та останні гетьмани","question":"Який архітектурний шедевр у стилі класицизму був зведений у Батурині за проектом архітектора Чарльза Камерона для останнього гетьмана України?","options":{"A":"Палац Кирила Розумовського","B":"Палац Івана Мазепи","C":"Софійський собор","D":"Маріїнський палац"},"answer":"A"},{"id":308,"topic":"І. Обмеження автономії, Малоросійські колегії та останні гетьмани","question":"З якого указу імператриці Катерини ІІ 1764 року взято уривок: «...Оскільки гетьманство Розумовського було добровільно складене, повеліваємо чин гетьманський скасувати назавжди, а для управління Малоросією заснувати колегію на чолі з графом Румянцевим...»?","options":{"A":"Указу про руйнацію Січі","B":"Указу про ліквідацію гетьманства та створення Другої Малоросійської колегії","C":"«Жалуваної грамоти дворянству»","D":"«Устави на волоки»"},"answer":"B"},{"id":309,"topic":"І. Обмеження автономії, Малоросійські колегії та останні гетьмани","question":"Яку таємну інструкцію дала Катерина ІІ графу О. Румянцеву щодо управління Україною: «...Мала Росія, Ліфляндія та Фінляндія є провінціями... Головна мета — зробити так, щоб вони...»?","options":{"A":"Отримали повну державну незалежність","B":"Обмежили свої права і легко були русифіковані (обрусіли), щоб не дивилися в ліс, як вовки","C":"Уклали союз із козаками-запорожцями","D":"Перейшли на польську систему судочинства"},"answer":"B"},{"id":310,"topic":"І. Обмеження автономії, Малоросійські колегії та останні гетьмани","question":"Який документ Катерини ІІ 1783 року остаточно зрівняв козацьку старшину в правах із російським дворянством, але водночас запровадив на Лівобережній та Слобідській Україні кріпацтво: «...Повеліваємо кожному селянину залишатися на своєму місці, де його застала ревізія, а переходи заборонити...»?","options":{"A":"«Маніфест про ліквідацію Січі»","B":"Указ про закріпачення селян Лівобережжя 1783 року","C":"«Жалувану грамоту шляхті»","D":"«Рішительні пункти»"},"answer":"B"},{"id":311,"topic":"⚔️ ІІ. Гайдамаччина, Опришківство та Коліївщина (Правобережжя та Карпати)","question":"Опис якого народно-визвольного руху проти польського гніту на Правобережжі наведено в хроніці: «...Збиралися селяни-утікачі в лісах, озброювалися дрючками та косами, нападали на маєтки шляхетські, палили суди та виганяли орендарів. Називали їх...»?","options":{"A":"Кріпаками","B":"Гайдамаками","C":"Реєстровцями","D":"Боярами"},"answer":"B"},{"id":312,"topic":"⚔️ ІІ. Гайдамаччина, Опришківство та Коліївщина (Правобережжя та Карпати)","question":"Про якого легендарного ватажка опришківського руху в Карпатах (1738–1745 рр.), «карпатського Робін Гуда», свідчить джерело: «...Він бо збирав загони леґінів, карав шляхту і панів угорських та польських, і не брали його кулі, аж поки зрадник не застрелив його у Космачі...»?","options":{"A":"Максима Залізняка","B":"Олексу Довбуша","C":"Івана Гонту","D":"Устима Кармелюка"},"answer":"B"},{"id":313,"topic":"⚔️ ІІ. Гайдамаччина, Опришківство та Коліївщина (Правобережжя та Карпати)","question":"Яка подія 1768 року на Правобережжі описана в поемі Тараса Шевченка «Гайдамаки»: «...Спалахнуло повстання велике, назване Коліївщиною. Максим Залізняк святив ножі в Холодному Яру, а сотник надвірних козаків Іван Гонта перейшов на бік повстанців під Уманню...»?","options":{"A":"Повстання С. Палія","B":"Коліївщину (найвищу точку гайдамацького руху 1678 р.)","C":"Повстання Наливайка","D":"Другий поділ Польщі"},"answer":"B"},{"id":314,"topic":"⚔️ ІІ. Гайдамаччина, Опришківство та Коліївщина (Правобережжя та Карпати)","question":"Яким підступним чином російський уряд генерала Кречетникова допоміг полякам придушити Коліївщину у 1768 році?","options":{"A":"Оголосив війну Польщі","B":"Запросив Залізняка та Гонту на бенкет нібито для союзу, де їх зрадницько заарештували, після чого Гонту віддали на страшну кару полякам, а Залізняка заслали до Сибіру","C":"Надав козакам артилерію","D":"Передав Умань під владу Січі"},"answer":"B"},{"id":315,"topic":"📜 ІІІ. Ліквідація Запорозької Січі та поділи Речі Посполитої (кінець XVIII ст.)","question":"Про яку трагічну подію червня 1775 року свідчить Маніфест Катерини ІІ: «...Ми порахували за обов'язок перед Богом... Січ Запорозьку вщент зруйнувати, а саму назву козаків запорозьких на майбутнє знищити, бо вони жили у свавіллі...»?","options":{"A":"Руйнацію Чортомлицької Січі Петром І","B":"Остаточну ліквідацію Нової (Підпільненської) Запорозької Січі військами генерала Текелія","C":"Заснування Задунайської Січі","D":"Початок Хмельниччини"},"answer":"B"},{"id":316,"topic":"📜 ІІІ. Ліквідація Запорозької Січі та поділи Речі Посполитої (кінець XVIII ст.)","question":"Про якого останнього кошового отамана Запорозької Січі йдеться в уривку: «...Після руйнування Січі 84-річний старець був засланий до Соловецького монастиря, де у кам'яній ямі-одиночці просидів 25 років, і помер у віці 112 років...»?","options":{"A":"Костя Гордієнка","B":"Петра Калнишевського","C":"Івана Сірка","D":"Пилипа Орлика"},"answer":"B"},{"id":317,"topic":"📜 ІІІ. Ліквідація Запорозької Січі та поділи Речі Посполитої (кінець XVIII ст.)","question":"Куди втекла частина запорозьких козаків після руйнування Січі у 1775 році, заснувавши там нову Січ під протекторатом турецького султана?","options":{"A":"На Дон","B":"На Кубань","C":"За Дунай (утворивши Задунайську Січ)","D":"До Сибіру"},"answer":"C"},{"id":318,"topic":"📜 ІІІ. Ліквідація Запорозької Січі та поділи Речі Посполитої (кінець XVIII ст.)","question":"Яку назву отримало козацьке військо (Військо вірних козаків), сформоване російським урядом у 1788 році з колишніх запорожців для війни з Туреччиною, яке згодом було переселене на Кубань?","options":{"A":"Задунайське козацтво","B":"Чорноморське козацьке військо","C":"Донське козацтво","D":"Реєстрове козацтво"},"answer":"B"},{"id":319,"topic":"📜 ІІІ. Ліквідація Запорозької Січі та поділи Речі Посполитої (кінець XVIII ст.)","question":"Внаслідок яких трьох міжнародних подій (1772, 1793, 1795 рр.) Правобережна Україна та Волинь увійшли до складу Російської імперії, а Галичина — до складу Австрії?","options":{"A":"Литовсько-московських воєн","B":"Трьох поділів Речі Посполитої","C":"Прутського походу","D":"Кючук-Кайнарджійського миру"},"answer":"B"},{"id":320,"topic":"📜 ІІІ. Ліквідація Запорозької Січі та поділи Речі Посполитої (кінець XVIII ст.)","question":"Який загальний підсумок розвитку українських земель наприкінці XVIII століття (станом на 1796 рік)?","options":{"A":"Здобуття Україною повної державної незалежності","B":"Повна ліквідація козацького устрою, автономії Гетьманщини, Запорозької Січі та Слобожанщини; українські землі були повністю уніфіковані та поділені на губернії між двома імперіями — Російською та Австрійською","C":"Перехід усіх українських земель під владу Туреччини","D":"Відновлення Київського удільного князівства"},"answer":"B"},{"id":321,"topic":"І. Початок національного відродження та «Енеїда» (кінець XVIII – початок XIX ст.)","question":"З якою подією 1798 року пов'язують початок українського національного відродження, про що свідчить відгук сучасника: «...Це була перша книга, надрукована живою народною мовою, яка показала всьому світові, що руська мова в Малоросії не померла, а здатна описувати і високі, і жартівливі сюжети...»?","options":{"A":"Виданням «Кобзаря» Т. Шевченка","B":"Виходом у світ перших трьох частин «Енеїди» І. Котляревського","C":"Заснуванням Харківського університету","D":"Опублікуванням «Історії русів»"},"answer":"B"},{"id":322,"topic":"І. Початок національного відродження та «Енеїда» (кінець XVIII – початок XIX ст.)","question":"Про яку видатну історико-літературну пам’ятку початку ХІХ ст. (авторство якої досі точно не встановлено) йдеться в уривку: «...Цей твір став справжнім маніфестом українського автономізму. Він доводив, що Мала Росія є прямою спадкоємицею Київської Русі та Козацької держави, а українці — це окремий історичний народ із правами на волі...»?","options":{"A":"«Книга буття українського народу»","B":"«Історія русів»","C":"«Русалка Дністрова»","D":"«Землеописание Малороссии»"},"answer":"B"},{"id":323,"topic":"І. Початок національного відродження та «Енеїда» (кінець XVIII – початок XIX ст.)","question":"Який навчальний заклад, заснований у 1805 році завдяки зусиллям та фінансовій підтримці вченого і громадського діяча Василя Каразіна, став головним осередком українського культурного життя Наддніпрянщини?","options":{"A":"Київський університет св. Володимира","B":"Харківський університет","C":"Одеський (Новоросійський) університет","D":"Гімназія вищих наук у Ніжині"},"answer":"B"},{"id":324,"topic":"І. Початок національного відродження та «Енеїда» (кінець XVIII – початок XIX ст.)","question":"Про заснування якого журналу у Харкові (1816 р.) свідчить уривок: «...Це був перший щомісячний літературно-художній журнал в Україні, на сторінках якого друкувалися байки, статті з історії Малоросії та перші спроби літературної критики українською мовою...»?","options":{"A":"«Киевская старина»","B":"«Украинский вестник»","C":"«Основа»","D":"«Зоря Галицька»"},"answer":"B"},{"id":325,"topic":"І. Початок національного відродження та «Енеїда» (кінець XVIII – початок XIX ст.)","question":"Про яке таємне товариство шляхти на Полтавщині у 1821 році пише у звіті Третє відділення царської канцелярії: «...Масонська ложа \"Любов до істини\", очолювана Василем Лукашевичем, виходила за межі звичайного масонства, прагнучи відновлення автономії Малоросії та відірвання її від імперії...»?","options":{"A":"Кирило-Мефодіївське братство","B":"Полтавське таємне товариство (Масонська ложа «Любов до істини»)","C":"Південне товариство декабристів","D":"Товариство об’єднаних слов’ян"},"answer":"B"},{"id":326,"topic":"⚔️ ІІ. Рух декабристів та польське повстання в Україні (1820-ті – 1830-ті рр.)","question":"З якого програмного документа Південного товариства декабристів, написаного Павлом Пестелем у Тульчині (Поділля), взято ці слова: «...Росія має стати єдиною і неподільною республікою. Усі племена, що її населяють, мають злитися в один народ російський, а Малоросія назавжди втрачає будь-які думки про окремішність...»?","options":{"A":"«Руська Правда» П. Пестеля","B":"«Конституція» М. Муравйова","C":"«Книга буття українського народу»","D":"«Права, за якими судиться малоросійський народ»"},"answer":"A"},{"id":327,"topic":"⚔️ ІІ. Рух декабристів та польське повстання в Україні (1820-ті – 1830-ті рр.)","question":"Яке інше таємне товариство декабристського спрямування виникло у Новограді-Волинському (1823 р.) з ініціативи братів Борисових, чий програмний лозунг проголошував: «...Створення могутньої федерації всіх слов'янських народів, де кожен народ матиме свою республіку, закони та рівні права...»?","options":{"A":"Північне товариство","B":"Товариство об'єднаних слов'ян","C":"Масонська ложа «Понт Евксінський»","D":"Кирило-Мефодіївське братство"},"answer":"B"},{"id":328,"topic":"⚔️ ІІ. Рух декабристів та польське повстання в Україні (1820-ті – 1830-ті рр.)","question":"Яке військове повстання декабристів спалахнуло в Україні наприкінці грудня 1825 — на початку січня 1826 року, підняте Сергієм Муравйовим-Апостолом?","options":{"A":"Повстання на броненосці «Потьомкін»","B":"Повстання Чернігівського полку","C":"Повстання військових поселенців у Чугуєві","D":"Виступ селян під проводом Кармелюка"},"answer":"B"},{"id":329,"topic":"⚔️ ІІ. Рух декабристів та польське повстання в Україні (1820-ті – 1830-ті рр.)","question":"Під яким відомим політичним гаслом відбувалося польське визвольне повстання 1830–1831 років, яке охопило також Правобережну Україну, коли польські пани намагалися залучити на свій бік українських селян?","options":{"A":"«Свобода, рівність, братерство!»","B":"«За нашу і вашу свободу!»","C":"«Кожен хай держить отчину свою!»","D":"«Православ'я, самодержавство, народність!»"},"answer":"B"},{"id":330,"topic":"⚔️ ІІ. Рух декабристів та польське повстання в Україні (1820-ті – 1830-ті рр.)","question":"Яка подія 1834 року в Києві була здійснена імператором Миколою І з метою «політичного і культурного зросійщення Південно-Західного краю» після розгрому польського повстання?","options":{"A":"Заснування Харківського університету","B":"Відкриття Імператорського університету Святого Володимира (Київського університету)","C":"Закриття Києво-Могилянської академії","D":"Створення першої Малоросійської колегії"},"answer":"B"},{"id":331,"topic":"🌾 ІІІ. Соціальні рухи, військово-кріпосницька система та Кармелюк","question":"Про яку специфічну форму організації армії на Харківщині та Херсонщині, запроваджену Орачеєвим, свідчить скарга селян: «...Нас перетворили на солдатів, але змушують і поле орати. Усе життя під барабанний бій, навіть одружуватися і будувати хати змушують лише за наказом капітана...»?","options":{"A":"Кріпацтво","B":"Військові поселення","C":"Рекрутчину","D":"Фільварки"},"answer":"B"},{"id":332,"topic":"🌾 ІІІ. Соціальні рухи, військово-кріпосницька система та Кармелюк","question":"Про якого легендарного ватажка селянського руху на Поділлі (1813–1835 рр.), названого в народі «українським Робін Гудом», який здійснив понад 1000 нападів на поміщицькі маєтки і чотири рази тікав із Сибіру, свідчить судова справа?","options":{"A":"Олексу Довбуша","B":"Устима Кармелюка (Кармалюка)","C":"Максима Залізняка","D":"Семена Палія"},"answer":"B"},{"id":333,"topic":"🌾 ІІІ. Соціальні рухи, військово-кріпосницька система та Кармелюк","question":"Про який масовий антикріпосницький рух на Катеринославщині та Херсонщині (1856 р.) під час Кримської війни свідчить уривок: «...Поповзли чутки, що той селянин, який запишеться в ополчення на війну, отримає від царя волю і землю. Тисячі кріпаків кидали роботу, брали майно і йшли з сім'ями до Перекопу...»?","options":{"A":"«Київську козаччину»","B":"«Похід у таврію за волею»","C":"Рух гайдамаків","D":"Повстання Чернігівського полку"},"answer":"B"},{"id":334,"topic":"🌾 ІІІ. Соціальні рухи, військово-кріпосницька система та Кармелюк","question":"Яка масова акція селян Київщини (1855 р.) виникла під час Кримської війни через урядовий маніфест про створення рухомого ополчення: «...Селяни масово записувалися в \"козаки\", відмовлялися від панщини, створювали свої виборні органи влади, вважаючи, що відновлюється давній козацький стан.
