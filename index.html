function makeSession(list,mode='practice',seconds=0){clearInterval(timerId);const optionMaps={};list.forEach(q=>{const order=shuffle(letters);optionMaps[q.id]={A:order[0],B:order[1],C:order[2],D:order[3]}});session={list:[...list],index:0,mode,answers:{},optionMaps,locked:false,seconds,started:Date.now(),deadline:mode==='exam'?Date.now()+seconds*1000:null};persist();renderQuestion();if(mode==='exam')startExamTimer()}
function formatTime(s){s=Math.max(0,Math.floor(s));return `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`}
function startExamTimer(){clearInterval(timerId);if(!session||session.mode!=='exam')return;const tick=()=>{if(!session||session.mode!=='exam'){clearInterval(timerId);return}session.seconds=Math.max(0,Math.ceil((session.deadline-Date.now())/1000));const t=document.getElementById('timer');if(t)t.textContent=formatTime(session.seconds);if(session.seconds<=0)finishSession()};tick();if(session)timerId=setInterval(tick,500)}
function startPractice(){makeSession(shuffle(QUESTIONS).slice(0,20),'practice')}
function showExamSetup(){app.innerHTML=`<div class="section-head"><div><div class="eyebrow">Налаштування іспиту</div><h2>Обери параметри</h2></div><button class="btn ghost" onclick="shell()">← На головну</button></div><div class="content"><p class="muted">Запитання випадково обиратимуться з усієї бази — усіх ${topics.length} тем та ${QUESTIONS.length} запитань.</p><div class="toolbar" style="align-items:center"><label for="examCount"><b>Кількість запитань</b></label><select class="field" id="examCount"><option value="20">20 запитань</option><option value="40" selected>40 запитань</option><option value="60">60 запитань</option></select></div><div class="toolbar" style="align-items:center"><label for="examMinutes"><b>Час на проходження</b></label><select class="field" id="examMinutes"><option value="30">30 хвилин</option><option value="45">45 хвилин</option><option value="60" selected>60 хвилин</option><option value="90">90 хвилин</option></select></div><div class="divider"></div><p class="small">Після початку іспиту запуститься таймер. Можна повертатися до попередніх запитань, змінювати відповіді та пропускати завдання. Результат буде показано після завершення або закінчення часу.</p><div class="actions"><button class="btn primary" onclick="beginConfiguredExam()">Почати іспит</button><button class="btn ghost" onclick="shell()">Скасувати</button></div></div>`}
function beginConfiguredExam(){const count=Number(document.getElementById('examCount')?.value||40),minutes=Number(document.getElementById('examMinutes')?.value||60);if(![20,40,60].includes(count)||![30,45,60,90].includes(minutes))return;makeSession(shuffle(QUESTIONS).slice(0,count),'exam',minutes*60)}
function startExam(){showExamSetup()}
function exitToHome(){if(!session)return shell();if(confirm('Повернутися на головну? Поточний прогрес і відповіді буде збережено. Таймер іспиту продовжить відлік.')){persist();shell()}}
function startMarathon(){makeSession(shuffle(QUESTIONS).slice(0,100),'marathon')}
function startMistakes(){let ids=[...new Set(stats.wrong)];let list=ids.map(id=>QUESTIONS.find(q=>q.id===id)).filter(Boolean);list.sort((a,b)=>(stats.reviewCounts[b.id]||0)-(stats.reviewCounts[a.id]||0)||(stats.attempts[a.id]||0)-(stats.attempts[b.id]||0));if(!list.length)return;makeSession(list,'mistakes')}
function startTopic(t){makeSession(shuffle(QUESTIONS.filter(q=>q.topic===t)),'topic')}
function startTopicIndex(i){startTopic(topics[i])}
const EXPLANATIONS={
1:{text:'На стоянці Королево на Закарпатті знайдено найдавніші відомі на території України кам’яні знаряддя. Енциклопедія історії України пов’язує найдавніші знахідки з Homo erectus — представниками ранньої групи людей, яку в традиційній навчальній термінології називають архантропами. Тому серед запропонованих варіантів найточніший — «архантроп».',note:'Уточнення: «пітекантроп» — історичний термін для однієї з груп Homo erectus; сучасна наукова класифікація може бути точнішою за стару шкільну назву.',sources:[['Енциклопедія історії України: «Закарпатська Україна»','https://history.org.ua/?termin=Zakarpatska_Ukraina']]},
2:{text:'Королево — багатошарова палеолітична пам’ятка біля Тиси на Закарпатті. В енциклопедичній статті зазначено 16 культурно-хронологічних комплексів, які охоплюють різні етапи палеоліту. Інститут історії України називає Королево найдавнішою з відомих стоянок первісної людини в Україні. Отже, правильна відповідь — «Королево».',note:'Датування найдавніших шарів уточнюється в наукових дослідженнях; у тесті не слід сприймати «близько 1 млн років» як абсолютно точну дату.',sources:[['Енциклопедія історії України: «Королево, археологічна пам’ятка»','https://history.org.ua/?termin=Korolevo_Pamyatka'],['Енциклопедія історії України: «Закарпатська Україна»','https://history.org.ua/?termin=Zakarpatska_Ukraina']]},
3:{text:'Мустьє — археологічна доба середнього палеоліту, яку пов’язують із неандертальцями. В енциклопедичній статті Інституту історії України зазначено, що цей період (приблизно 150–35 тис. років тому) проходив на тлі значних кліматичних коливань і наступів льодовика. Це відповідає варіанту B.',note:'Фраза про «перші спроби добування вогню» у запитанні надто спрощена: використання вогню має значно давнішу передісторію, тому вирішальна ознака тут — зв’язок мустьє з неандертальцями.',sources:[['Енциклопедія історії України: «Мустьє»','https://history.org.ua/?termin=Mustie']]},
4:{text:'Киїк-Коба — печерна пам’ятка мустьєрської доби в Криму. Енциклопедія історії України прямо згадує поховання неандертальської дитини на цій стоянці; інша біографічна стаття про дослідника Гліба Бонч-Осмоловського підтверджує виявлення там решток дорослого неандертальця та дитини. Отже, серед варіантів правильний — «неандертальців».',note:'У формулюванні про дорослу жінку варто бути обережними: використані тут енциклопедичні статті підтверджують дорослого неандертальця й дитину, але не дають однозначного підтвердження статі дорослої особи.',sources:[['Енциклопедія історії України: «Киїк-Кобинська культура»','https://history.org.ua/?termin=Kyik_Kobynska_k_ra'],['Енциклопедія історії України: «Бонч-Осмоловський Гліб Анатолійович»','https://history.org.ua/?termin=Bonch_Osmolovskyj_H']]},
5:{text:'У верхньому палеоліті на території Європи, зокрема України, поширилися люди сучасного фізичного типу — Homo sapiens. В Енциклопедії історії України зазначено, що європейських представників цієї групи часто називають кроманьйонцями. Тому в межах запропонованих відповідей правильний варіант — C.',note:'«Кроманьйонець» — традиційна назва ранніх європейських Homo sapiens, а не окремий біологічний вид.',sources:[['Енциклопедія історії України: матеріал про давню історію та антропогенез','https://history.org.ua/?termin=Davnya_istoriya']]},6:{"text":"Мізинська стоянка розташована на Десні й належить до пізнього палеоліту. Під час розкопок тут виявили орнаментовані вироби з бивня мамонта та кістки, які дослідники пов’язують із ритуальними практиками й музичними звуками. Саме цей комплекс знахідок вирізняє Мізин серед наведених стоянок.","note":"Називати кожен кістяний предмет беззаперечно музичним інструментом не варто: частина інтерпретацій має археологічний характер і потребує обережності.","sources":[["Енциклопедія історії України: матеріал про пізній палеоліт","https://resource.history.org.ua/cgi-bin/eiu/history.exe?C21COM=S&I21DBN=EIU&P21DBN=EIU&S21CNR=20&S21FMT=eiu_all&S21STR=2.+4.+1"]]},7:{"text":"Палеоліт і мезоліт належать до часу привласнювального господарства: люди жили переважно з полювання, рибальства та збиральництва, використовуючи готові природні ресурси. Відтворювальне господарство — землеробство й скотарство — поширилося пізніше, у процесі неолітичних змін.","note":"Слово «виключно» в тесті дещо категоричне: форми господарювання могли змінюватися поступово й нерівномірно в різних регіонах.","sources":[["Енциклопедія історії України: «Мезоліт»","https://resource.history.org.ua/cgi-bin/eiu/history.exe?C21COM=S&I21DBN=EIU&P21DBN=EIU&S21STR=Mezolit"]]},8:{"text":"Поширення лука та стріл — одна з характерних технологічних ознак мезоліту. Така зброя була ефективною для полювання на менших і рухливіших тварин у нових післяльодовикових ландшафтах. Археологічним свідченням її використання є численні дрібні крем’яні наконечники стріл.","note":"Лук і стріли не були єдиною новацією мезоліту, але вони є однією з найпомітніших ознак цього періоду.","sources":[["Енциклопедія історії України: «Мезоліт»","https://resource.history.org.ua/cgi-bin/eiu/history.exe?C21COM=S&I21DBN=EIU&P21DBN=EIU&S21STR=Mezolit"]]},9:{"text":"Після завершення останнього льодовикового періоду клімат потеплішав, ландшафти змінилися, а великі стада холодолюбних тварин, зокрема мамонтів, зникли або різко скоротилися. Мисливцям довелося пристосовуватися до нових умов і змінювати способи добування їжі. Цей процес пов’язаний із переходом до мезолітичних форм життя.","note":"Причиною були ширші післяльодовикові екологічні зміни, а не лише зникнення мамонтів; криза мисливства мала кілька взаємопов’язаних чинників.","sources":[["Енциклопедія історії України: «Мезоліт»","https://resource.history.org.ua/cgi-bin/eiu/history.exe?C21COM=S&I21DBN=EIU&P21DBN=EIU&S21STR=Mezolit"]]},10:{"text":"Мікроліти — невеликі крем’яні пластинки та наконечники, які вставляли в основу з дерева або кістки, утворюючи складені знаряддя. Їхнє масове поширення є характерною археологічною ознакою мезоліту, зокрема наконечників для стріл.","note":"Мікролітичні вироби трапляються в різних археологічних контекстах, але для навчального розрізнення вони особливо характерні для мезоліту.","sources":[["Енциклопедія історії України: «Мезоліт»","https://resource.history.org.ua/cgi-bin/eiu/history.exe?C21COM=S&I21DBN=EIU&P21DBN=EIU&S21STR=Mezolit"]]},11:{"text":"Неолітична, або аграрна, революція — це поступовий перехід від привласнювального господарства (полювання, збиральництва, рибальства) до відтворювального, заснованого на виробництві їжі. Цей процес включав розвиток землеробства й скотарства та змінив спосіб життя людських спільнот.","note":"Це не одномоментна подія й не однакова дата для всіх регіонів: перехід відбувався поступово та в різний час.","sources":[["Енциклопедія історії України: «Неолітична революція»","https://resource.history.org.ua/cgi-bin/eiu/history.exe?C21COM=S&I21DBN=EIU&P21DBN=ELIB&S21STR=neolitychna_revoljucija"],["Енциклопедія історії України: «Неоліт»","https://resource.history.org.ua/cgi-bin/eiu/history.exe?C21COM=S&I21DBN=EIU&P21DBN=EIU&S21STR=2.+4.+3"]]},12:{"text":"Основними новими відтворювальними заняттями стали землеробство та скотарство. Люди почали вирощувати культурні рослини й утримувати свійських тварин, а не лише добувати їжу в природі. Це сприяло осілості, появі запасів продуктів і поступовим змінам у суспільному устрої.","note":"У різних регіонах землеробство й скотарство поширювалися не одночасно; локальні господарські моделі могли відрізнятися.","sources":[["Енциклопедія історії України: «Неолітична революція»","https://resource.history.org.ua/cgi-bin/eiu/history.exe?C21COM=S&I21DBN=EIU&P21DBN=ELIB&S21STR=neolitychna_revoljucija"]]},13:{"text":"У неоліті вдосконалили обробку каменю: поширилися шліфування та свердління. Важливою технологічною новацією стало виготовлення керамічного посуду шляхом формування глини й випалювання. Ці технології дали змогу виготовляти довговічніші та різноманітніші знаряддя й предмети побуту.","note":"Поява та поширення окремих технологій у різних археологічних культурах датуються неоднаково.","sources":[["Енциклопедія історії України: «Неоліт»","https://resource.history.org.ua/cgi-bin/eiu/history.exe?C21COM=S&I21DBN=EIU&P21DBN=EIU&S21STR=2.+4.+3"]]},14:{"text":"Собака була однією з найдавніших одомашнених тварин. Її предки були пов’язані з популяціями вовків, а співпраця людини й собак виявилася корисною, зокрема, під час полювання та охорони поселень. Археологічні свідчення раннього одомашнення собак належать до доісторичних часів.","note":"Точний час і місце одомашнення собаки залишаються предметом наукових дискусій; формулювання «ще в мезоліті» є навчальним узагальненням.","sources":[["Інститут історії України НАН України: електронна енциклопедія та бібліотека","https://resource.history.org.ua/cgi-bin/eiu/history.exe?C21COM=S&I21DBN=EIU&P21DBN=EIU&S21STR=Krim"]]},15:{"text":"Гончарство виникло завдяки освоєнню властивостей глини: її можна формувати, сушити й випалювати, отримуючи міцний посуд. Кераміка стала важливою ознакою багатьох неолітичних культур і полегшила зберігання та приготування їжі.","note":"Кераміка не була єдиною новацією неоліту, а її поява в різних частинах світу відбувалася в різний час.","sources":[["Енциклопедія історії України: «Неоліт»","https://resource.history.org.ua/cgi-bin/eiu/history.exe?C21COM=S&I21DBN=EIU&P21DBN=EIU&S21STR=2.+4.+3"]]},16:{"text":"Мідь — перший метал, який люди почали використовувати для виготовлення предметів. Період поширення мідних виробів разом із кам’яними знаряддями називають енеолітом, або мідно-кам’яним віком. Назва відображає перехідний характер цієї доби.","note":"Енеоліт не означає повної відмови від кам’яних знарядь: камінь і надалі широко використовували.","sources":[["Інститут історії України: матеріали з давньої історії та енеоліту","https://resource.history.org.ua/cgi-bin/eiu/history.exe?C21COM=S&I21DBN=EIU&P21DBN=EIU&S21STR=Midno_kamyany_vik"]]},17:{"text":"Кукутені-Трипільська спільність належить до енеоліту — мідно-кам’яного віку; її розвиток охоплював також перехід до початку бронзового віку. Пам’ятки цієї археологічної культури поширені на територіях сучасних України, Молдови та Румунії.","note":"Хронологічні межі культури в літературі подаються приблизно; у статті Інституту історії України наведено орієнтир близько 5400–2750 рр. до н. е.","sources":[["Енциклопедія історії України: «Трипільська культура»","https://resource.history.org.ua/cgi-bin/eiu/history.exe?C21COM=S&FT_REQUEST=&I21DBN=EIU&P21DBN=EIU&S21ALL=%28TRN%3DTrypilska_kra%29&S21FMT=eiu_all"]]},18:{"text":"Вікентій Хвойка — археолог, із діяльністю якого пов’язане відкриття й дослідження пам’яток біля села Трипілля наприкінці XIX століття. За назвою цього поселення археологічна культура й отримала назву «трипільська».","note":"Відкриття культури було результатом археологічних досліджень і подальшого наукового опрацювання пам’яток, а не однієї знахідки.","sources":[["Енциклопедія історії України: «Трипільська культура»","https://resource.history.org.ua/cgi-bin/eiu/history.exe?C21COM=S&FT_REQUEST=&I21DBN=EIU&P21DBN=EIU&S21ALL=%28TRN%3DTrypilska_kra%29&S21FMT=eiu_all"]]},19:{"text":"Господарство трипільських спільнот спиралося передусім на землеробство й тваринництво. Археологічні матеріали свідчать про вирощування культурних рослин, утримання свійських тварин і розвиток ремесел. Тому відповідь про землеробство та скотарство найкраще описує основу їхнього господарського життя.","note":"Термін «перелогове мотичне землеробство» є узагальненням; конкретні аграрні практики могли змінюватися залежно від місцевості й часу.","sources":[["Енциклопедія історії України: «Трипільська культура»","https://resource.history.org.ua/cgi-bin/eiu/history.exe?C21COM=S&FT_REQUEST=&I21DBN=EIU&P21DBN=EIU&S21ALL=%28TRN%3DTrypilska_kra%29&S21FMT=eiu_all"]]},20:{"text":"Трипільську культуру часто називають культурою мальованої кераміки через характерний посуд, прикрашений розписними орнаментами. Кераміка є однією з найвиразніших рис матеріальної культури трипільців і важливим археологічним джерелом для її вивчення.","note":"Назва «культура мальованої кераміки» описує помітну рису матеріальної культури, але не замінює основної назви — трипільська культура.","sources":[["Енциклопедія історії України: «Трипільська культура»","https://resource.history.org.ua/cgi-bin/eiu/history.exe?C21COM=S&FT_REQUEST=&I21DBN=EIU&P21DBN=EIU&S21ALL=%28TRN%3DTrypilska_kra%29&S21FMT=eiu_all"]]},
21:{"text":"Правильна відповідь — «Протомістами». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Мідно-кам'яний вік та доба бронзи (Енеоліт, Бронза)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
22:{"text":"Правильна відповідь — «Дерев'яний каркас, обмазаний глиною (протокалові будинки)». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Мідно-кам'яний вік та доба бронзи (Енеоліт, Бронза)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
23:{"text":"Правильна відповідь — «Культ Великої Богині-Матері (родючості)». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Мідно-кам'яний вік та доба бронзи (Енеоліт, Бронза)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
24:{"text":"Правильна відповідь — «Через екологічну та кліматичну кризу (похолодання та посуху)». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Мідно-кам'яний вік та доба бронзи (Енеоліт, Бронза)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант.","note":"Зникнення трипільської культури не пояснюють однією доведеною причиною. Кліматичні зміни — одна з гіпотез; важливі також міграції, трансформація поселень і регіональні відмінності.","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
25:{"text":"Правильна відповідь — «Середньостогівська культура». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Мідно-кам'яний вік та доба бронзи (Енеоліт, Бронза)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант.","note":"Середньостогівська культура — археологічна спільність, а не одна централізована «народність»; її зв’язок із раннім скотарством степу описують обережно.","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
26:{"text":"Правильна відповідь — «Мідь та олово». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Мідно-кам'яний вік та доба бронзи (Енеоліт, Бронза)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
27:{"text":"Правильна відповідь — «Перший великий суспільний поділ праці (відокремлення скотарства від землеробства)». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Мідно-кам'яний вік та доба бронзи (Енеоліт, Бронза)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
28:{"text":"Правильна відповідь — «Кіммерійці». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Ранній залізний вік (Кіммерійці, Скіфи, Сармати, Античні міста)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
29:{"text":"Правильна відповідь — «Скіфи». Запитання перевіряє зв’язок між історичною постаттю та її конкретною роллю: важливо запам’ятати не лише ім’я, а й дію або обставину, з якою його пов’язано. Це один із ключових персональних орієнтирів теми «Ранній залізний вік (Кіммерійці, Скіфи, Сармати, Античні міста)».","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
30:{"text":"Правильна відповідь — «Геродот». Це поняття або назва, яка позначає характерну рису теми «Ранній залізний вік (Кіммерійці, Скіфи, Сармати, Античні міста)». Щоб упізнавати його в тестах, звертай увагу на визначальну ознаку, наведену в запитанні, і пов’язуй її з цим терміном. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
31:{"text":"Правильна відповідь — «Царські скіфи, скіфи-кочовики, скіфи-орачі, скіфи-землероби». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Ранній залізний вік (Кіммерійці, Скіфи, Сармати, Античні міста)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант.","note":"Поділ Геродота — це його опис різних груп скіфів, а не сучасна етнографічна класифікація.","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
32:{"text":"Правильна відповідь — «Скіфський звіриний стиль». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Ранній залізний вік (Кіммерійці, Скіфи, Сармати, Античні міста)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
33:{"text":"Правильна відповідь — «Товста Могила». Це поняття або назва, яка позначає характерну рису теми «Ранній залізний вік (Кіммерійці, Скіфи, Сармати, Античні міста)». Щоб упізнавати його в тестах, звертай увагу на визначальну ознаку, наведену в запитанні, і пов’язуй її з цим терміном.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
34:{"text":"Правильна відповідь — «Дарій I». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Ранній залізний вік (Кіммерійці, Скіфи, Сармати, Античні міста)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант.","note":"Датування походу Дарія І в джерелах і навчальній літературі може подаватися як 513 або 514 р. до н. е.; важливіше пам’ятати сам похід проти скіфів.","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
35:{"text":"Правильна відповідь — «Атей». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Ранній залізний вік (Кіммерійці, Скіфи, Сармати, Античні міста)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
36:{"text":"Правильна відповідь — «У Подунав'я та Крим (Неаполь Скіфський)». Це географічний орієнтир теми «Ранній залізний вік (Кіммерійці, Скіфи, Сармати, Античні міста)»: місце допомагає зрозуміти, де відбувалися події та як вони пов’язані з політичним або культурним простором України. Запам’ятовуй його разом із подією, а не окремо.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
37:{"text":"Правильна відповідь — «Сармати». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Ранній залізний вік (Кіммерійці, Скіфи, Сармати, Античні міста)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
38:{"text":"Правильна відповідь — «Високе становище жінок у суспільстві, їхня участь у війнах (культ амазонок)». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Ранній залізний вік (Кіммерійці, Скіфи, Сармати, Античні міста)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант.","note":"Античні описи жінок-сарматок не слід узагальнювати на всіх жінок і всі племена; археологічні поховання підтверджують різноманітність соціальних ролей.","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
39:{"text":"Правильна відповідь — «Тіра, Ольвія, Херсонес, Пантікапей». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Ранній залізний вік (Кіммерійці, Скіфи, Сармати, Античні міста)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
40:{"text":"Правильна відповідь — «Керч». Це географічний орієнтир теми «Ранній залізний вік (Кіммерійці, Скіфи, Сармати, Античні міста)»: місце допомагає зрозуміти, де відбувалися події та як вони пов’язані з політичним або культурним простором України. Запам’ятовуй його разом із подією, а не окремо.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
41:{"text":"Правильна відповідь — «Севастополь». Це географічний орієнтир теми «Ранній залізний вік (Кіммерійці, Скіфи, Сармати, Античні міста)»: місце допомагає зрозуміти, де відбувалися події та як вони пов’язані з політичним або культурним простором України. Запам’ятовуй його разом із подією, а не окремо.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
42:{"text":"Правильна відповідь — «Рабовласницька республіка (демократична чи олігархічна)». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Ранній залізний вік (Кіммерійці, Скіфи, Сармати, Античні міста)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант.","note":"Політичний лад полісів Північного Причорномор’я відрізнявся за містом і часом; формула «рабовласницька республіка» є навчальним узагальненням.","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
43:{"text":"Правильна відповідь — «Римської імперії». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Ранній залізний вік (Кіммерійці, Скіфи, Сармати, Античні міста)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант.","note":"Римський вплив і підпорядкування міст Причорномор’я відбувалися поступово та неоднаково; не всі поліси одночасно стали частиною провінційної системи.","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
44:{"text":"Правильна відповідь — «Зарубинецька та Черняхівська». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Давні слов'яни та Велике переселення народів». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
45:{"text":"Правильна відповідь — «Венеди». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Давні слов'яни та Велике переселення народів». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},

48:{"text":"Правильна відповідь — «Гуни». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Давні слов'яни та Велике переселення народів». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
49:{"text":"Правильна відповідь — «Йордан». Запитання перевіряє зв’язок між історичною постаттю та її конкретною роллю: важливо запам’ятати не лише ім’я, а й дію або обставину, з якою його пов’язано. Це один із ключових персональних орієнтирів теми «Давні слов'яни та Велике переселення народів». Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
50:{"text":"Правильна відповідь — «Язичництво (політеїзм)». Це поняття або назва, яка позначає характерну рису теми «Давні слов'яни та Велике переселення народів». Щоб упізнавати його в тестах, звертай увагу на визначальну ознаку, наведену в запитанні, і пов’язуй її з цим терміном.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
51:{"text":"Правильна відповідь — «Простір між річками Віслою, Одрою та Дніпром (Полісся, Волинь, Придніпров'я)». Це географічний орієнтир теми «Етногенез, побут та суспільство давніх слов'ян»: місце допомагає зрозуміти, де відбувалися події та як вони пов’язані з політичним або культурним простором України. Запам’ятовуй його разом із подією, а не окремо.","note":"Питання про прабатьківщину слов’ян залишається дискусійним. Названий ареал — одна з поширених навчальних реконструкцій, а не остаточно встановлена межа.","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
52:{"text":"Правильна відповідь — «Вогнево-підсічне (підсічне)». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Етногенез, побут та суспільство давніх слов'ян». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},

55:{"text":"Правильна відповідь — «Напівземлянки або землянки з дерев'яними стінами та глинобитною піччю». Це поняття або назва, яка позначає характерну рису теми «Етногенез, побут та суспільство давніх слов'ян». Щоб упізнавати його в тестах, звертай увагу на визначальну ознаку, наведену в запитанні, і пов’язуй її з цим терміном.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
56:{"text":"Правильна відповідь — «Воєнна демократія». Це поняття або назва, яка позначає характерну рису теми «Етногенез, побут та суспільство давніх слов'ян». Щоб упізнавати його в тестах, звертай увагу на визначальну ознаку, наведену в запитанні, і пов’язуй її з цим терміном.","note":"«Воєнна демократія» — традиційний історіографічний термін для перехідних суспільств; його застосування до всіх слов’янських спільнот є умовним.","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
57:{"text":"Правильна відповідь — «Віче». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Етногенез, побут та суспільство давніх слов'ян». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант.","note":"Віче мало різні форми й склад у різних громадах; твердження про участь лише дорослих чоловіків-воїнів надмірно звужує практику народних зборів.","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
58:{"text":"Правильна відповідь — «Князі та дружинники». Це поняття або назва, яка позначає характерну рису теми «Етногенез, побут та суспільство давніх слов'ян». Щоб упізнавати його в тестах, звертай увагу на визначальну ознаку, наведену в запитанні, і пов’язуй її з цим терміном.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
59:{"text":"Правильна відповідь — «Сусідської (територіальної)». Це географічний орієнтир теми «Етногенез, побут та суспільство давніх слов'ян»: місце допомагає зрозуміти, де відбувалися події та як вони пов’язані з політичним або культурним простором України. Запам’ятовуй його разом із подією, а не окремо.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
60:{"text":"Правильна відповідь — «Празько-Корчацька». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Етногенез, побут та суспільство давніх слов'ян». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
61:{"text":"Правильна відповідь — «V–VII ст. н. е.». Тут перевіряється хронологічна прив’язка: цю дату або період потрібно співвіднести з подією, названою в запитанні. У темі «Велике розселення слов'ян та воєнні союзи (Анти і Склавіни)» це допомагає розташувати факт у правильній послідовності.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},

68:{"text":"Правильна відповідь — ««Запрягали в вози замість волів чи коней дулібських жінок»». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Велике розселення слов'ян та воєнні союзи (Анти і Склавіни)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},

80:{"text":"Правильна відповідь — «Ідоли (кумири)». Це поняття або назва, яка позначає характерну рису теми «Східнослов'янські союзи племен (напередодні утворення Русі)». Щоб упізнавати його в тестах, звертай увагу на визначальну ознаку, наведену в запитанні, і пов’язуй її з цим терміном.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
81:{"text":"Правильна відповідь — ««Повість минулих літ»». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Становлення Русі-України: Аскольд, Олег, Ігор (IX ст. — 945 р.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"Літописна оповідь про походження династії та роль варягів є джерелом, яке історики критично зіставляють з іншими свідченнями.","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},

86:{"text":"Правильна відповідь — «Князь Олег». Запитання перевіряє зв’язок між історичною постаттю та її конкретною роллю: важливо запам’ятати не лише ім’я, а й дію або обставину, з якою його пов’язано. Це один із ключових персональних орієнтирів теми «Становлення Русі-України: Аскольд, Олег, Ігор (IX ст. — 945 р.)». Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},

90:{"text":"Правильна відповідь — «911 р.». Тут перевіряється хронологічна прив’язка: цю дату або період потрібно співвіднести з подією, названою в запитанні. У темі «Становлення Русі-України: Аскольд, Олег, Ігор (IX ст. — 945 р.)» це допомагає розташувати факт у правильній послідовності.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},

92:{"text":"Правильна відповідь — «Грецький вогонь». Це поняття або назва, яка позначає характерну рису теми «Становлення Русі-України: Аскольд, Олег, Ігор (IX ст. — 945 р.)». Щоб упізнавати його в тестах, звертай увагу на визначальну ознаку, наведену в запитанні, і пов’язуй її з цим терміном.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},

100:{"text":"Правильна відповідь — «Олена». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Реформи та дипломатія: Княгиня Ольга (945–964 рр.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант.","note":"Традиція пов’язує хрещення Ольги з Константинополем і християнським ім’ям Олена, але точні обставини та датування події дискутуються.","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},

102:{"text":"Правильна відповідь — «Адальберт Магдебурзький». Запитання перевіряє зв’язок між історичною постаттю та її конкретною роллю: важливо запам’ятати не лише ім’я, а й дію або обставину, з якою його пов’язано. Це один із ключових персональних орієнтирів теми «Реформи та дипломатія: Княгиня Ольга (945–964 рр.)».","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},

127:{"text":"Правильна відповідь — «Київський митрополит (підпорядкований Патріарху Константинопольському)». Запитання перевіряє зв’язок між історичною постаттю та її конкретною роллю: важливо запам’ятати не лише ім’я, а й дію або обставину, з якою його пов’язано. Це один із ключових персональних орієнтирів теми «Перша міжусобиця та реформи Володимира Великого (972–1015 рр.)».","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
128:{"text":"Правильна відповідь — «З Чехією, Угорщиною, Польщею, Германією та Папою Римським». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Перша міжусобиця та реформи Володимира Великого (972–1015 рр.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
129:{"text":"Правильна відповідь — «1015 р.». Тут перевіряється хронологічна прив’язка: цю дату або період потрібно співвіднести з подією, названою в запитанні. У темі «Перша міжусобиця та реформи Володимира Великого (972–1015 рр.)» це допомагає розташувати факт у правильній послідовності.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
130:{"text":"Правильна відповідь — «Святополк (Окаянний)». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Друга міжусобиця та правління Ярослава Мудрого (1015–1054 рр.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант.","note":"Літописна традиція пов’язує загибель Бориса й Гліба зі Святополком, але історики враховують складність джерел і політичну боротьбу між нащадками Володимира.","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
131:{"text":"Правильна відповідь — «Борис і Гліб». Запитання перевіряє зв’язок між історичною постаттю та її конкретною роллю: важливо запам’ятати не лише ім’я, а й дію або обставину, з якою його пов’язано. Це один із ключових персональних орієнтирів теми «Друга міжусобиця та правління Ярослава Мудрого (1015–1054 рр.)».","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},

134:{"text":"Правильна відповідь — «Альта». Це географічний орієнтир теми «Друга міжусобиця та правління Ярослава Мудрого (1015–1054 рр.)»: місце допомагає зрозуміти, де відбувалися події та як вони пов’язані з політичним або культурним простором України. Запам’ятовуй його разом із подією, а не окремо.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},

137:{"text":"Правильна відповідь — «1036 р.». Тут перевіряється хронологічна прив’язка: цю дату або період потрібно співвіднести з подією, названою в запитанні. У темі «Друга міжусобиця та правління Ярослава Мудрого (1015–1054 рр.)» це допомагає розташувати факт у правильній послідовності.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
138:{"text":"Правильна відповідь — ««Правда Ярослава»». Це поняття або назва, яка позначає характерну рису теми «Друга міжусобиця та правління Ярослава Мудрого (1015–1054 рр.)». Щоб упізнавати його в тестах, звертай увагу на визначальну ознаку, наведену в запитанні, і пов’язуй її з цим терміном. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
139:{"text":"Правильна відповідь — «Збереження кровної помсти, але обмеження її лише колом найближчих родичів (або виплата грошового штрафу — вири)». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Друга міжусобиця та правління Ярослава Мудрого (1015–1054 рр.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},

142:{"text":"Правильна відповідь — «Анна». Запитання перевіряє зв’язок між історичною постаттю та її конкретною роллю: важливо запам’ятати не лише ім’я, а й дію або обставину, з якою його пов’язано. Це один із ключових персональних орієнтирів теми «Друга міжусобиця та правління Ярослава Мудрого (1015–1054 рр.)».","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},

150:{"text":"Правильна відповідь — «Селяни, які уклали з землевласником договір («ряд») про умови своєї праці». Запитання перевіряє зв’язок між історичною постаттю та її конкретною роллю: важливо запам’ятати не лише ім’я, а й дію або обставину, з якою його пов’язано. Це один із ключових персональних орієнтирів теми «Соціально-економічний розвиток, культура та церква (X – початок XII ст.)». Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},

156:{"text":"Правильна відповідь — «Дитинець». Це географічний орієнтир теми «Соціально-економічний розвиток, культура та церква (X – початок XII ст.)»: місце допомагає зрозуміти, де відбувалися події та як вони пов’язані з політичним або культурним простором України. Запам’ятовуй його разом із подією, а не окремо.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},

162:{"text":"Правильна відповідь — «Нестор (Літописець)». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Соціально-економічний розвиток, культура та церква (X – початок XII ст.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},

168:{"text":"Правильна відповідь — «Київ». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Тести за цитатами з літописів (Хронологія та Діячі)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
169:{"text":"Правильна відповідь — ««Із варягів у греки»». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Тести за цитатами з літописів (Хронологія та Діячі)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
170:{"text":"Правильна відповідь — «Олегу». Запитання перевіряє зв’язок між історичною постаттю та її конкретною роллю: важливо запам’ятати не лише ім’я, а й дію або обставину, з якою його пов’язано. Це один із ключових персональних орієнтирів теми «Тести за цитатами з літописів (Хронологія та Діячі)». Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"Літописні промови часто передаються літературно обробленою мовою літописця; їх варто сприймати як джерело про пам’ять і легітимацію влади, а не стенограму.","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
171:{"text":"Правильна відповідь — «Похід на Царгород 907 р.». Тут перевіряється хронологічна прив’язка: цю дату або період потрібно співвіднести з подією, названою в запитанні. У темі «Тести за цитатами з літописів (Хронологія та Діячі)» це допомагає розташувати факт у правильній послідовності. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
172:{"text":"Правильна відповідь — «Князя Ігоря». Тут перевіряється хронологічна прив’язка: цю дату або період потрібно співвіднести з подією, названою в запитанні. У темі «Тести за цитатами з літописів (Хронологія та Діячі)» це допомагає розташувати факт у правильній послідовності. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
173:{"text":"Правильна відповідь — «Початок помсти за смерть Ігоря». Вирішальна підказка міститься в описі події або джерельному фрагменті: він указує на характерні обставини, учасників чи наслідки. Тому відповідь потрібно пов’язувати саме з цим епізодом теми «Тести за цитатами з літописів (Хронологія та Діячі)», а не лише запам’ятовувати назву. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
174:{"text":"Правильна відповідь — «Адміністративно-податкову реформу». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Тести за цитатами з літописів (Хронологія та Діячі)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
175:{"text":"Правильна відповідь — «Святославу Хороброму». Тут перевіряється хронологічна прив’язка: цю дату або період потрібно співвіднести з подією, названою в запитанні. У темі «Тести за цитатами з літописів (Хронологія та Діячі)» це допомагає розташувати факт у правильній послідовності. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
176:{"text":"Правильна відповідь — «Святослав». Це географічний орієнтир теми «Тести за цитатами з літописів (Хронологія та Діячі)»: місце допомагає зрозуміти, де відбувалися події та як вони пов’язані з політичним або культурним простором України. Запам’ятовуй його разом із подією, а не окремо. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
177:{"text":"Правильна відповідь — «Князя Святослава біля Дніпрових порогів». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Тести за цитатами з літописів (Хронологія та Діячі)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
178:{"text":"Правильна відповідь — «Язичницьку реформу 980 року». Вирішальна підказка міститься в описі події або джерельному фрагменті: він указує на характерні обставини, учасників чи наслідки. Тому відповідь потрібно пов’язувати саме з цим епізодом теми «Тести за цитатами з літописів (Хронологія та Діячі)», а не лише запам’ятовувати назву. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
179:{"text":"Правильна відповідь — «Початок Хрещення Русі у 988 році». Тут перевіряється хронологічна прив’язка: цю дату або період потрібно співвіднести з подією, названою в запитанні. У темі «Тести за цитатами з літописів (Хронологія та Діячі)» це допомагає розташувати факт у правильній послідовності. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
180:{"text":"Правильна відповідь — «Князь Володимир Великий». Запитання перевіряє зв’язок між історичною постаттю та її конкретною роллю: важливо запам’ятати не лише ім’я, а й дію або обставину, з якою його пов’язано. Це один із ключових персональних орієнтирів теми «Тести за цитатами з літописів (Хронологія та Діячі)». Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
181:{"text":"Правильна відповідь — «Десятинна церква». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Тести за цитатами з літописів (Хронологія та Діячі)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"Літописні цитати можуть мати редакційні нашарування; для відповіді важливо впізнати сюжет, але не трактувати текст як дослівний запис розмови.","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},

197:{"text":"Правильна відповідь — «Володимиру Мономаху». Запитання перевіряє зв’язок між історичною постаттю та її конкретною роллю: важливо запам’ятати не лише ім’я, а й дію або обставину, з якою його пов’язано. Це один із ключових персональних орієнтирів теми «Документи та Тексти культурно-ідеологічного характеру». Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},

215:{"text":"Правильна відповідь — «Коронацію Данила Романовича королем Русі». Вирішальна підказка міститься в описі події або джерельному фрагменті: він указує на характерні обставини, учасників чи наслідки. Тому відповідь потрібно пов’язувати саме з цим епізодом теми «Об'єднання Галичини і Волині та перша навала (кінець XII – XIII ст.)», а не лише запам’ятовувати назву. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
216:{"text":"Правильна відповідь — «Львів». Тут перевіряється хронологічна прив’язка: цю дату або період потрібно співвіднести з подією, названою в запитанні. У темі «Об'єднання Галичини і Волині та перша навала (кінець XII – XIII ст.)» це допомагає розташувати факт у правильній послідовності. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
217:{"text":"Правильна відповідь — «Бурундай». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Об'єднання Галичини і Волині та перша навала (кінець XII – XIII ст.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
218:{"text":"Правильна відповідь — «Могутність галицького боярства (боярське свавілля)». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Уривки з джерел про суспільний устрій, культуру та право Галичини й Волині». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
219:{"text":"Правильна відповідь — «Конфлікт між Ярославом Осмомислом та галицьким боярством». Це географічний орієнтир теми «Уривки з джерел про суспільний устрій, культуру та право Галичини й Волині»: місце допомагає зрозуміти, де відбувалися події та як вони пов’язані з політичним або культурним простором України. Запам’ятовуй його разом із подією, а не окремо. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},

229:{"text":"Правильна відповідь — ««Руської Правди»». Запитання перевіряє зв’язок між історичною постаттю та її конкретною роллю: важливо запам’ятати не лише ім’я, а й дію або обставину, з якою його пов’язано. Це один із ключових персональних орієнтирів теми «Додатковий блок цитат для завдань на відповідність НМТ». Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
230:{"text":"Правильна відповідь — «Східнослов'янські племена (поляни, словени, кривичі) до варягів». Запитання перевіряє зв’язок між історичною постаттю та її конкретною роллю: важливо запам’ятати не лише ім’я, а й дію або обставину, з якою його пов’язано. Це один із ключових персональних орієнтирів теми «Додатковий блок цитат для завдань на відповідність НМТ». Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"У запитанні змішано формулювання про «норманську теорію» з літописним сюжетом про запрошення варягів. Звіряй саме літописний епізод і не сприймай запропоновану відповідь як точну цитату.","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
231:{"text":"Правильна відповідь — «Першу помсту Ольги за вбивство Ігоря». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Додатковий блок цитат для завдань на відповідність НМТ». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},

233:{"text":"Правильна відповідь — «Повне скасування кровної помсти та заміна її державним штрафом». Це географічний орієнтир теми «Додатковий блок цитат для завдань на відповідність НМТ»: місце допомагає зрозуміти, де відбувалися події та як вони пов’язані з політичним або культурним простором України. Запам’ятовуй його разом із подією, а не окремо. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
234:{"text":"Правильна відповідь — «Києво-Печерську лавру». Це географічний орієнтир теми «Додатковий блок цитат для завдань на відповідність НМТ»: місце допомагає зрозуміти, де відбувалися події та як вони пов’язані з політичним або культурним простором України. Запам’ятовуй його разом із подією, а не окремо. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},

236:{"text":"Правильна відповідь — «Обґрунтування величі Русі та її рівноправності серед провідних християнських держав світу». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Додатковий блок цитат для завдань на відповідність НМТ». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
237:{"text":"Правильна відповідь — «Використання кочовиків у князівських міжусобицях». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Цитати з правових актів, описів побуту та міжусобиць». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
238:{"text":"Правильна відповідь — «Обмеження спадкових прав залежних селян (смердів) на користь держави». Це географічний орієнтир теми «Цитати з правових актів, описів побуту та міжусобиць»: місце допомагає зрозуміти, де відбувалися події та як вони пов’язані з політичним або культурним простором України. Запам’ятовуй його разом із подією, а не окремо. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
239:{"text":"Правильна відповідь — «Норм права, що захищали інтереси рабовласників (власників холопів)». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Цитати з правових актів, описів побуту та міжусобиць». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
240:{"text":"Правильна відповідь — ««Галицько-Волинський літопис»». Вирішальна підказка міститься в описі події або джерельному фрагменті: він указує на характерні обставини, учасників чи наслідки. Тому відповідь потрібно пов’язувати саме з цим епізодом теми «Цитати з правових актів, описів побуту та міжусобиць», а не лише запам’ятовувати назву. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},

246:{"text":"Правильна відповідь — «Мстислава Тмутараканського (брата Ярослава Мудрого)». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Цитати з правових актів, описів побуту та міжусобиць». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
247:{"text":"Правильна відповідь — «Битву на Синіх Водах». Вирішальна підказка міститься в описі події або джерельному фрагменті: він указує на характерні обставини, учасників чи наслідки. Тому відповідь потрібно пов’язувати саме з цим епізодом теми «Литовська доба, Кревська унія та битва на Синіх Водах (XIV ст.)», а не лише запам’ятовувати назву. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},

249:{"text":"Правильна відповідь — «Початок династичного союзу між Великим князівством Литовським і Польщею та посилення католицького впливу». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Литовська доба, Кревська унія та битва на Синіх Водах (XIV ст.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
250:{"text":"Правильна відповідь — «Ліквідацію найбільших українських удільних князівств наприкінці XIV ст.». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Литовська доба, Кревська унія та битва на Синіх Водах (XIV ст.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"Ліквідація удільних князівств була тривалим політичним процесом, а не одноразовим актом Вітовта в один рік.","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
251:{"text":"Правильна відповідь — «Битву на річці Ворсклі». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Литовська доба, Кревська унія та битва на Синіх Водах (XIV ст.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
252:{"text":"Правильна відповідь — «Грюнвальдську битву». Це географічний орієнтир теми «Литовська доба, Кревська унія та битва на Синіх Водах (XIV ст.)»: місце допомагає зрозуміти, де відбувалися події та як вони пов’язані з політичним або культурним простором України. Запам’ятовуй його разом із подією, а не окремо. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
