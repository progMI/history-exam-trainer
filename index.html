412:{"text":"Правильна відповідь — «Державний переворот та встановлення Української Держави (Гетьманату)». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Доба Гетьманату, Директорії УНР та ЗУНР (1918–1921 рр.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
413:{"text":"Правильна відповідь — «Заснував Українську академію наук (очолену В. Вернадським), два державні університети (у Києві та Кам'янці-Подільському), Національну бібліотеку та галерею». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Доба Гетьманату, Директорії УНР та ЗУНР (1918–1921 рр.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
414:{"text":"Правильна відповідь — «Повстання Директорії УНР (на чолі з В. Винниченком та С. Петлюрою)». Вирішальна підказка міститься в описі події або джерельному фрагменті: він указує на характерні обставини, учасників чи наслідки. Тому відповідь потрібно пов’язувати саме з цим епізодом теми «Доба Гетьманату, Директорії УНР та ЗУНР (1918–1921 рр.)», а не лише запам’ятовувати назву. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
415:{"text":"Правильна відповідь — «Листопадовий чин (Листопадова революція в Галичині)». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Доба Гетьманату, Директорії УНР та ЗУНР (1918–1921 рр.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
416:{"text":"Правильна відповідь — «Західноукраїнська Народна Республіка (ЗУНР)». Це поняття або назва, яка позначає характерну рису теми «Доба Гетьманату, Директорії УНР та ЗУНР (1918–1921 рр.)». Щоб упізнавати його в тестах, звертай увагу на визначальну ознаку, наведену в запитанні, і пов’язуй її з цим терміном.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},

433:{"text":"Правильна відповідь — «Голодомор 1932–1933 років (геноцид українського народу)». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «УСРР в умовах НЕПу та тоталітарного режиму (1920–1930-ті рр.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
434:{"text":"Правильна відповідь — ««Розстріляне відродження»». Це поняття або назва, яка позначає характерну рису теми «УСРР в умовах НЕПу та тоталітарного режиму (1920–1930-ті рр.)». Щоб упізнавати його в тестах, звертай увагу на визначальну ознаку, наведену в запитанні, і пов’язуй її з цим терміном.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
435:{"text":"Правильна відповідь — «Василь Липківський («народний митрополит»)». Запитання перевіряє зв’язок між історичною постаттю та її конкретною роллю: важливо запам’ятати не лише ім’я, а й дію або обставину, з якою його пов’язано. Це один із ключових персональних орієнтирів теми «УСРР в умовах НЕПу та тоталітарного режиму (1920–1930-ті рр.)».","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},

440:{"text":"Правильна відповідь — «Андрій Мельник». Запитання перевіряє зв’язок між історичною постаттю та її конкретною роллю: важливо запам’ятати не лише ім’я, а й дію або обставину, з якою його пов’язано. Це один із ключових персональних орієнтирів теми «УСРР в умовах НЕПу та тоталітарного режиму (1920–1930-ті рр.)».","note":"Після загибелі Євгена Коновальця ОУН пережила внутрішнє загострення, що згодом призвело до розколу; важливо не плутати керівництво ОУН(м) та ОУН(б).","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},

443:{"text":"Правильна відповідь — «Пакт Молотова-Ріббентропа (Договір про ненапад між Німеччиною та СРСР)». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Друга світова війна та визвольний рух (1939–1945 рр.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
444:{"text":"Правильна відповідь — ««Визвольний похід Червоної армії»». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Друга світова війна та визвольний рух (1939–1945 рр.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
445:{"text":"Правильна відповідь — «Акт відновлення Української Держави». Документ слід упізнавати за його змістом і наслідками, описаними в запитанні: саме ці ознаки відрізняють його від інших актів доби. У темі «Друга світова війна та визвольний рух (1939–1945 рр.)» він показує, як юридичні рішення змінювали владу, права або суспільні відносини. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
446:{"text":"Правильна відповідь — «Райхскомісаріат «Україна»». Це поняття або назва, яка позначає характерну рису теми «Друга світова війна та визвольний рух (1939–1945 рр.)». Щоб упізнавати його в тестах, звертай увагу на визначальну ознаку, наведену в запитанні, і пов’язуй її з цим терміном. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
447:{"text":"Правильна відповідь — «Трансністрію». Це поняття або назва, яка позначає характерну рису теми «Друга світова війна та визвольний рух (1939–1945 рр.)». Щоб упізнавати його в тестах, звертай увагу на визначальну ознаку, наведену в запитанні, і пов’язуй її з цим терміном.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
448:{"text":"Правильна відповідь — «Остарбайтерів («східних робітників»)». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Друга світова війна та визвольний рух (1939–1945 рр.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
449:{"text":"Правильна відповідь — «Бабин Яр». Це географічний орієнтир теми «Друга світова війна та визвольний рух (1939–1945 рр.)»: місце допомагає зрозуміти, де відбувалися події та як вони пов’язані з політичним або культурним простором України. Запам’ятовуй його разом із подією, а не окремо.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
450:{"text":"Правильна відповідь — «Українську повстанську армію (УПА)». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Друга світова війна та визвольний рух (1939–1945 рр.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"Дату 14 жовтня 1942 р. традиційно вшановували як символічну дату створення УПА; історики розглядають формування різних її відділів як процес, що тривав.","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},

458:{"text":"Правильна відповідь — «Операцію «Захід» (1947 р.)». Це поняття або назва, яка позначає характерну рису теми «Україна в перше повоєнне десятиліття (1945 — середина 1950-х рр.)». Щоб упізнавати його в тестах, звертай увагу на визначальну ознаку, наведену в запитанні, і пов’язуй її з цим терміном. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},

460:{"text":"Правильна відповідь — «Василь Кук (коваль)». Запитання перевіряє зв’язок між історичною постаттю та її конкретною роллю: важливо запам’ятати не лише ім’я, а й дію або обставину, з якою його пов’язано. Це один із ключових персональних орієнтирів теми «Україна в перше повоєнне десятиліття (1945 — середина 1950-х рр.)».","note":"Після загибелі Романа Шухевича Василь Кук став одним із керівників підпілля та останнім головним командиром УПА; точні дати арешту й організаційні титули залежать від джерела.","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},

472:{"text":"Правильна відповідь — ««Український вісник»». Це поняття або назва, яка позначає характерну рису теми «Україна в роки «відлиги» та «застою» (середина 1950-х — середина 1980-х рр.)». Щоб упізнавати його в тестах, звертай увагу на визначальну ознаку, наведену в запитанні, і пов’язуй її з цим терміном. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},

480:{"text":"Правильна відповідь — «26 квітня 1986 року». Тут перевіряється хронологічна прив’язка: цю дату або період потрібно співвіднести з подією, названою в запитанні. У темі ««Перебудова», Чорнобильська катастрофа та шлях до Незалежності (1985–1991 рр.)» це допомагає розташувати факт у правильній послідовності.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},

488:{"text":"Правильна відповідь — «Серпневий путч (ГКЧП) у Москві». Вирішальна підказка міститься в описі події або джерельному фрагменті: він указує на характерні обставини, учасників чи наслідки. Тому відповідь потрібно пов’язувати саме з цим епізодом теми ««Перебудова», Чорнобильська катастрофа та шлях до Незалежності (1985–1991 рр.)», а не лише запам’ятовувати назву. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},

490:{"text":"Правильна відповідь — «Всеукраїнський референдум». Тут перевіряється хронологічна прив’язка: цю дату або період потрібно співвіднести з подією, названою в запитанні. У темі ««Перебудова», Чорнобильська катастрофа та шлях до Незалежності (1985–1991 рр.)» це допомагає розташувати факт у правильній послідовності. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
491:{"text":"Правильна відповідь — «Леоніда Кравчука». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу ««Перебудова», Чорнобильська катастрофа та шлях до Незалежності (1985–1991 рр.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
492:{"text":"Правильна відповідь — «Біловезьку угоду (про створення СНД)». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу ««Перебудова», Чорнобильська катастрофа та шлях до Незалежності (1985–1991 рр.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
493:{"text":"Правильна відповідь — «Підписання Будапештського меморандуму (ядерне роззброєння України)». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Новітня історія: Україна на шляху незалежності (кінець ХХ ст.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
494:{"text":"Правильна відповідь — «1996 році (28 червня)». Тут перевіряється хронологічна прив’язка: цю дату або період потрібно співвіднести з подією, названою в запитанні. У темі «Новітня історія: Україна на шляху незалежності (кінець ХХ ст.)» це допомагає розташувати факт у правильній послідовності. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
495:{"text":"Правильна відповідь — «Гривня». Це поняття або назва, яка позначає характерну рису теми «Новітня історія: Україна на шляху незалежності (кінець ХХ ст.)». Щоб упізнавати його в тестах, звертай увагу на визначальну ознаку, наведену в запитанні, і пов’язуй її з цим терміном.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
496:{"text":"Правильна відповідь — «Леонід Каденюк». Запитання перевіряє зв’язок між історичною постаттю та її конкретною роллю: важливо запам’ятати не лише ім’я, а й дію або обставину, з якою його пов’язано. Це один із ключових персональних орієнтирів теми «Новітня історія: Україна на шляху незалежності (кінець ХХ ст.)». Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
497:{"text":"Правильна відповідь — «Леонід Кучма». Запитання перевіряє зв’язок між історичною постаттю та її конкретною роллю: важливо запам’ятати не лише ім’я, а й дію або обставину, з якою його пов’язано. Це один із ключових персональних орієнтирів теми «Новітня історія: Україна на шляху незалежності (кінець ХХ ст.)».","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
498:{"text":"Правильна відповідь — «Українська греко-католицька церква (УГКЦ)». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Новітня історія: Україна на шляху незалежності (кінець ХХ ст.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
499:{"text":"Правильна відповідь — «Юридичне закріплення визнання Росією територіальної цілісності та кордонів України наприкінці ХХ ст.». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Новітня історія: Україна на шляху незалежності (кінець ХХ ст.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
500:{"text":"Правильна відповідь — «Попри жахливі тоталітарні трагедії (Голодомори, репресії, дві світові війни), український народ зумів зберегти свою національну ідентичність, мову, культуру та волелюбні традиції, пройшовши шлях від утисків у двох імперіях до відновлення соборної, суверенної та незалежної держави в 1991 році». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Новітня історія: Україна на шляху незалежності (кінець ХХ ст.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант.","note":"Це узагальнювальна оцінка ХХ ст., а не факт, який можна звести до однієї події. Вона поєднує трагедії, збереження ідентичності та відновлення незалежності 1991 р.","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]}
};
function explanationHTML(q){const p=EXPLANATIONS[q.id];if(!p)return '';return `<div class="explain"><strong>Історичне пояснення</strong><div style="margin-top:6px">${p.text}</div>${p.note?`<div class="small" style="margin-top:8px"><b>Наукове уточнення:</b> ${p.note}</div>`:''}<div class="small" style="margin-top:9px"><b>Джерела:</b> ${p.sources.map(s=>`<a href="${s[1]}" target="_blank" rel="noopener" style="color:var(--accent2);text-decoration:underline">${s[0]}</a>`).join(' · ')}</div></div>`}
function explainQuestion(q){if(EXPLANATIONS[q.id])return explanationHTML(q);return `<div class=\"explain\"><strong>Пояснення тимчасово недоступне</strong><div class=\"small\">Перевір правильну відповідь за ключем тесту.</div></div>`}
function renderQuestion(){if(!session)return;let q=session.list[session.index],chosen=session.answers[q.id],locked=chosen!==undefined;let map=session.optionMaps[q.id]||{A:'A',B:'B',C:'C',D:'D'};let correctDisplay=letters.find(l=>map[l]===q.answer);let isExam=session.mode==='exam';let progress=Math.round((session.index+(locked?1:0))/session.list.length*100);let modeNames={exam:'Екзаменаційний режим',topic:'Тематичне тренування',mistakes:'Розумне повторення',marathon:'Марафон на 100',practice:'Тренування'};app.innerHTML=`<div class="section-head"><div><div class="eyebrow">${modeNames[session.mode]||'Тренування'}</div><h2>${isExam?'Пробний іспит':session.mode==='marathon'?'Марафон — 100 запитань':'Запитання'}</h2></div><div class="actions" style="align-items:center"><div class="timer" id="timer">${isExam?formatTime(session.seconds):''}</div><button class="btn ghost" onclick="exitToHome()">На головну</button></div></div><div class="content"><div class="qtop"><span>Запитання ${session.index+1} із ${session.list.length} · №${q.id} у документі</span><span>${locked?(isExam?'Відповідь обрано':'Відповідь зафіксовано'):'Обери один варіант'}</span></div><div class="progress"><i style="width:${progress}%"></i></div><div class="topic-tag">${esc(q.topic)}</div><h2 class="question">${esc(q.question)}</h2><div class="options">${letters.map(l=>{const original=map[l];return `<button class="option ${!isExam&&locked&&original===q.answer?'correct':''} ${!isExam&&locked&&l===chosen&&original!==q.answer?'wrong':''} ${isExam&&locked&&l===chosen?'selected':''}" ${locked&&!isExam?'disabled':''} onclick="choose('${l}')"><span class="letter">${l}</span><span>${esc(q.options[original])}</span></button>`}).join('')}</div>${locked&&!isExam?`<div class="feedback ${map[chosen]===q.answer?'good':'bad'}"><strong>${map[chosen]===q.answer?'✓ Правильно!':'✕ Не зовсім.'}</strong><div class="small" style="margin-top:4px">Правильна відповідь: <b>${correctDisplay}. ${esc(q.options[q.answer])}</b></div><div class="explain"><strong>Пояснення</strong><div style="margin-top:5px">${explainQuestion(q)}</div></div></div>`:''}<div class="qfoot"><span class="small">${isExam?'В іспиті можна змінювати відповіді та повертатися до попередніх запитань.':'Після відповіді з’явиться пояснення.'}</span><div class="actions">${session.index>0?'<button class="btn ghost" onclick="prevQ()">← Назад</button>':''}${isExam?'<button class="btn" onclick="skipQ()">Пропустити</button>':''}<button class="btn primary" onclick="nextQ()" ${!locked&&!isExam?'disabled':''}>${session.index===session.list.length-1?'Завершити':'Далі →'}</button></div></div></div><div class="footnote">${isExam?`Відповіли: ${Object.keys(session.answers).length} із ${session.list.length}. Пропущені запитання потраплять до повторення.`:''}</div>`}
function recordAnswer(q,a){stats.attempts[q.id]=(stats.attempts[q.id]||0)+1;if(a===q.answer){stats.correct++;stats.wrong=stats.wrong.filter(id=>id!==q.id)}else{stats.reviewCounts[q.id]=(stats.reviewCounts[q.id]||0)+1;if(!stats.wrong.includes(q.id))stats.wrong.push(q.id)}stats.answered++}
function choose(l){if(!session)return;let q=session.list[session.index],map=session.optionMaps[q.id]||{A:'A',B:'B',C:'C',D:'D'};if(session.answers[q.id]!==undefined&&session.mode!=='exam')return;session.answers[q.id]=l;if(session.mode!=='exam')recordAnswer(q,map[l]);persist();renderQuestion()}
function prevQ(){if(session&&session.index>0){session.index--;persist();renderQuestion()}}
function skipQ(){if(session&&session.index<session.list.length-1){session.index++;persist();renderQuestion()}else finishSession()}
function nextQ(){if(!session)return;if(session.index<session.list.length-1){session.index++;persist();renderQuestion();return}finishSession()}
function finishSession(){if(!session)return;clearInterval(timerId);let total=session.list.length,correct=0,answered=0,skipped=0;session.list.forEach(q=>{let display=session.answers[q.id];if(display!==undefined){answered++;let original=(session.optionMaps[q.id]||{A:'A',B:'B',C:'C',D:'D'})[display];if(original===q.answer)correct++;if(session.mode==='exam')recordAnswer(q,original)}else{skipped++;if(session.mode==='exam'){if(!stats.wrong.includes(q.id))stats.wrong.push(q.id);}}});if(session.mode==='exam')stats.skipped+=skipped;let score=total?Math.round(correct/total*100):0;let mode=session.mode;stats.history.push({date:new Date().toISOString().slice(0,10),score,correct,total,answered,skipped,mode});stats.history=stats.history.slice(-60);window.lastSession={list:session.list,answers:{...session.answers},optionMaps:JSON.parse(JSON.stringify(session.optionMaps))};session=null;persist();app.innerHTML=`<div class="content result"><div class="eyebrow">${mode==='exam'?'Іспит завершено':mode==='marathon'?'Марафон завершено':'Сесію завершено'}</div><div class="result-score">${score}%</div><h2>${score>=80?'Чудовий результат!':score>=60?'Гарний поступ.':'Є що повторити — це нормально.'}</h2><p class="muted">Правильних відповідей: <b>${correct}</b> із ${total}. Відповіли на ${answered} запитань. Пропущено: ${skipped}.</p><div class="stats" style="text-align:left"><div class="stat"><strong>${correct}</strong><span>Правильно</span></div><div class="stat"><strong>${total-correct}</strong><span>Помилок / пропусків</span></div><div class="stat"><strong>${score}%</strong><span>Результат</span></div><div class="stat"><strong>${stats.wrong.length}</strong><span>На повторення</span></div></div><div class="actions" style="justify-content:center"><button class="btn primary" onclick="startPractice()">Ще тренування</button><button class="btn" onclick="reviewSession()">Розібрати відповіді</button><button class="btn ghost" onclick="shell()">На головну</button></div></div>`}
function reviewSession(){let s=window.lastSession;if(!s)return;app.innerHTML=`<div class="section-head"><div><div class="eyebrow">Розбір результату</div><h2>Перевір свої відповіді</h2></div><button class="btn ghost" onclick="shell()">На головну</button></div><div class="content">${s.list.map((q,i)=>{let a=s.answers[q.id],map=s.optionMaps?.[q.id]||{A:'A',B:'B',C:'C',D:'D'},original=a!==undefined?map[a]:undefined,correctDisplay=letters.find(l=>map[l]===q.answer),ok=original===q.answer;return `<div style="padding:14px 0;border-bottom:1px solid var(--line)"><div class="small">№${q.id} · ${ok?'✓ правильно':a===undefined?'○ пропуск':'✕ помилка'}</div><strong>${esc(q.question)}</strong><div class="small" style="margin-top:6px">Твоя відповідь: ${a!==undefined? a+'. '+esc(q.options[original]):'не було'}<br>Правильна: <b>${correctDisplay}. ${esc(q.options[q.answer])}</b></div><div class="explain"><strong>Пояснення</strong><div style="margin-top:5px">${explainQuestion(q)}</div></div></div>`}).join('')}<div class="actions" style="margin-top:18px"><button class="btn primary" onclick="shell()">Готово</button></div></div>`}
function showTopics(){app.innerHTML=`<div class="section-head"><div><div class="eyebrow">Тематичне тренування</div><h2>Обери історичний розділ</h2></div><button class="btn ghost" onclick="shell()">← Головна</button></div><div class="topic-list">${topics.map((t,i)=>`<button class="topic-row" onclick="startTopicIndex(${i})"><strong>${esc(t)}</strong><span class="pill">${QUESTIONS.filter(q=>q.topic===t).length} питань →</span></button>`).join('')}</div>`}
function libraryResultsHTML(list){return `${list.slice(0,120).map(q=>`<div class="result-row"><div class="small">№${q.id} · ${esc(q.topic)}</div><strong>${esc(q.question)}</strong><div class="small" style="margin-top:5px">Правильна відповідь: <b>${q.answer}. ${esc(q.options[q.answer])}</b></div><div class="small" style="margin-top:5px">${explainQuestion(q)}</div></div>`).join('')}${list.length>120?'<p class="small">Показано перші 120 результатів. Уточни пошук.</p>':''}${list.length===0?'<div class="empty">Нічого не знайдено. Спробуй іншу дату, прізвище або слово.</div>':''}`}
function showLibrary(filter=''){let term=filter.trim().toLowerCase();let list=QUESTIONS.filter(q=>!term||(`${q.id} ${q.question} ${q.topic} ${Object.values(q.options).join(' ')} ${q.options[q.answer]}`).toLowerCase().includes(term));app.innerHTML=`<div class="section-head"><div><div class="eyebrow">Пошук у базі</div><h2>Дати, постаті та запитання</h2></div><button class="btn ghost" onclick="shell()">← Головна</button></div><div class="toolbar"><input id="search" class="field search" placeholder="Наприклад: 1991, Хмельницький, Геродот…" value="${esc(filter)}" oninput="updateLibraryResults(this.value)"><span class="pill" id="libraryCount">${list.length} / 500</span></div><div class="content" id="libraryResults">${libraryResultsHTML(list)}</div>`}
function updateLibraryResults(value){let term=value.trim().toLowerCase();let list=QUESTIONS.filter(q=>!term||(`${q.id} ${q.question} ${q.topic} ${Object.values(q.options).join(' ')} ${q.options[q.answer]}`).toLowerCase().includes(term));const results=document.getElementById('libraryResults'),count=document.getElementById('libraryCount');if(results)results.innerHTML=libraryResultsHTML(list);if(count)count.textContent=`${list.length} / 500`;}
function showAllQuestions(filter='',topicFilter=''){
 const term=filter.trim().toLowerCase();
 const list=QUESTIONS.filter(q=>(!topicFilter||q.topic===topicFilter)&&(!term||(`${q.id} ${q.question} ${q.topic} ${Object.values(q.options).join(' ')}`).toLowerCase().includes(term)));
 const grouped=[...new Set(list.map(q=>q.topic))].map(t=>({topic:t,items:list.filter(q=>q.topic===t)}));
 const topicOptions=topics.map(t=>`<option value="${esc(t)}" ${topicFilter===t?'selected':''}>${esc(t)}</option>`).join('');
 app.innerHTML=`<div class="section-head"><div><div class="eyebrow">Повний текст тесту</div><h2>Усі запитання з відповідями</h2></div><button class="btn ghost" onclick="shell()">← Головна</button></div>
 <p class="muted">Запитання наведені в порядку документа. Правильний варіант позначений зеленим і галочкою.</p>
 <div class="test-review-tools"><input class="field search" id="allTestSearch" placeholder="Пошук за запитанням або варіантом…" value="${esc(filter)}" oninput="allTestSearchChanged(this)"><select class="field" id="allTestTopic" onchange="showAllQuestions(document.getElementById('allTestSearch').value,this.value)"><option value="">Усі теми</option>${topicOptions}</select><span class="pill">${list.length} / 500 запитань</span></div>
 <div>${grouped.map(g=>`<details class="test-review-group"><summary><span>${esc(g.topic)}</span><span class="pill">${g.items.length} питань</span></summary>${g.items.map(q=>`<article class="test-review-question"><div class="test-review-meta">Запитання №${q.id}</div><h3>${esc(q.question)}</h3><div class="test-review-options">${letters.map(l=>`<div class="test-review-option ${l===q.answer?'is-answer':''}"><b>${l}.</b> ${esc(q.options[l])}${l===q.answer?'<span class="answer-mark"> ✓ Правильна відповідь</span>':''}</div>`).join('')}</div></article>`).join('')}</details>`).join('')||'<div class="empty">За цим запитом нічого не знайдено.</div>'}</div>`;
}

function showProgress(){let hist=stats.history.slice(-14);let max=100;let bars=hist.map((h,i)=>`<div class="chart-col"><span class="chart-value">${h.score}%</span><div class="chart-bar" style="height:${Math.max(3,h.score)}%;max-height:130px"></div><span class="chart-label">${h.date.slice(5)}</span></div>`).join('');let ranked=[...stats.wrong].sort((a,b)=>(stats.reviewCounts[b]||0)-(stats.reviewCounts[a]||0)).map(id=>QUESTIONS.find(x=>x.id===id)).filter(Boolean);app.innerHTML=`<div class="section-head"><div><div class="eyebrow">Твоя підготовка</div><h2>Статистика й успішність</h2></div><button class="btn ghost" onclick="shell()">← Головна</button></div><div class="stats"><div class="stat"><strong>${stats.answered}</strong><span>Відповідей дано</span></div><div class="stat"><strong>${stats.correct}</strong><span>Правильних</span></div><div class="stat"><strong>${stats.answered-stats.correct}</strong><span>Неправильних</span></div><div class="stat"><strong>${pct()}%</strong><span>Точність</span></div></div><div class="small" style="margin:-8px 2px 12px">Пропущених запитань в іспитах: <b>${stats.skipped}</b>. Вони додаються до списку повторення, але не рахуються як надані відповіді.</div><div class="content"><h3>Графік останніх ${hist.length} сесій</h3>${hist.length?`<div class="chart-bars">${bars}</div><div class="small">Стовпчик показує відсоток правильних відповідей у кожній завершеній сесії.</div>`:'<div class="empty">Графік з’явиться після першого завершеного тренування.</div>'}</div><div class="content" style="margin-top:14px"><h3>Запитання для розумного повторення</h3><p class="small">Складніші питання, у яких помилявся частіше, показуються першими. Правильна відповідь прибирає питання зі списку повторення.</p>${ranked.length?ranked.map(q=>`<div class="result-row"><div class="small">№${q.id} · ${esc(q.topic)} · помилок: ${stats.reviewCounts[q.id]||0}</div><strong>${esc(q.question)}</strong><div class="small">Правильно: ${q.answer}. ${esc(q.options[q.answer])}</div></div>`).join(''):'<div class="empty">Поки немає питань для повторення. Чудово!</div>'}<div class="actions" style="margin-top:18px"><button class="btn" onclick="startMistakes()" ${stats.wrong.length?'':'disabled'}>Розумне повторення</button><button class="btn danger" onclick="resetStats()">Скинути статистику</button></div></div>`}
function calendarDateLabel(raw,q){
 const isApprox=/близько|приблизно/i.test(q.question);
 let label=raw.replace(/\s+/g,' ').trim();
 label=label.replace(/року|років|рік|роки/gi,'р.').replace(/рр?\.?/gi,'р.').replace(/\s*до\s*н\.?\s*е\.?/gi,' до н. е.').replace(/\s*н\.?\s*е\.?/gi,' н. е.');
 label=label.replace(/\s+/g,' ').trim();
 if(isApprox&&!/^близько/i.test(label))label='Близько '+label;
 return label;
}
function calendarEventTitle(q,answer){
 if(q.id===24)return 'Зникнення трипільської культури';
 return answer;
}
function showTimeline(filter='',centuryFilter=''){
 const entries=[];
 const patterns=[
  {kind:'prehistoric',re:/\b(?:близько\s*)?(\d{1,3}(?:[–—-]\d{1,3})?)\s*(млн\s+років|тис\.?\s*років|тисяч(?:і)?\s+років)/gi},
  {kind:'year',re:/\b(\d{3,4}(?:[–—-]\d{2,4})?)\s*(рок(?:у|ів|и|ах)?|рр?\.?)(?:\s*(до\s*н\.?\s*е\.?|н\.?\s*е\.?))?/gi},
  {kind:'century',re:/\b([IVX]{1,8}(?:[–—-][IVX]{1,8})?)\s*ст\.?\s*(до\s*н\.?\s*е\.?|н\.?\s*е\.?)?/gi}
 ];
 QUESTIONS.forEach(q=>{
  const source=q.question;
  patterns.forEach(p=>{
   p.re.lastIndex=0; let m;
   while((m=p.re.exec(source))!==null){
    const raw=m[0].replace(/\s+/g,' ').trim();
    const era=(p.kind==='century'?(m[2]||''):(m[3]||'')).toLowerCase();
    let value=0,group='';
    if(p.kind==='prehistoric'){
     const n=Number((m[1].match(/\d+/)||['0'])[0]);
     value=-n*(m[2].toLowerCase().includes('млн')?1000000000:100000);
     group='Доісторична доба';
    }else if(p.kind==='year'){
     const first=Number((m[1].match(/\d+/)||['0'])[0]);
     const bce=era.includes('до'); value=bce?-first:first;
     group=centuryName(Math.ceil(first/100),bce);
    }else{
     const first=m[1].split(/[–—-]/)[0];
     const c=romanToInt(first); const bce=era.includes('до');
     value=bce?-c*100:c*100;
     group=(m[1].includes('–')||m[1].includes('-')||m[1].includes('—'))?`${m[1].replace(/[–—]/g,'–')} ст. ${bce?'до н. е.':'н. е.'}`:centuryName(c,bce);
    }
    if(!raw || !Number.isFinite(value)) continue;
    const answer=q.options[q.answer];
    const topic=q.topic.replace(/^[^A-Za-zА-Яа-яІіЇїЄєҐґ]+/,'').replace(/^[IVX]+\.\s*/,'');
    const context=source.replace(/[?]+$/,'');
    const note=`У тесті подію розглянуто в темі «${topic}». Контекст: ${context.length>190?context.slice(0,187)+'…':context}.`;
    entries.push({raw:calendarDateLabel(raw,q),value,group,q,event:calendarEventTitle(q,answer),answer:`${q.answer}. ${answer}`,note});
   }
  });
 });
 const seen=new Set();
 let unique=entries.filter(e=>{const k=e.q.id+'|'+e.raw.toLowerCase();if(seen.has(k))return false;seen.add(k);return true;});
 unique.sort((a,b)=>a.value-b.value||a.q.id-b.q.id);
 const groups=[];const groupMap=new Map();
 unique.forEach(e=>{if(!groupMap.has(e.group)){const g={name:e.group,items:[],value:e.value};groupMap.set(e.group,g);groups.push(g)}groupMap.get(e.group).items.push(e)});
 groups.sort((a,b)=>a.value-b.value);
 const allCount=unique.length;
 const qf=filter.trim().toLowerCase();
 const filteredGroups=groups.map(g=>({...g,items:g.items.filter(e=>!qf||(e.raw+' '+e.event+' '+e.answer+' '+e.note+' '+e.q.topic+' '+e.q.question).toLowerCase().includes(qf))})).filter(g=>g.items.length&&(!centuryFilter||g.name===centuryFilter));
 const options=groups.map(g=>`<option value="${esc(g.name)}" ${centuryFilter===g.name?'selected':''}>${esc(g.name)} (${g.items.length})</option>`).join('');
 const count=filteredGroups.reduce((n,g)=>n+g.items.length,0);
 app.innerHTML=`<div class="section-head"><div><div class="eyebrow">Календар за матеріалами тесту</div><h2>Хронологія згадок у тесті</h2></div><button class="btn ghost" onclick="shell()">← Головна</button></div>
 <div class="calendar-intro"><span>📅 ${count} згадок дат у вибірці</span><span>·</span><span>За датами, згаданими в запитаннях</span></div>
 <div class="toolbar"><input class="field search" id="timelineSearch" placeholder="Пошук за датою, подією, відповіддю або темою…" value="${esc(filter)}" oninput="timelineSearchChanged(this)"><select class="field" id="centuryFilter" onchange="showTimeline(document.getElementById('timelineSearch').value,this.value)"><option value="">Усі століття</option>${options}</select></div>
 <div class="content"><div class="calendar-intro"><span>У кожній картці є дата, історична подія, відповідь за ключем і довідка з контекстом запитання.</span><span class="pill">${allCount} записів дат</span></div>
 ${filteredGroups.map((g,i)=>`<details class="calendar-century" ${i===0?'open':''}><summary><span>${esc(g.name)}</span><span class="century-count">${g.items.length} ${g.items.length===1?'подія':'подій'}</span></summary><div class="calendar-grid">${g.items.map(e=>`<article class="calendar-event"><div class="calendar-event-date">${esc(e.raw)}</div><h3>${esc(e.event)}</h3><div class="calendar-answer"><strong>Правильна відповідь із тесту</strong><br>${esc(e.answer)}</div><div class="calendar-note"><strong>Контекст запитання.</strong> ${esc(e.note)}</div><div class="calendar-topic">Запитання №${e.q.id} · ${esc(e.q.topic)}</div></article>`).join('')}</div></details>`).join('')||'<div class="calendar-empty">За цим пошуком подій не знайдено.</div>'}
 <p class="small" style="margin:12px 4px 0">Цей список автоматично сформовано з дат у формулюваннях 500 тестових запитань; він не є незалежно перевіреним календарем подій. Довідки передають контекст формулювань документа; це не повний перелік усіх історичних подій.</p></div>`;
}
function timelineSearchChanged(input){const pos=input.selectionStart;const value=input.value;const cf=document.getElementById('centuryFilter')?.value||'';showTimeline(value,cf);const next=document.getElementById('timelineSearch');next.focus();next.setSelectionRange(pos,pos)}
function romanToInt(s){const map={I:1,V:5,X:10,L:50,C:100,D:500,M:1000};let n=0,prev=0;for(let i=s.length-1;i>=0;i--){const v=map[s[i]]||0;n+=v<prev?-v:v;prev=Math.max(prev,v)}return n}
function intToRoman(num){const vals=[[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];let out='';for(const [v,s] of vals){while(num>=v){out+=s;num-=v}}return out}
function centuryName(c,bce){return `${intToRoman(Math.max(1,c))} ст. ${bce?'до н. е.':'н. е.'}`}
function resetStats(){if(confirm('Скинути всю статистику та список помилок?')){stats={answered:0,correct:0,wrong:[],reviewCounts:{},attempts:{},history:[],skipped:0};persist();showProgress()}}
