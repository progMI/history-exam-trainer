266:{"text":"Правильна відповідь — «Ратушу». Це географічний орієнтир теми «Українські землі у складі інших держав: Польща, Угорщина, Московія, Молдавія»: місце допомагає зрозуміти, де відбувалися події та як вони пов’язані з політичним або культурним простором України. Запам’ятовуй його разом із подією, а не окремо. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
267:{"text":"Правильна відповідь — «Запровадження фільваркової системи господарювання та посилення панщини». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Соціально-економічне життя, кріпацтво та поява козацтва (XVI ст.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
268:{"text":"Правильна відповідь — «Багатогалузеве панське господарство, що базувалося на безкоштовній праці кріпаків і було орієнтоване на продаж зерна на ринок». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Соціально-економічне життя, кріпацтво та поява козацтва (XVI ст.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
269:{"text":"Правильна відповідь — «Юридичне закріпачення селян (обмеження права переходу)». Вирішальна підказка міститься в описі події або джерельному фрагменті: він указує на характерні обставини, учасників чи наслідки. Тому відповідь потрібно пов’язувати саме з цим епізодом теми «Соціально-економічне життя, кріпацтво та поява козацтва (XVI ст.)», а не лише запам’ятовувати назву. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
270:{"text":"Правильна відповідь — «Третій Литовський статут». Документ слід упізнавати за його змістом і наслідками, описаними в запитанні: саме ці ознаки відрізняють його від інших актів доби. У темі «Соціально-економічне життя, кріпацтво та поява козацтва (XVI ст.)» він показує, як юридичні рішення змінювали владу, права або суспільні відносини. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"Третій Литовський статут 1588 р. посилив залежність селян і закріпив тривалий розшук утікачів; конкретні механізми кріпацтва формувалися поступово.","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},

273:{"text":"Правильна відповідь — «Релігійного та національного утиску українських міщан». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Соціально-економічне життя, кріпацтво та поява козацтва (XVI ст.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
274:{"text":"Правильна відповідь — «Першу писемну згадку про українських козаків у джерелах». Вирішальна підказка міститься в описі події або джерельному фрагменті: він указує на характерні обставини, учасників чи наслідки. Тому відповідь потрібно пов’язувати саме з цим епізодом теми «Соціально-економічне життя, кріпацтво та поява козацтва (XVI ст.)», а не лише запам’ятовувати назву. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
275:{"text":"Правильна відповідь — «Панщина». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Соціально-економічне життя, кріпацтво та поява козацтва (XVI ст.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
276:{"text":"Правильна відповідь — «Найсвятіша і найбагатша верства великих землевласників (князі Острозькі, Вишневецькі, Сангушки)». Запитання перевіряє зв’язок між історичною постаттю та її конкретною роллю: важливо запам’ятати не лише ім’я, а й дію або обставину, з якою його пов’язано. Це один із ключових персональних орієнтирів теми «Соціально-економічне життя, кріпацтво та поява козацтва (XVI ст.)». Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
277:{"text":"Правильна відповідь — «Люблінської унії». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Люблінська унія 1569 р. та адміністративні зміни». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
278:{"text":"Правильна відповідь — «Річ Посполита». Це поняття або назва, яка позначає характерну рису теми «Люблінська унія 1569 р. та адміністративні зміни». Щоб упізнавати його в тестах, звертай увагу на визначальну ознаку, наведену в запитанні, і пов’язуй її з цим терміном.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
279:{"text":"Правильна відповідь — «Вони були безпосередньо інкорпоровані (включені) до складу Корони Польської». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Люблінська унія 1569 р. та адміністративні зміни». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},

282:{"text":"Правильна відповідь — «Власне законодавство (Литовські статути), герб, печатку, армію та фінанси». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Люблінська унія 1569 р. та адміністративні зміни». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},

285:{"text":"Правильна відповідь — «Костянтин-Василь Острозький». Запитання перевіряє зв’язок між історичною постаттю та її конкретною роллю: важливо запам’ятати не лише ім’я, а й дію або обставину, з якою його пов’язано. Це один із ключових персональних орієнтирів теми «Люблінська унія 1569 р. та адміністративні зміни».","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
286:{"text":"Правильна відповідь — «Створення Чернігівського воєводства». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Люблінська унія 1569 р. та адміністративні зміни». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
287:{"text":"Правильна відповідь — «Уходництва (промислу, що передував козацтву)». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Виникнення козацтва, Дмитро Вишневецький та перші Січі». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
288:{"text":"Правильна відповідь — «Дмитро Вишневецький (Байда)». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Виникнення козацтва, Дмитро Вишневецький та перші Січі». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
289:{"text":"Правильна відповідь — «Створити опорний пункт для спільної боротьби християнських держав проти Кримського ханства та османів». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Виникнення козацтва, Дмитро Вишневецький та перші Січі». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
290:{"text":"Правильна відповідь — «Дмитра Вишневецького». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Виникнення козацтва, Дмитро Вишневецький та перші Січі». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"Деталі загибелі Дмитра Вишневецького в османському полоні передаються в різних версіях; народна пісня — не нейтральний протокол події.","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
291:{"text":"Правильна відповідь — «Запорозька Січ». Це географічний орієнтир теми «Виникнення козацтва, Дмитро Вишневецький та перші Січі»: місце допомагає зрозуміти, де відбувалися події та як вони пов’язані з політичним або культурним простором України. Запам’ятовуй його разом із подією, а не окремо. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
292:{"text":"Правильна відповідь — «Козацьку раду (Генеральну раду)». Це географічний орієнтир теми «Виникнення козацтва, Дмитро Вишневецький та перші Січі»: місце допомагає зрозуміти, де відбувалися події та як вони пов’язані з політичним або культурним простором України. Запам’ятовуй його разом із подією, а не окремо. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
293:{"text":"Правильна відповідь — «Козацькі клейноди». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Виникнення козацтва, Дмитро Вишневецький та перші Січі». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
294:{"text":"Правильна відповідь — «Булава». Це поняття або назва, яка позначає характерну рису теми «Виникнення козацтва, Дмитро Вишневецький та перші Січі». Щоб упізнавати його в тестах, звертай увагу на визначальну ознаку, наведену в запитанні, і пов’язуй її з цим терміном.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
295:{"text":"Правильна відповідь — «Бунчук». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Виникнення козацтва, Дмитро Вишневецький та перші Січі». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
296:{"text":"Правильна відповідь — «Голова січового товариства, який обирався на рік козацькою радою і мав найвищу військову, адміністративну та судову владу на Січі». Запитання перевіряє зв’язок між історичною постаттю та її конкретною роллю: важливо запам’ятати не лише ім’я, а й дію або обставину, з якою його пов’язано. Це один із ключових персональних орієнтирів теми «Виникнення козацтва, Дмитро Вишневецький та перші Січі». Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},

298:{"text":"Правильна відповідь — «Звільнення від податків і панщини, власне судочинство, право володіти землею та отримувати платню грошима й сукном». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Реєстрове козацтво та перші козацькі повстання (кінець XVI ст.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},

304:{"text":"Правильна відповідь — «Його було жорстоко катовано і страчено (четвертовано), а за легендою — спалено у мідному бику». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Реєстрове козацтво та перші козацькі повстання (кінець XVI ст.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
305:{"text":"Правильна відповідь — «Козаків оголошено ворогами держави та бунтівниками («банітами»), а їхні права тимчасово скасовано». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Реєстрове козацтво та перші козацькі повстання (кінець XVI ст.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
306:{"text":"Правильна відповідь — «Кирила Розумовського». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Обмеження автономії, Малоросійські колегії та останні гетьмани». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
307:{"text":"Правильна відповідь — «Палац Кирила Розумовського». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Обмеження автономії, Малоросійські колегії та останні гетьмани». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
308:{"text":"Правильна відповідь — «Указу про ліквідацію гетьманства та створення Другої Малоросійської колегії». Документ слід упізнавати за його змістом і наслідками, описаними в запитанні: саме ці ознаки відрізняють його від інших актів доби. У темі «Обмеження автономії, Малоросійські колегії та останні гетьмани» він показує, як юридичні рішення змінювали владу, права або суспільні відносини. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
309:{"text":"Правильна відповідь — «Обмежили свої права і легко були русифіковані (обрусіли), щоб не дивилися в ліс, як вовки». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Обмеження автономії, Малоросійські колегії та останні гетьмани». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
310:{"text":"Правильна відповідь — «Указ про закріпачення селян Лівобережжя 1783 року». Документ слід упізнавати за його змістом і наслідками, описаними в запитанні: саме ці ознаки відрізняють його від інших актів доби. У темі «Обмеження автономії, Малоросійські колегії та останні гетьмани» він показує, як юридичні рішення змінювали владу, права або суспільні відносини. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"Указ 1783 р. запровадив кріпосну залежність на Лівобережжі та Слобожанщині; формулювання про «остаточне» зрівняння старшини з дворянством спрощує кілька окремих реформ.","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
311:{"text":"Правильна відповідь — «Гайдамаками». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Гайдамаччина, Опришківство та Коліївщина (Правобережжя та Карпати)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
312:{"text":"Правильна відповідь — «Олексу Довбуша». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Гайдамаччина, Опришківство та Коліївщина (Правобережжя та Карпати)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
313:{"text":"Правильна відповідь — «Коліївщину (найвищу точку гайдамацького руху 1678 р.)». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Гайдамаччина, Опришківство та Коліївщина (Правобережжя та Карпати)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
314:{"text":"Правильна відповідь — «Запросив Залізняка та Гонту на бенкет нібито для союзу, де їх зрадницько заарештували, після чого Гонту віддали на страшну кару полякам, а Залізняка заслали до Сибіру». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Гайдамаччина, Опришківство та Коліївщина (Правобережжя та Карпати)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
315:{"text":"Правильна відповідь — «Остаточну ліквідацію Нової (Підпільненської) Запорозької Січі військами генерала Текелія». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Ліквідація Запорозької Січі та поділи Речі Посполитої (кінець XVIII ст.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
316:{"text":"Правильна відповідь — «Петра Калнишевського». Це географічний орієнтир теми «Ліквідація Запорозької Січі та поділи Речі Посполитої (кінець XVIII ст.)»: місце допомагає зрозуміти, де відбувалися події та як вони пов’язані з політичним або культурним простором України. Запам’ятовуй його разом із подією, а не окремо. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
317:{"text":"Правильна відповідь — «За Дунай (утворивши Задунайську Січ)». Це географічний орієнтир теми «Ліквідація Запорозької Січі та поділи Речі Посполитої (кінець XVIII ст.)»: місце допомагає зрозуміти, де відбувалися події та як вони пов’язані з політичним або культурним простором України. Запам’ятовуй його разом із подією, а не окремо.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
318:{"text":"Правильна відповідь — «Чорноморське козацьке військо». Це поняття або назва, яка позначає характерну рису теми «Ліквідація Запорозької Січі та поділи Речі Посполитої (кінець XVIII ст.)». Щоб упізнавати його в тестах, звертай увагу на визначальну ознаку, наведену в запитанні, і пов’язуй її з цим терміном.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
319:{"text":"Правильна відповідь — «Трьох поділів Речі Посполитої». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Ліквідація Запорозької Січі та поділи Речі Посполитої (кінець XVIII ст.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
320:{"text":"Правильна відповідь — «Повна ліквідація козацького устрою, автономії Гетьманщини, Запорозької Січі та Слобожанщини; українські землі були повністю уніфіковані та поділені на губернії між двома імперіями — Російською та Австрійською». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Ліквідація Запорозької Січі та поділи Речі Посполитої (кінець XVIII ст.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант.","note":"Ліквідація автономних інституцій відбувалася поетапно впродовж XVIII ст.; 1796 р. — умовна підсумкова дата адміністративного впорядкування, а не момент усіх змін.","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
321:{"text":"Правильна відповідь — «Виходом у світ перших трьох частин «Енеїди» І. Котляревського». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Початок національного відродження та «Енеїда» (кінець XVIII – початок XIX ст.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
322:{"text":"Правильна відповідь — ««Історія русів»». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Початок національного відродження та «Енеїда» (кінець XVIII – початок XIX ст.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
323:{"text":"Правильна відповідь — «Харківський університет». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Початок національного відродження та «Енеїда» (кінець XVIII – початок XIX ст.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
324:{"text":"Правильна відповідь — ««Украинский вестник»». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Початок національного відродження та «Енеїда» (кінець XVIII – початок XIX ст.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
325:{"text":"Правильна відповідь — «Полтавське таємне товариство (Масонська ложа «Любов до істини»)». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Початок національного відродження та «Енеїда» (кінець XVIII – початок XIX ст.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
326:{"text":"Правильна відповідь — ««Руська Правда» П. Пестеля». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Рух декабристів та польське повстання в Україні (1820-ті – 1830-ті рр.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
327:{"text":"Правильна відповідь — «Товариство об'єднаних слов'ян». Це географічний орієнтир теми «Рух декабристів та польське повстання в Україні (1820-ті – 1830-ті рр.)»: місце допомагає зрозуміти, де відбувалися події та як вони пов’язані з політичним або культурним простором України. Запам’ятовуй його разом із подією, а не окремо. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
328:{"text":"Правильна відповідь — «Повстання Чернігівського полку». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Рух декабристів та польське повстання в Україні (1820-ті – 1830-ті рр.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
329:{"text":"Правильна відповідь — ««За нашу і вашу свободу!»». Тут перевіряється хронологічна прив’язка: цю дату або період потрібно співвіднести з подією, названою в запитанні. У темі «Рух декабристів та польське повстання в Україні (1820-ті – 1830-ті рр.)» це допомагає розташувати факт у правильній послідовності.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
330:{"text":"Правильна відповідь — «Відкриття Імператорського університету Святого Володимира (Київського університету)». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Рух декабристів та польське повстання в Україні (1820-ті – 1830-ті рр.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
331:{"text":"Правильна відповідь — «Військові поселення». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Соціальні рухи, військово-кріпосницька система та Кармелюк». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},

333:{"text":"Правильна відповідь — ««Похід у таврію за волею»». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Соціальні рухи, військово-кріпосницька система та Кармелюк». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
334:{"text":"Правильна відповідь — ««Київська козаччина» (1855 р.)». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Соціальні рухи, військово-кріпосницька система та Кармелюк». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
335:{"text":"Правильна відповідь — «Кирило-Мефодіївське братство». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Кирило-Мефодіївське братство та Тарас Шевченко (1845–1847 рр.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
336:{"text":"Правильна відповідь — «М. Костомаров, В. Білозерський, М. Гулак, П. Куліш, Т. Шевченко». Запитання перевіряє зв’язок між історичною постаттю та її конкретною роллю: важливо запам’ятати не лише ім’я, а й дію або обставину, з якою його пов’язано. Це один із ключових персональних орієнтирів теми «Кирило-Мефодіївське братство та Тарас Шевченко (1845–1847 рр.)».","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
337:{"text":"Правильна відповідь — ««Книга буття українського народу» (або «Закон Божий»)». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Кирило-Мефодіївське братство та Тарас Шевченко (1845–1847 рр.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
338:{"text":"Правильна відповідь — «Скасування кріпацтва, ліквідація станового поділу, повалення самодержавства, республіканський устрій та створення федерації слов'янських народів із центром у Києві». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Кирило-Мефодіївське братство та Тарас Шевченко (1845–1847 рр.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
339:{"text":"Правильна відповідь — ««Кобзар» Тараса Шевченка». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Кирило-Мефодіївське братство та Тарас Шевченко (1845–1847 рр.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
340:{"text":"Правильна відповідь — «Заслання солдатом в Оренбурзький окремий корпус із суворою царською забороною «писати і малювати»». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Кирило-Мефодіївське братство та Тарас Шевченко (1845–1847 рр.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"Покарання Шевченка було пов’язане з вироком у справі Кирило-Мефодіївського братства; царська заборона писати й малювати була окремою особливо жорсткою умовою.","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
341:{"text":"Правильна відповідь — «Східна Галичина, Північна Буковина, Закарпаття». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Українські землі у складі Австрійської імперії: «Руська трійця» та 1848 рік». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
342:{"text":"Правильна відповідь — «Лук'ян Кобилиця». Запитання перевіряє зв’язок між історичною постаттю та її конкретною роллю: важливо запам’ятати не лише ім’я, а й дію або обставину, з якою його пов’язано. Це один із ключових персональних орієнтирів теми «Українські землі у складі Австрійської імперії: «Руська трійця» та 1848 рік».","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
343:{"text":"Правильна відповідь — ««Руська трійця»». Це поняття або назва, яка позначає характерну рису теми «Українські землі у складі Австрійської імперії: «Руська трійця» та 1848 рік». Щоб упізнавати його в тестах, звертай увагу на визначальну ознаку, наведену в запитанні, і пов’язуй її з цим терміном.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
344:{"text":"Правильна відповідь — «Маркіян Шашкевич, Іван Вагилевич, Яків Головацький». Запитання перевіряє зв’язок між історичною постаттю та її конкретною роллю: важливо запам’ятати не лише ім’я, а й дію або обставину, з якою його пов’язано. Це один із ключових персональних орієнтирів теми «Українські землі у складі Австрійської імперії: «Руська трійця» та 1848 рік». Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},

348:{"text":"Правильна відповідь — «Ідею єдності (соборності) галицьких русинів із наддніпрянськими українцями та вимогу національно-територіальної автономії». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Українські землі у складі Австрійської імперії: «Руська трійця» та 1848 рік». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},

350:{"text":"Правильна відповідь — «Остаточне і повне скасування панщини (селянська реформа в Австрійській імперії)». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Українські землі у складі Австрійської імперії: «Руська трійця» та 1848 рік». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"Скасування панщини в Габсбурзькій монархії пов’язане з революцією 1848 р.; правові деталі й практичне впровадження відрізнялися за краями.","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},

354:{"text":"Правильна відповідь — «Квітка-Основ'яненко (Григорій Квітка)». Запитання перевіряє зв’язок між історичною постаттю та її конкретною роллю: важливо запам’ятати не лише ім’я, а й дію або обставину, з якою його пов’язано. Це один із ключових персональних орієнтирів теми «Культурні та релігійні процеси першої половини ХІХ століття». Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
355:{"text":"Правильна відповідь — «Романтизм». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Культурні та релігійні процеси першої половини ХІХ століття». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
356:{"text":"Правильна відповідь — «Одеський оперний театр (перша будівля)». Це географічний орієнтир теми «Культурні та релігійні процеси першої половини ХІХ століття»: місце допомагає зрозуміти, де відбувалися події та як вони пов’язані з політичним або культурним простором України. Запам’ятовуй його разом із подією, а не окремо.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},

359:{"text":"Правильна відповідь — «Азовське козацьке військо». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Культурні та релігійні процеси першої половини ХІХ століття». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
360:{"text":"Правильна відповідь — «Перехід від першого (етнографічно-дослідницького) етапу національного відродження до другого (культурно-літературного та політичного), формування перших концепцій автономії та соборності України завдяки діяльності Кирило-Мефодіївського братства та Головної руської ради». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Культурні та релігійні процеси першої половини ХІХ століття». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
361:{"text":"Правильна відповідь — «Селянську реформу (скасування кріпацтва)». Вирішальна підказка міститься в описі події або джерельному фрагменті: він указує на характерні обставини, учасників чи наслідки. Тому відповідь потрібно пов’язувати саме з цим епізодом теми «Реформи 1860–1870-х років, Громадівський рух та Хлопомани», а не лише запам’ятовувати назву. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
362:{"text":"Правильна відповідь — «Селяни, які звільнялися від особистої залежності, але мусили відробляти панщину чи платити оброк поміщику до укладення викупної угоди за землю». Запитання перевіряє зв’язок між історичною постаттю та її конкретною роллю: важливо запам’ятати не лише ім’я, а й дію або обставину, з якою його пов’язано. Це один із ключових персональних орієнтирів теми «Реформи 1860–1870-х років, Громадівський рух та Хлопомани». Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},

365:{"text":"Правильна відповідь — «Петербурзька громада». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Реформи 1860–1870-х років, Громадівський рух та Хлопомани». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
366:{"text":"Правильна відповідь — «Михайла Драгоманова». Це географічний орієнтир теми «Реформи 1860–1870-х років, Громадівський рух та Хлопомани»: місце допомагає зрозуміти, де відбувалися події та як вони пов’язані з політичним або культурним простором України. Запам’ятовуй його разом із подією, а не окремо. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},

368:{"text":"Правильна відповідь — «Валуєвського циркуляра». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Царські заборони: Валуєвський циркуляр та Емський указ». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},

370:{"text":"Правильна відповідь — «Емський указ». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Царські заборони: Валуєвський циркуляр та Емський указ». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"Емський указ 1876 р. обмежив українське книгодрукування, ввезення видань і публічне використання української мови; слово «тотальна» є оцінним узагальненням.","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
371:{"text":"Правильна відповідь — «Південно-Західне відділення Російського географічного товариства та газету «Киевский телеграф»». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Царські заборони: Валуєвський циркуляр та Емський указ». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},

373:{"text":"Правильна відповідь — ««Український П'ємонт»». Це поняття або назва, яка позначає характерну рису теми «Українські землі у складі Австро-Угорщини (друга половина ХІХ ст.)». Щоб упізнавати його в тестах, звертай увагу на визначальну ознаку, наведену в запитанні, і пов’язуй її з цим терміном.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},

377:{"text":"Правильна відповідь — «Народовці». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Українські землі у складі Австро-Угорщини (друга половина ХІХ ст.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
378:{"text":"Правильна відповідь — «Русько-українська радикальна партія (РУРП)». Це поняття або назва, яка позначає характерну рису теми «Українські землі у складі Австро-Угорщини (друга половина ХІХ ст.)». Щоб упізнавати його в тестах, звертай увагу на визначальну ознаку, наведену в запитанні, і пов’язуй її з цим терміном.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
379:{"text":"Правильна відповідь — ««Нову еру»». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Українські землі у складі Австро-Угорщини (друга половина ХІХ ст.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
380:{"text":"Правильна відповідь — «Перехід українського національного руху від культурницької фази до політичної, поява перших політичних партій, висунення вимог автономії (Наддніпрянщина) та самостійності й поділу Галичини, що підготувало націю до подій початку ХХ століття». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Українські землі у складі Австро-Угорщини (друга половина ХІХ ст.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
381:{"text":"Правильна відповідь — «Революційну українську партію (РУП)». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Поява перших партій Наддніпрянщини та революція 1905–1907 років». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
382:{"text":"Правильна відповідь — «Брошури «Самостійна Україна»». Запитання перевіряє зв’язок між історичною постаттю та її конкретною роллю: важливо запам’ятати не лише ім’я, а й дію або обставину, з якою його пов’язано. Це один із ключових персональних орієнтирів теми «Поява перших партій Наддніпрянщини та революція 1905–1907 років». Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
383:{"text":"Правильна відповідь — «Українська народна партія (УНП)». Це поняття або назва, яка позначає характерну рису теми «Поява перших партій Наддніпрянщини та революція 1905–1907 років». Щоб упізнавати його в тестах, звертай увагу на визначальну ознаку, наведену в запитанні, і пов’язуй її з цим терміном.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
384:{"text":"Правильна відповідь — «Повстання на панцернику (броненосці) «Потьомкін»». Вирішальна підказка міститься в описі події або джерельному фрагменті: він указує на характерні обставини, учасників чи наслідки. Тому відповідь потрібно пов’язувати саме з цим епізодом теми «Поява перших партій Наддніпрянщини та революція 1905–1907 років», а не лише запам’ятовувати назву. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
385:{"text":"Правильна відповідь — «Октябрський маніфест 1905 року». Тут перевіряється хронологічна прив’язка: цю дату або період потрібно співвіднести з подією, названою в запитанні. У темі «Поява перших партій Наддніпрянщини та революція 1905–1907 років» це допомагає розташувати факт у правильній послідовності. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
386:{"text":"Правильна відповідь — ««Хлібороб»». Це поняття або назва, яка позначає характерну рису теми «Поява перших партій Наддніпрянщини та революція 1905–1907 років». Щоб упізнавати його в тестах, звертай увагу на визначальну ознаку, наведену в запитанні, і пов’язуй її з цим терміном.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
387:{"text":"Правильна відповідь — ««Рада»». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Поява перших партій Наддніпрянщини та революція 1905–1907 років». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
388:{"text":"Правильна відповідь — «Українська думська громада». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Поява перших партій Наддніпрянщини та революція 1905–1907 років». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
389:{"text":"Правильна відповідь — «Товариство українських поступовців (ТУП)». Це поняття або назва, яка позначає характерну рису теми «Поява перших партій Наддніпрянщини та революція 1905–1907 років». Щоб упізнавати його в тестах, звертай увагу на визначальну ознаку, наведену в запитанні, і пов’язуй її з цим терміном.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
390:{"text":"Правильна відповідь — «Столипінської аграрної реформи». Документ слід упізнавати за його змістом і наслідками, описаними в запитанні: саме ці ознаки відрізняють його від інших актів доби. У темі «Столипінська аграрна реформа та суспільні кризи (1906–1914 рр.)» він показує, як юридичні рішення змінювали владу, права або суспільні відносини. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
391:{"text":"Правильна відповідь — «Відокремлена селянська садиба із земельною ділянкою, розташована за межами села, куди селянин переносив своє житло і господарство». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Столипінська аграрна реформа та суспільні кризи (1906–1914 рр.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
392:{"text":"Правильна відповідь — «Земельна ділянка, яку селянин отримував у приватну власність в одному масиві замість кількох смуг у різних полях, залишаючи садибу в селі». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Столипінська аграрна реформа та суспільні кризи (1906–1914 рр.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
393:{"text":"Правильна відповідь — «Сибір, Далекий Схід (Зелений Клин) та Центральна Азія». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Столипінська аграрна реформа та суспільні кризи (1906–1914 рр.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
394:{"text":"Правильна відповідь — «Україна стала лідером за кількістю селян, що вийшли з общини (понад 50% на Правобережжі), сформувався міцний прошарок приватних селян-власників (куркулів) та зріс експорт зерна». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Столипінська аграрна реформа та суспільні кризи (1906–1914 рр.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},

396:{"text":"Правильна відповідь — «Чорносотенці». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Столипінська аграрна реформа та суспільні кризи (1906–1914 рр.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
397:{"text":"Правильна відповідь — «Боротьбу за загальне виборче право (виборчу реформу 1907 року)». Це поняття або назва, яка позначає характерну рису теми «Західноукраїнські землі: «Три порти» та напередодні війни». Щоб упізнавати його в тестах, звертай увагу на визначальну ознаку, наведену в запитанні, і пов’язуй її з цим терміном. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
398:{"text":"Правильна відповідь — «Окремого Українського університету у Львові». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Західноукраїнські землі: «Три порти» та напередодні війни». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
399:{"text":"Правильна відповідь — ««Сокіл», «Січ», «Пласт» (а також «Стрілецькі товариства»)». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Західноукраїнські землі: «Три порти» та напередодні війни». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
400:{"text":"Правильна відповідь — «Український рух в обох імперіях повністю структурувався, сформував чіткі політичні програми (від автономії до самостійності), створив легальні організації, пресу та молодіжні структури, перебуваючи на порозі великого державотворчого вибуху 1917–1918 років». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Західноукраїнські землі: «Три порти» та напередодні війни». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант.","note":"«Три порти» у назві теми можуть бути мнемонічною назвою; перевіряй кожен географічний факт окремо.","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
401:{"text":"Правильна відповідь — «Головну українську раду (ГУР)». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Перша світова війна та початок Української революції (1914–1917 рр.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
402:{"text":"Правильна відповідь — «Союз визволення України (СВУ)». Це географічний орієнтир теми «Перша світова війна та початок Української революції (1914–1917 рр.)»: місце допомагає зрозуміти, де відбувалися події та як вони пов’язані з політичним або культурним простором України. Запам’ятовуй його разом із подією, а не окремо. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
403:{"text":"Правильна відповідь — «Українські січові стрільці (УСС)». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Перша світова війна та початок Української революції (1914–1917 рр.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
404:{"text":"Правильна відповідь — «Галицько-Волинське генерал-губернаторство». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Перша світова війна та початок Української революції (1914–1917 рр.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
405:{"text":"Правильна відповідь — «Заснування Української Центральної Ради (УЦР)». Вирішальна підказка міститься в описі події або джерельному фрагменті: він указує на характерні обставини, учасників чи наслідки. Тому відповідь потрібно пов’язувати саме з цим епізодом теми «Перша світова війна та початок Української революції (1914–1917 рр.)», а не лише запам’ятовувати назву. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
406:{"text":"Правильна відповідь — «Першого Універсалу». Це географічний орієнтир теми «Перша світова війна та початок Української революції (1914–1917 рр.)»: місце допомагає зрозуміти, де відбувалися події та як вони пов’язані з політичним або культурним простором України. Запам’ятовуй його разом із подією, а не окремо. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
407:{"text":"Правильна відповідь — «Другий Універсал». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Перша світова війна та початок Української революції (1914–1917 рр.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
408:{"text":"Правильна відповідь — «Третій Універсал». Документ слід упізнавати за його змістом і наслідками, описаними в запитанні: саме ці ознаки відрізняють його від інших актів доби. У темі «Перша світова війна та початок Української революції (1914–1917 рр.)» він показує, як юридичні рішення змінювали владу, права або суспільні відносини. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
409:{"text":"Правильна відповідь — «Четвертого Універсалу». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Перша світова війна та початок Української революції (1914–1917 рр.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
410:{"text":"Правильна відповідь — «Бій під Крутами». Вона відповідає конкретній ознаці, описаній у запитанні, і допомагає розкрити одну з ключових тем розділу «Перша світова війна та початок Української революції (1914–1917 рр.)». Для запам’ятовування поєднай три елементи: історичний контекст, названу в запитанні підказку та правильний варіант. Під час роботи з цитатою шукай у ній власні назви, дату, учасників і характерні формулювання — це найнадійніші ключі до атрибуції джерела.","note":"Бій під Крутами відбувся 29 січня 1918 р.; кількість учасників і втрат у популярних описах різниться, тому число «триста» не варто сприймати буквально.","sources":[["Енциклопедія історії України (Інститут історії України НАН України)","https://resource.history.org.ua/ehu"],["Довідник з історії України: тематичні розділи","https://uahistory.co/book/dovidnik/"]]},
